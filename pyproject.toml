[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-liberation-engine"
version = "2.2.0"
description = "A lightweight, Unix-native creative workflow skeleton & zero-dependency developer gift shelf"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cle = "cle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cle = ["bundled_assets/**/*", "bundled_assets/**/**/*", "bundled_assets/**/**/**/*"]
