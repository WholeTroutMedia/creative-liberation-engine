version: "3.9"

networks:
  cle-v6:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cle_v6
      POSTGRES_USER: cle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cle_v6_dev}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - v6_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    networks: [cle-v6]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cle"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-cle_redis}
      --appendonly yes --appendfsync everysec --save 900 1 --save 300 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cle_redis}
    volumes:
      - v6_redis_data:/data
    networks: [cle-v6]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cle_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"
    volumes:
      - v6_chromadb_data:/chroma/chroma
    ports:
      - "${CHROMA_PORT:-8010}:8000"
    networks: [cle-v6]

  genkit:
    build:
      context: ./services
      dockerfile: genkit/Dockerfile
    restart: unless-stopped
    ports:
      - "${GENKIT_HOST_PORT:-4100}:4000"
      - "${GENKIT_UI_HOST_PORT:-3101}:3100"
    environment:
      NODE_ENV: production
      PORT: 4000
      GENKIT_ENV: dev
      GENKIT_API_KEY: ${GENKIT_API_KEY:-v6-local-key}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}

      # Local inference + embeddings through your workstation Ollama
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SOVEREIGN_MODE: "false"

      # Memory / retrieval
      CHROMA_URL: http://chromadb:8000

      # Exec glue
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379

      # Model selection used by dispatch worker for /generate
      GENKIT_DEFAULT_MODEL: ${GENKIT_DEFAULT_MODEL:-googleai/gemini-2.5-flash}
      ACCESS_TIER: studio

      # Token budget + behavior
      ARCHAEON_DEFAULT_MODEL: ${ARCHAEON_DEFAULT_MODEL:-gemini-flash}
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks: [cle-v6]

  dispatch:
    build:
      context: ./services
      dockerfile: dispatch/Dockerfile
    restart: unless-stopped
    ports:
      - "${DISPATCH_HOST_PORT:-5150}:5050"
    environment:
      PORT: 5150
      PROJECT: ${PROJECT:-creative-liberation-engine}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-5000}
      GENKIT_URL: http://genkit:4000
      DISPATCH_URL: http://cle-v6-dispatch-1:5150

      REDIS_PASSWORD: ${REDIS_PASSWORD:-cle_redis}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379

      POSTGRES_URL: postgresql://cle:${POSTGRES_PASSWORD:-cle_v6_dev}@postgres:5432/cle_v6
      DISPATCH_STORE_DIR: /data
    volumes:
      - v6_dispatch_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      genkit:
        condition: service_started
    networks: [cle-v6]

  dispatch-worker:
    build:
      context: ./services
      dockerfile: dispatch/Dockerfile
    restart: unless-stopped
    command: node build/worker.js
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      WORKER_ID: dispatch-worker-v6
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-2000}

      GENKIT_URL: http://genkit:4000
      DISPATCH_URL: http://cle-v6-dispatch-1:5150
      PROJECT: ${PROJECT:-creative-liberation-engine}

      GENKIT_API_KEY: ${GENKIT_API_KEY:-v6-local-key}

      REDIS_PASSWORD: ${REDIS_PASSWORD:-cle_redis}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379

      POSTGRES_URL: postgresql://cle:${POSTGRES_PASSWORD:-cle_v6_dev}@postgres:5432/cle_v6
      DISPATCH_STORE_DIR: /data

      CHROMA_URL: http://chromadb:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Helps the memory client decide embedding host
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - v6_dispatch_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      genkit:
        condition: service_started
      dispatch:
        condition: service_started
    networks: [cle-v6]

  lewm_inference:
    build:
      context: ./services/lewm_inference
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LEWM_HOST_PORT:-8000}:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./runtime/temp:/runtime/temp

  averi-memory-service:
    build:
      context: .
      dockerfile: services/averi-memory-service/Dockerfile
    restart: unless-stopped
    ports:
      - "${MEMORY_SERVICE_PORT:-3030}:3030"
    environment:
      PORT: 3030
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      CHROMA_URL: http://chromadb:8000
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks: [cle-v6]

  reasoning-core:
    build:
      context: .
      dockerfile: services/reasoning-core/Dockerfile
    restart: unless-stopped
    ports:
      - "${REASONING_CORE_PORT:-5090}:5090"
    environment:
      PORT: 5090
      MEMORY_SERVICE_URL: http://averi-memory-service:3030
    depends_on:
      - averi-memory-service
    networks: [cle-v6]

  workspace-autonomy:
    build:
      context: .
      dockerfile: services/workspace-autonomy/Dockerfile
    restart: unless-stopped
    ports:
      - "${WORKSPACE_AUTONOMY_PORT:-5091}:5091"
    environment:
      PORT: 5091
      MEMORY_SERVICE_URL: http://averi-memory-service:3030
    depends_on:
      - averi-memory-service
    networks: [cle-v6]

  synology-media-mcp:
    build:
      context: .
      dockerfile: services/synology-media-mcp/Dockerfile
    restart: unless-stopped
    environment:
      RAW_BACKUPS_PATH: /volume2/The Vault/RAW Backups
    volumes:
      # Mount the actual NAS volume (if running natively on NAS)
      - /volume2/The Vault/RAW Backups:/volume2/The Vault/RAW Backups:ro
    networks: [cle-v6]

volumes:
  v6_postgres_data:
  v6_redis_data:
  v6_chromadb_data:
  v6_dispatch_data:
