# ─────────────────────────────────────────────────────────────────────────────
# CLE ENGINE: GENESIS — nginx API Gateway
# Routes all service traffic through a single entry point on port 3000
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # ── Upstreams ──────────────────────────────────────────────────────────────
    upstream genkit    { server genkit:4000;      }
    upstream relay     { server relay-mcp:5000;   }
    upstream ghost     { server ghost:6000;       }
    upstream godprompt { server god-prompt:7000;  }
    upstream atlas     { server atlas-live:8000;  }
    upstream zeroday   { server zero-day:9000;    }
    upstream comet     { server comet:7100;       }
    upstream campaign  { server campaign:4006;    }

    server {
        listen 3000;
        server_name _;

        # ── Gateway Health ─────────────────────────────────────────────────────
        location = /health {
            default_type application/json;
            return 200 '{"status":"operational","service":"cle-gateway","version":"5.0.0"}';
        }

        # ── Genkit AI Orchestration (/ai/*) ────────────────────────────────────
        location /ai/ {
            proxy_pass http://genkit/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;  # AI generation can be slow
        }

        # ── Relay-MCP Plug Broker (/plugs/*) ───────────────────────────────────
        location /plugs/ {
            proxy_pass http://relay/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Ghost QA Engine (/ghost/*) ─────────────────────────────────────────
        location /ghost/ {
            proxy_pass http://ghost/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;  # Security scans take time
        }

        # ── God Prompt Creative Pipeline (/creative/*) ─────────────────────────
        location /creative/ {
            proxy_pass http://godprompt/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 180s;  # Creative gen can be lengthy
        }

        # ── Atlas Live Broadcast (/broadcast/*) ────────────────────────────────
        location /broadcast/ {
            proxy_pass http://atlas/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";  # WebSocket support for live
        }

        # -- Zero Day Client Ops (/ops/*) -------------------------------------------
        location /ops/ {
            # Important: Trailing slash on proxy_pass strips the /ops/ prefix
            proxy_pass http://zeroday/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # -- Public Zero-Day Intake (/intake/*) -------------------------------------
        location /intake/ {
            # No trailing slash = Nginx appends the full /intake/... raw URI
            proxy_pass http://zeroday;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Public Stripe Webhook (/webhooks/stripe) -------------------------------
        location /webhooks/stripe {
            proxy_pass http://zeroday;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Stripe-Signature $http_stripe_signature;
        }

        # -- COMET Spatial Intelligence (/comet/*) ----------------------------------
        # WebSocket block (must be more specific, listed first)
        location /comet/ws {
            proxy_pass http://comet/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location /comet/ {
            proxy_pass http://comet/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # -- Campaign Creative Engine (/campaign/*) ---------------------------------
        location /campaign/ {
            proxy_pass http://campaign/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;  # DAG execution is long-running
        }
    }
}
