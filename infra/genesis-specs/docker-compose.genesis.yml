# version removed -- obsolete in Compose V2+

# ─────────────────────────────────────────────────────────────────────────────
# CLE ENGINE: GENESIS
# One-command deploy for the full creative OS stack
#
# Usage:
#   cp .env.genesis.example .env
#   docker compose -f docker-compose.genesis.yml up -d
#
# Minimum: 8GB RAM, 4 cores, 100GB disk
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  NODE_ENV: production
  TZ: America/New_York

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  # ── Core Database Layer ────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    <<: *restart-policy
    environment:
      POSTGRES_DB: cle_genesis
      POSTGRES_USER: ${POSTGRES_USER:-cle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cle_genesis_dev}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [genesis-net]

  redis:
    image: redis:7-alpine
    <<: *restart-policy
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-cle_redis} --appendonly yes --appendfsync everysec --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cle_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [genesis-net]

  # ── Memory Layer ─────────────────────────────────────────────────────────

  chromadb:
    image: chromadb/chroma:latest
    <<: *restart-policy
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    networks: [genesis-net]

  # ── Sovereign Git ─────────────────────────────────────────────────────────

  forgejo:
    image: codeberg.org/forgejo/forgejo:1.21
    <<: *restart-policy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: ${POSTGRES_USER:-cle}
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:-localhost}
      FORGEJO__server__ROOT_URL: ${FORGEJO_URL:-http://localhost:3001}
    volumes:
      - forgejo_data:/data
    ports:
      - "${FORGEJO_PORT:-3002}:3000"
      - "${FORGEJO_SSH_PORT:-2223}:22"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [genesis-net]

  # ── AI Orchestration (Genkit) ─────────────────────────────────────────────

  genkit:
    image: cle/genkit:genesis
    build:
      context: .
      dockerfile: packages/genkit/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      GENKIT_ENV: dev
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      CHROMA_URL: http://chromadb:8000
    ports:
      - "${GENKIT_PORT:-4000}:4000"
      - "4001:3100"
    depends_on:
      - redis
      - chromadb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks: [genesis-net]

  # ── THE PLUG — MCP Broker ─────────────────────────────────────────────────

  relay-mcp:
    image: cle/relay-mcp:genesis
    build:
      context: .
      dockerfile: packages/plugs/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      # Finance
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Project Management
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      NOTION_INTEGRATION_TOKEN: ${NOTION_INTEGRATION_TOKEN:-}
      # Design
      FIGMA_ACCESS_TOKEN: ${FIGMA_ACCESS_TOKEN:-}
      # Generative AI
      FAL_KEY: ${FAL_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      RUNWAY_API_SECRET: ${RUNWAY_API_SECRET:-}
      # Communication
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "${RELAY_PORT:-5100}:5000"
    networks: [genesis-net]

  # ── GHOST — Autonomous QA Engine ─────────────────────────────────────────

  ghost:
    image: cle/ghost:genesis
    build:
      context: .
      dockerfile: packages/ghost/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      GHOST_HEADLESS: "true"
      GHOST_SCREENSHOT_DIR: /ghost/screenshots
      GHOST_REPORT_DIR: /ghost/reports
    shm_size: "2gb" # Required for Chrome
    volumes:
      - ghost_screenshots:/ghost/screenshots
      - ghost_reports:/ghost/reports
    ports:
      - "${GHOST_PORT:-6000}:6000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [genesis-net]

  # ── GOD PROMPT — Creative Pipeline ───────────────────────────────────────

  god-prompt:
    image: cle/god-prompt:genesis
    build:
      context: .
      dockerfile: packages/god-prompt/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      FAL_KEY: ${FAL_KEY:-}
      RUNWAY_API_SECRET: ${RUNWAY_API_SECRET:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      CHROMA_URL: http://chromadb:8000
      RELAY_URL: http://relay-mcp:5000
    ports:
      - "${GOD_PROMPT_PORT:-7000}:7000"
    depends_on:
      - genkit
      - chromadb
      - relay-mcp
    networks: [genesis-net]

  # ── ATLAS LIVE — Broadcast Engine ────────────────────────────────────────

  caspar-cg:
    image: casparserver/caspar-cg:latest
    <<: *restart-policy
    volumes:
      - caspar_media:/media
      - caspar_templates:/templates
      - ./packages/atlas-live/templates:/templates/cle
    ports:
      - "5250:5250" # AMCP
      - "8080:8080" # HTTP API
    networks: [genesis-net]
    profiles: [broadcast] # Only starts with --profile broadcast

  atlas-live:
    image: cle/atlas-live:genesis
    build:
      context: .
      dockerfile: packages/atlas-live/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      CASPAR_HOST: caspar-cg
      CASPAR_PORT: 5250
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-} # For live transcription
      RELAY_URL: http://relay-mcp:5000
    ports:
      - "${ATLAS_PORT:-8500}:8000"
    depends_on:
      - relay-mcp
    networks: [genesis-net]

  # ── CAMPAIGN — Creative OS Campaign Engine ───────────────────────────────

  campaign:
    image: cle/campaign:genesis
    build:
      context: .
      dockerfile: packages/campaign/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 4006
      CAMPAIGN_SELF_URL: http://campaign:4006
      GENKIT_URL: http://genkit:4000
      GOD_PROMPT_URL: http://god-prompt:7000
      FAL_KEY: ${FAL_KEY:-}
      RUNWAY_API_SECRET: ${RUNWAY_API_SECRET:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      CAMPAIGN_OUTPUT_DIR: /data/campaigns
    ports:
      - "${CAMPAIGN_PORT:-4006}:4006"
    volumes:
      - campaign_output:/data/campaigns
    depends_on:
      genkit:
        condition: service_started
      god-prompt:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [genesis-net]

  # ── CAMPAIGN WATCHER — Autonomous NAS Media Drop Ingress ───────────────────

  campaign-watcher:
    image: cle/campaign:genesis
    <<: *restart-policy
    # Use tsx to run the source directly — avoids the missing dist/ issue since
    # the campaign image CMD doesn't guarantee dist/ contents are complete
    command: ["npx", "tsx", "src/factory/nas-watcher.ts"]
    environment:
      <<: *common-env
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      VAULT_PATH: /vault
    volumes:
      - ${VAULT_HOST_PATH:-/app/vault}:/vault
    depends_on:
      redis:
        condition: service_healthy
    networks: [genesis-net]

  # ── DISPATCH WORKER — Autonomous Agent Loop ───────────────────────────────

  dispatch-worker:
    image: cle/dispatch:genesis
    build:
      context: .
      dockerfile: packages/dispatch/Dockerfile
    <<: *restart-policy
    command: node build/worker.js
    environment:
      <<: *common-env
      WORKER_ID: dispatch-worker-genesis
      GENKIT_URL: http://genkit:4000
      DISPATCH_URL: http://dispatch:5050
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      DISPATCH_DATA_DIR: /data
      PROJECT: creative-liberation-engine-v5
      WORKER_POLL_MS: "15000"
    volumes:
      - dispatch_data:/data
    depends_on:
      genkit:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [genesis-net]

  # ── BLUEPRINTS — Vertical Blueprint Runtime ──────────────────────────────────

  blueprints:
    image: cle/blueprints:genesis
    build:
      context: .
      dockerfile: packages/blueprints/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      BLUEPRINTS_PORT: 4200
      GENKIT_URL: http://genkit:4000
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
    ports:
      - "${BLUEPRINTS_PORT:-4200}:4200"
    depends_on:
      genkit:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [genesis-net]

  # ── GENMEDIA — AI Media Provider Engine ──────────────────────────────────

  genmedia:
    image: cle/genmedia:genesis
    build:
      context: .
      dockerfile: packages/genmedia/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      GENMEDIA_PORT: 4300
      GENKIT_URL: http://genkit:4000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      KLING_API_KEY: ${KLING_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      RUNWAY_API_SECRET: ${RUNWAY_API_SECRET:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      CHROMA_URL: http://chromadb:8000
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
    ports:
      - "${GENMEDIA_PORT:-4300}:4300"
    depends_on:
      genkit:
        condition: service_started
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4300/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [genesis-net]

  # ── SYNOLOGY MEDIA MCP — NAS MCP Control Plane ────────────────────────

  synology-media-mcp:
    image: cle/synology-media-mcp:genesis
    build:
      context: .
      dockerfile: packages/synology-media-mcp/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      SYNOLOGY_MCP_PORT: 4400
      NAS_SSH_HOST: ${NAS_SSH_HOST:-127.0.0.1}
      NAS_SSH_PORT: ${NAS_SSH_PORT:-2000}
      NAS_SSH_USER: ${NAS_SSH_USER:-admin}
      NAS_SSH_KEY_PATH: /run/secrets/nas_ssh_key
    ports:
      - "${SYNOLOGY_MCP_PORT:-4400}:4400"
    volumes:
      - ${NAS_SSH_KEY_PATH:-~/.ssh/id_ed25519}:/run/secrets/nas_ssh_key:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4400/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [genesis-net]

  # ── FFMPEG SWARM — Autonomous Video Workers ─────────────────────────────────

  ffmpeg-swarm:
    image: cle/ffmpeg-swarm:genesis
    build:
      context: .
      dockerfile: services/ffmpeg-swarm/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      ASSETS_DIR: /data/assets
    volumes:
      - nas_assets:/data/assets
    depends_on:
      redis:
        condition: service_healthy
    networks: [genesis-net]
    deploy:
      mode: replicated
      replicas: 1

  # ── SCRIBE DAEMON — Autonomous Memory Watcher ───────────────────────────────

  scribe-daemon:
    image: cle/scribe-daemon:genesis
    build:
      context: .
      dockerfile: services/scribe-daemon/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      CHROMA_URL: http://chromadb:8000
      HOST_WORKSPACE: /workspace
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      SCRIBE_WEBHOOK_SECRET: ${SCRIBE_WEBHOOK_SECRET:-}
      SCRIBE_HTTP_PORT: "9100"
    ports:
      - "${SCRIBE_PORT:-9100}:9100"
    volumes:
      - .:/workspace
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [genesis-net]

  # ── DIRECTOR — Autonomous Task Queue Populator ──────────────────────────────

  director:
    image: cle/director:genesis
    build:
      context: .
      dockerfile: packages/director/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      DISPATCH_URL: http://dispatch:5050
      WORKSPACE_ROOT: /workspace
      CRON_SCHEDULE: "0 */6 * * *"
    volumes:
      # Read-only monorepo mount — director only reads, never writes
      - .:/workspace:ro
    depends_on:
      dispatch:
        condition: service_healthy
    networks: [genesis-net]

  antigravity-nas:
    image: cle/antigravity-nas:genesis
    build:
      context: .
      dockerfile: Dockerfile.antigravity-nas
    <<: *restart-policy
    environment:
      <<: *common-env
      WINDOW_ID: antigravity-nas-W1
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      DISPATCH_URL: http://dispatch:5050
      GENKIT_URL: http://genkit:4000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
    volumes:
      # DinD: allows daemon to spawn/control containers via Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only monorepo access for task execution reference
      - .:/workspace:ro
    depends_on:
      redis:
        condition: service_healthy
      dispatch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://dispatch:5050/api/status || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [genesis-net]

  # ── ZERO DAY — Client Operations ─────────────────────────────────────────

  zero-day:
    image: cle/zero-day:genesis
    build:
      context: .
      dockerfile: packages/zero-day/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RELAY_URL: http://relay-mcp:5000
      CHROMA_URL: http://chromadb:8000
      POSTGRES_URL: postgresql://${POSTGRES_USER:-cle}:${POSTGRES_PASSWORD}@postgres:5432/cle_genesis
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      GENKIT_URL: http://genkit:4000
      GDRIVE_OAUTH_PATH: ${GDRIVE_OAUTH_PATH:-}
      GDRIVE_CREDENTIALS_PATH: ${GDRIVE_CREDENTIALS_PATH:-}
    ports:
      - "${ZERO_DAY_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      relay-mcp:
        condition: service_started
    networks: [genesis-net]

  # ── DISPATCH — Universal Agent Task Broker ───────────────────────────────

  dispatch:
    image: cle/dispatch:genesis
    build:
      context: .
      dockerfile: packages/dispatch/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 5050
      DISPATCH_STORE_DIR: /data
    ports:
      - "5050:5050"
    volumes:
      - dispatch_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5050/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [genesis-net]

  # ── COMET — Sovereign Spatial Intelligence Layer ─────────────────────────

  comet:
    image: cle/comet:genesis
    build:
      context: .
      dockerfile: packages/comet/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 7100
      GHOST_URL: http://ghost:6000
      GENKIT_URL: http://genkit:4000
      CLE_URL: http://cle-engine:8000
      COMET_HEADLESS: "true"
      COMET_MEMORY_DIR: /data/comet-memory
      COMET_AUDIT_DIR: /data/comet-memory/audit
      COMET_SMG_THRESHOLD: "0.4"
    ports:
      - "${COMET_PORT:-7100}:7100"
    volumes:
      - comet_memory:/data/comet-memory
    depends_on:
      ghost:
        condition: service_started
      genkit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7100/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [genesis-net]

  # ── Creative Liberation Engine API Gateway ─────────────────────────────────────────

  gateway:
    image: cle/gateway:genesis
    build:
      context: .
      dockerfile: Dockerfile.gateway
    <<: *restart-policy
    environment:
      <<: *common-env
      GENKIT_URL: http://genkit:4000
      RELAY_URL: http://relay-mcp:5000
      GHOST_URL: http://ghost:6000
      GOD_PROMPT_URL: http://god-prompt:7000
      ATLAS_URL: http://atlas-live:8000
      ZERO_DAY_URL: http://zero-day:9000
      COMET_URL: http://comet:7100
      CAMPAIGN_URL: http://campaign:4006
      DISPATCH_URL: http://dispatch:5050
      BLUEPRINTS_URL: http://blueprints:4200
      GENMEDIA_URL: http://genmedia:4300
      SYNOLOGY_MCP_URL: http://synology-media-mcp:4400
      SCRIBE_URL: http://scribe-daemon:9100
    ports:
      - "3080:3000"
    depends_on:
      genkit:
        condition: service_started
      comet:
        condition: service_started
      campaign:
        condition: service_started
      blueprints:
        condition: service_started
      genmedia:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
    networks: [genesis-net]

  # ── Ollama (Offline Sovereignty) ────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    <<: *restart-policy
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks: [genesis-net]
    profiles: [offline] # Only starts with --profile offline
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── VLLM (NVIDIA Optimized Max Throughput) ──────────────────────────────

  vllm:
    image: vllm/vllm-openai:latest
    <<: *restart-policy
    profiles: [gpu]
    # Serves Meta-Llama-3 (or Nemotron) locally with an OpenAI-compatible API
    command: --model meta-llama/Meta-Llama-3-8B-Instruct --gpu-memory-utilization 0.4
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    ports:
      - "8001:8000"
    networks: [genesis-net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── VISION FORGE (Meta SAM 2 & Local Vision) ────────────────────────────

  vision-forge:
    image: roboflow/roboflow-inference-server-gpu:latest
    <<: *restart-policy
    profiles: [gpu]
    ports:
      - "9001:9001"
    environment:
      - API_KEY=${ROBOFLOW_API_KEY:-}
      # This allows zero-shot SAM 2 segmentation and Depth Anything workflows locally
    networks: [genesis-net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── TRITON INFERENCE SERVER (VFX & TensorRT) ────────────────────────────

  triton-server:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    <<: *restart-policy
    profiles: [gpu]
    # The gold standard for VFX real-time AI serving (handles TensorRT, ONNX for AnimateAnyone etc)
    command: tritonserver --model-repository=/models --strict-model-config=false
    volumes:
      - ./models/triton:/models
    ports:
      - "8000:8000" # HTTP
      - "8001:8001" # GRPC
      - "8002:8002" # Metrics
    networks: [genesis-net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── TRIPOSR API (Sub-Second 3D Generation) ──────────────────────────────

  triposr-api:
    image: cle/triposr-api:genesis
    build:
      context: .
      dockerfile: services/triposr-api/Dockerfile
    <<: *restart-policy
    profiles: [gpu]
    # Headless API for feeding GenImage results directly into 3D Mesh creation in < 0.5s
    ports:
      - "9002:9002"
    networks: [genesis-net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── FOLEY ENGINE (AudioLDM 2 / Stable Audio) ────────────────────────────

  foley-engine:
    image: cle/foley-engine:genesis
    build:
      context: .
      dockerfile: services/foley-engine/Dockerfile
    <<: *restart-policy
    profiles: [gpu]
    # Dedicated text-to-audio latent diffusion server for SFX, Foley, and Music loops
    ports:
      - "9003:9003"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    networks: [genesis-net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Finance Agent ────────────────────────────────────────────────────────────
  finance-agent:
    build:
      context: ./packages/finance-agent
      dockerfile: ../../docker/node-service.Dockerfile
    container_name: cle-finance-agent
    restart: unless-stopped
    networks: [genesis-net]
    ports:
      - "${FINANCE_AGENT_PORT:-4500}:4500"
    environment:
      <<: *common-env
      FINANCE_AGENT_PORT: 4500
      GENKIT_URL: http://genkit:4000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-60000}
      AUTO_START: ${FINANCE_AUTO_START:-false}
      LIVE_TRADING: ${FINANCE_LIVE_TRADING:-false}
      # 🔴 Set CONFIRM_LIVE_TRADING=1 to enable real on-chain transactions
      CONFIRM_LIVE_TRADING: ${CONFIRM_LIVE_TRADING:-0}
    depends_on:
      genkit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4500/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Shadow QA Service ─────────────────────────────────────────────────────────
  shadow-qa:
    build:
      context: ./services/shadow-qa
      dockerfile: ../../docker/node-service.Dockerfile
    container_name: cle-shadow-qa
    restart: unless-stopped
    networks: [genesis-net]
    ports:
      - "${SHADOW_QA_PORT:-4450}:4450"
    volumes:
      - .:/monorepo:ro # Read-only mount of monorepo so it can run pnpm commands
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      SHADOW_QA_PORT: 4450
      MONOREPO_ROOT: /monorepo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4450/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Ambient Awareness ETL Worker ──────────────────────────────────────────────
  ambient-worker:
    image: cle/ambient-worker:genesis
    build:
      context: ./services/ambient-worker
      dockerfile: Dockerfile
    container_name: cle-ambient-worker
    restart: unless-stopped
    networks: [genesis-net]
    environment:
      <<: *common-env
      POSTGRES_URL: postgresql://${POSTGRES_USER:-cle}:${POSTGRES_PASSWORD:-cle_genesis_dev}@postgres:5432/cle_genesis
      CHROMA_URL: http://chromadb:8000
      POLL_INTERVAL: "60"
    volumes:
      - ambient_worker_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started

  # ── NTFY — Self-hosted Push Notification Server ──────────────────────────────
  # Mobile app: install ntfy (iOS/Android), subscribe to cle-averi topic
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: cle-ntfy
    <<: *restart-policy
    ports:
      - "8880:80"
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://127.0.0.1:8880}
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_LOG_LEVEL=info
    volumes:
      - ntfy_data:/var/lib/ntfy
    command: serve
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [genesis-net]

  # ── MOBILE BRIDGE — AVERI → ntfy Push Adapter ────────────────────────────────
  # Translates Redis agent events to ntfy push notifications for iOS/Android
  mobile-bridge:
    image: cle/mobile-bridge:genesis
    build:
      context: .
      dockerfile: packages/mobile-bridge/Dockerfile
    container_name: cle-mobile-bridge
    <<: *restart-policy
    ports:
      - "4800:4800"
    environment:
      PORT: 4800
      NTFY_URL: http://ntfy:80
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-cle-averi}
      GENKIT_URL: http://genkit:4000
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      DISPATCH_URL: http://dispatch:5050
    depends_on:
      ntfy:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4800/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [genesis-net]

  # ── OMNIMEDIA — MetaHuman Pipeline ────────────────────────────────────────
  # Profile: omnimedia — start with: docker compose --profile omnimedia up -d

  audio2face-nim:
    # NVIDIA Audio2Face NIM microservice — ARKit 52-blendshape inference
    # Requires valid NGC API key and NVIDIA GPU with >=8GB VRAM
    # NGC image: nvcr.io/nim/nvidia/audio2face-3d:1.0
    image: ${A2F_NIM_IMAGE:-nvcr.io/nim/nvidia/audio2face-3d:1.0}
    container_name: cle-audio2face-nim
    <<: *restart-policy
    profiles: [omnimedia]
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
      # Audio2Face NIM configuration
      A2F_INFERENCE_MODE: ${A2F_INFERENCE_MODE:-default}
      A2F_MAX_BATCH_SIZE: ${A2F_MAX_BATCH_SIZE:-1}
    ports:
      - "${A2F_PORT:-8011}:8011" # REST API
    volumes:
      - a2f_nim_cache:/root/.cache/nim # Model cache — survives restarts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s # NIM takes ~60s to load model on first run
    networks: [genesis-net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  somatic-bridge:
    # TypeScript HTTP→OSC bridge — receives blendshapes from A2F NIM, broadcasts to UE5
    image: cle/somatic:genesis
    build:
      context: .
      dockerfile: packages/somatic/Dockerfile
    container_name: cle-somatic-bridge
    <<: *restart-policy
    profiles: [omnimedia]
    environment:
      <<: *common-env
      SOMATIC_HTTP_PORT: "6060"
      SOMATIC_OSC_HOST: ${UE5_OSC_HOST:-host.docker.internal} # UE5 host
      SOMATIC_OSC_PORT: "5005"
      A2F_URL: http://audio2face-nim:8011
      SOMATIC_TARGET_FPS: "60"
    ports:
      - "${SOMATIC_PORT:-6060}:6060" # HTTP ingest
    depends_on:
      audio2face-nim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6060/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [genesis-net]

  sensor-mesh:
    build:
      context: ./packages/sensor-mesh
      dockerfile: ../../docker/node-service.Dockerfile
    container_name: cle-sensor-mesh
    command: ["npx", "tsx", "src/ZigSimBridge.ts"]
    <<: *restart-policy
    networks: [genesis-net]
    ports:
      - "${ZIGSIM_PORT:-5010}:5010/udp"
    environment:
      <<: *common-env
      ZIGSIM_PORT: 5010
      SOMATIC_HOST: ${SOMATIC_HOST:-192.168.2.20}
      SOMATIC_PORT: 5005

  a2f-osc-bridge:
    # Python sidecar — polls A2F NIM REST, broadcasts blendshapes via OSC/UDP
    # Alternative to somatic-bridge for direct UE5 OSC without HTTP intermediary
    image: python:3.11-slim
    container_name: cle-a2f-osc-bridge
    <<: *restart-policy
    profiles: [omnimedia]
    command: >
      bash -c "pip install -q python-osc requests &&
               python /app/a2f_osc_bridge.py
               --a2f-url http://audio2face-nim:8011
               --osc-host ${UE5_OSC_HOST:-host.docker.internal}
               --osc-port ${UE5_OSC_PORT:-5005}
               --fps ${A2F_BRIDGE_FPS:-60}"
    volumes:
      - ./packages/somatic/scripts/a2f_osc_bridge.py:/app/a2f_osc_bridge.py:ro
    depends_on:
      audio2face-nim:
        condition: service_healthy
    networks: [genesis-net]

  # ── CLOUDFLARE TUNNEL — Sovereign NAS Ingress ──────────────────────────────
  # T-STEALTH-001: Zero exposed ports. Zero IP leakage. Your home IP stays hidden.
  # Setup:
  #   1. cloudflared tunnel create cle-genesis
  #   2. Copy output UUID to CLOUDFLARE_TUNNEL_ID in .env
  #   3. Copy credentials JSON to infra/stealth/cloudflared/creds.json
  #   4. Add all hostnames in infra/stealth/cloudflared/config.yml to Cloudflare DNS
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cle-cloudflared
    <<: *restart-policy
    command: tunnel --config /etc/cloudflared/config.yml run
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
      - CLOUDFLARE_TUNNEL_ID=${CLOUDFLARE_TUNNEL_ID:-}
      - TUNNEL_DOMAIN=${TUNNEL_DOMAIN:-cle.local}
    volumes:
      - ./infra/stealth/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./infra/stealth/cloudflared/creds.json:/etc/cloudflared/creds.json:ro
    networks: [genesis-net]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      dispatch:
        condition: service_healthy
      genkit:
        condition: service_healthy
    profiles:
      - stealth # Start with: docker compose --profile stealth up -d cloudflared
        # Or remove profile line to always start

  # ── COMET C1 — NAS Always-On Browser Agent ─────────────────────────────────
  # T-STEALTH-003: Persistent Playwright/Chromium agent on NAS
  # MCP SSE endpoint: http://NAS_IP:7200/sse (or comet-c1.yourdomain.com via tunnel)
  # Agent ID: comet-C1 | Tags: nas-persistent, web-research, stealth
  comet-c1:
    image: cle/comet-c1:genesis
    build:
      context: .
      dockerfile: packages/cle-browser/Dockerfile.c1-nas
    container_name: cle-comet-c1
    <<: *restart-policy
    ports:
      - "${COMET_C1_PORT:-7200}:7200"
    environment:
      <<: *common-env
      COMET_AGENT_ID: comet-C1
      COMET_WINDOW: C1
      COMET_WORKSTREAM: comet-browser
      COMET_CAPABILITIES: nas-persistent,web-research,stealth,dispatch-worker
      COMET_HEADLESS: "true"
      COMET_PORT: 7200
      COMET_MEMORY_DIR: /app/data/sessions
      DISPATCH_URL: http://dispatch:5050
      GENKIT_URL: http://genkit:4000
      # Chromium flags for stability in container
      CHROMIUM_FLAGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu --single-process"
      # Privacy: route all browser traffic through NAS network (or proxy if set)
      HTTP_PROXY: ${COMET_C1_PROXY:-}
      HTTPS_PROXY: ${COMET_C1_PROXY:-}
      NO_PROXY: "localhost,127.0.0.1,dispatch,genkit,gateway"
    volumes:
      - comet_c1_data:/app/data
    depends_on:
      dispatch:
        condition: service_healthy
    networks: [genesis-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s # Playwright takes a moment to warm up
    # Security: read-only root filesystem with explicit writable mounts
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m # Chromium temp files
      - /dev/shm:size=1g # Shared memory for Chromium (avoids /dev/shm too small crashes)

  # ── Home Assistant ────────────────────────────────────────────────────────────

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    environment:
      - TZ=America/New_York
    volumes:
      - homeassistant_data:/config
    network_mode: host
    restart: unless-stopped

# ── Networks ──────────────────────────────────────────────────────────────────

networks:
  genesis-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data: # redis_data is external so CI teardown (--volumes) never wipes persistent cache

  redis_data:
    external: true
    name: genesis-redis-data
  chromadb_data:
  forgejo_data:
  ghost_screenshots:
  ghost_reports:
  caspar_media:
  caspar_templates:
  ollama_data:
  comet_memory:
  campaign_output:
  dispatch_data:
    external: true
    name: genesis-dispatch-data
  nas_assets:
    external: true
    name: genesis-nas-assets
  genmedia_output:
  ambient_worker_data:
  ntfy_data:
  comet_c1_data: # COMET C1 NAS agent — persistent browser sessions + SQLite memory
  a2f_nim_cache: # NVIDIA Audio2Face NIM model weights cache
  homeassistant_data:
