version: '3.8'

services:
  cache:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  api:
    image: node:18-alpine
    command: npm start
    ports:
      - "3000:3000"
    depends_on:
      - cache
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:3000
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
