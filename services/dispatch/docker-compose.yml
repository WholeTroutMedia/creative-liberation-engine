# ═══════════════════════════════════════════════════════════════════════════════
# Creative Liberation Engine — Dispatch Server
# NAS Docker Compose Stack
# Sovereign deployment at 127.0.0.1:5160
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.9'

services:
  dispatch:
    image: wholetroutmedia/cle-dispatch:latest
    build:
      context: ../../           # workspace root (needs pnpm-workspace.yaml)
      dockerfile: services/dispatch/Dockerfile
    container_name: cle-dispatch
    restart: unless-stopped
    ports:
      - "5160:5160"
    environment:
      NODE_ENV: production
      PORT: "5160"
      DISPATCH_DATA_DIR: /data/dispatch
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Vault encryption key — set in .env on the NAS
      DISPATCH_VAULT_KEY: ${DISPATCH_VAULT_KEY:?DISPATCH_VAULT_KEY is required}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://cle:cle_secure_pass@127.0.0.1:5434/cle}
      # Redis (optional — for pub/sub SSE fanout in multi-instance mode)
      REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
    volumes:
      # Persistent SQLite store — survives redeploys
      - dispatch-data:/data/dispatch
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5160/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cle-mesh
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dispatch-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # NAS bind mount — symlink /data/dispatch to NAS volume
      device: ${DISPATCH_DATA_PATH:-/volume1/docker/cle-dispatch/data}

networks:
  cle-mesh:
    name: cle-mesh
    external: true
