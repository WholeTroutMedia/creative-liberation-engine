<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Grid Pattern for Brutalist sketch feeling -->
    <pattern id="brutalistGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 0, 0, 0.05)" stroke-width="1"/>
    </pattern>
    <!-- Shadow Offset Box Filter -->
    <filter id="brutalistShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Base Canvas: Cream Paper #FDFBF7 -->
  <rect width="100%" height="100%" fill="#FDFBF7" />
  <rect width="100%" height="100%" fill="url(#brutalistGrid)" />

  <!-- Outer Heavy Border -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#000000" stroke-width="12" />

  <!-- Shadow Offset Box 1 (Background Panel) -->
  <rect x="98" y="108" width="220" height="220" fill="#000000" rx="4" />
  
  <!-- Panel 1 (Solar Orange Base Storyboard Frame) -->
  <rect x="90" y="100" width="220" height="220" fill="#FF4E00" stroke="#000000" stroke-width="8" rx="4" transform="rotate(-6 200 210)" />

  <!-- Shadow Offset Box 2 (Foreground Panel) -->
  <rect x="208" y="168" width="220" height="220" fill="#000000" rx="4" />

  <!-- Panel 2 (Cream Paper Foreground Storyboard Frame) -->
  <g transform="rotate(4 310 270)">
    <rect x="200" y="160" width="220" height="220" fill="#FDFBF7" stroke="#000000" stroke-width="8" rx="4" />
    
    <!-- Video / Frame lines (aspect ratio boundary inside cell) -->
    <rect x="215" y="175" width="190" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="4" rx="2" />
    
    <!-- Stylized Scribble inside panel 2 -->
    <!-- Represents creative energy, storyboarding, sketch -->
    <path d="M 230 250 C 240 210, 270 200, 290 230 C 310 260, 330 260, 360 210 C 380 180, 390 210, 370 240 C 350 270, 310 280, 290 260 C 270 240, 280 200, 320 190" 
          fill="none" stroke="#FF4E00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cell metadata mock markings (timecode, panel number) -->
    <text x="218" y="328" font-family="'JetBrains Mono', monospace, Courier" font-size="10" font-weight="900" fill="#000000">SCENE 01 / SHOT A</text>
    <text x="375" y="328" font-family="'JetBrains Mono', monospace, Courier" font-size="10" font-weight="900" fill="#FF4E00">0.08s</text>
    
    <!-- Audio / Description indicators -->
    <line x1="218" y1="345" x2="350" y2="345" stroke="#000000" stroke-width="3" stroke-dasharray="4 2" />
    <line x1="218" y1="355" x2="300" y2="355" stroke="#000000" stroke-width="3" />
  </g>

  <!-- The Sync Circle Arrow (heavy brutalist sync curve wrapping the core overlap) -->
  <path d="M 120 380 C 150 430, 230 450, 300 440 C 360 430, 420 380, 440 310" 
        fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <polygon points="440,295 425,325 455,325" fill="#000000" transform="rotate(20 440 310)" />

  <path d="M 400 130 C 370 80, 290 60, 220 70 C 160 80, 100 130, 80 200" 
        fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <polygon points="80,215 65,185 95,185" fill="#000000" transform="rotate(-160 80 200)" />

  <!-- Logo Typography -->
  <g transform="translate(0, 0)">
    <!-- Dynamic offset for a 3D letter shadow -->
    <text x="259" y="457" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="4">SCRIBBLESYNC</text>
    <text x="256" y="454" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="900" fill="#FF4E00" stroke="#000000" stroke-width="2" text-anchor="middle" letter-spacing="4">SCRIBBLESYNC</text>
  </g>

</svg>
