name: Auto-Sync Manuscript & Implementation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - '*.md'
      - 'IMPLEMENTATION_TRACKER.md'
  schedule:
    # Run every 6 hours to catch any drift
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force full sync regardless of changes'
        required: false
        default: 'false'
        type: boolean

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      manuscript_changed: ${{ steps.changes.outputs.manuscript }}
      tracker_changed: ${{ steps.changes.outputs.tracker }}
      design_docs_changed: ${{ steps.changes.outputs.design_docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect file changes
        id: changes
        run: |
          # Check what changed in last commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Check for manuscript changes
          if echo "$CHANGED_FILES" | grep -qE "TECHNICAL_MANUSCRIPT|MASTER_BUILD_SEQUENCE"; then
            echo "manuscript=true" >> $GITHUB_OUTPUT
          else
            echo "manuscript=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for tracker changes
          if echo "$CHANGED_FILES" | grep -q "IMPLEMENTATION_TRACKER"; then
            echo "tracker=true" >> $GITHUB_OUTPUT
          else
            echo "tracker=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for design doc changes
          if echo "$CHANGED_FILES" | grep -qE "docs/.*\.md|COMET_.*\.md|.*_SYSTEM\.md"; then
            echo "design_docs=true" >> $GITHUB_OUTPUT
          else
            echo "design_docs=false" >> $GITHUB_OUTPUT
          fi

  sync-manuscript-to-tracker:
    needs: detect-changes
    if: needs.detect-changes.outputs.manuscript_changed == 'true' || github.event.inputs.force_sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Extract directives from manuscript
        run: |
          python scripts/extract_directives.py \
            --source MASTER_BUILD_SEQUENCE.md \
            --output .cache/directives.json

      - name: Update implementation tracker
        run: |
          python scripts/update_manuscript.py \
            --directives .cache/directives.json \
            --tracker IMPLEMENTATION_TRACKER.md \
            --mode sync

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add IMPLEMENTATION_TRACKER.md
          git diff --staged --quiet || git commit -m "chore(auto-sync): Update tracker from manuscript changes"
          git push

  sync-implementations-to-tracker:
    needs: detect-changes
    if: needs.detect-changes.outputs.design_docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan for new implementations
        run: |
          python scripts/auto_implement.py \
            --mode detect \
            --output .cache/implementations.json

      - name: Update tracker with implementations
        run: |
          python scripts/update_manuscript.py \
            --implementations .cache/implementations.json \
            --tracker IMPLEMENTATION_TRACKER.md \
            --mode update-status

      - name: Commit status updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add IMPLEMENTATION_TRACKER.md
          git diff --staged --quiet || git commit -m "chore(auto-sync): Update implementation status"
          git push

  notify-drift:
    needs: [detect-changes, sync-manuscript-to-tracker]
    if: always() && needs.sync-manuscript-to-tracker.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for sync failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Auto-sync failed - Manual intervention needed',
              body: `The automatic sync between manuscript and tracker failed.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease review and fix manually.`,
              labels: ['automation', 'needs-attention']
            });
