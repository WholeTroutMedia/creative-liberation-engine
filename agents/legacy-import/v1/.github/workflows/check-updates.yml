name: Check for Updates

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  check-updates:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Check Python updates
        run: |
          pip install --upgrade pip
          pip list --outdated --format=json > python-updates.json
      
      - name: Check npm updates
        working-directory: ./studio-gui
        run: |
          npm outdated --json > npm-updates.json || true
      
      - name: Create issue if updates available
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            let pythonUpdates = [];
            let npmUpdates = {};
            
            try {
              pythonUpdates = JSON.parse(fs.readFileSync('python-updates.json', 'utf8'));
            } catch (e) {}
            
            try {
              npmUpdates = JSON.parse(fs.readFileSync('studio-gui/npm-updates.json', 'utf8'));
            } catch (e) {}
            
            const totalUpdates = pythonUpdates.length + Object.keys(npmUpdates).length;
            
            if (totalUpdates > 0) {
              const body = `## 🔔 Updates Available\n\n` +
                `**${totalUpdates} package(s) have new versions**\n\n` +
                `### Python Packages (${pythonUpdates.length})\n` +
                pythonUpdates.slice(0, 5).map(p => `- ${p.name}: ${p.version} → ${p.latest_version}`).join('\n') +
                `\n\n### npm Packages (${Object.keys(npmUpdates).length})\n` +
                Object.entries(npmUpdates).slice(0, 5).map(([name, info]) => 
                  `- ${name}: ${info.current} → ${info.latest}`
                ).join('\n');
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔔 ${totalUpdates} Package Updates Available`,
                body: body,
                labels: ['dependencies', 'automated'],
              });
            }
