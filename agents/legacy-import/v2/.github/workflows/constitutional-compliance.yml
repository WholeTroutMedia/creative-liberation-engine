name: Constitutional Compliance Check

# Runs on every PR to enforce constitutional principles
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  constitutional-check:
    name: Constitutional Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: "🏛️ ARTICLE 0: Check for Stealing"
        run: |
          echo "Checking for violations of Article 0: Sacred Principles (No Stealing)..."
          
          # Check commit messages and PR description for forbidden language
          FORBIDDEN_WORDS="steal|copy|rip off|rip-off|lift|take from"
          
          # Check PR title and body
          if echo "${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}" | grep -iE "$FORBIDDEN_WORDS"; then
            echo "❌ ARTICLE 0 VIOLATION: Forbidden language detected"
            echo "We LEARN from others, we don't STEAL."
            exit 1
          fi
          
          echo "✅ Article 0: No stealing language detected"

      - name: "🕐 ARTICLE 16: Check for Time Constraints"
        run: |
          echo "Checking for violations of Article 16: The Nature of Time..."
          
          # Check for calendar-based deadlines
          TIME_VIOLATIONS="deadline|due by|must ship by|time crunch|behind schedule|running out of time"
          
          if echo "${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}" | grep -iE "$TIME_VIOLATIONS"; then
            echo "❌ ARTICLE 16 VIOLATION: Calendar-based time constraints detected"
            echo "TIME serves us. We don't serve TIME. Work ships when complete."
            exit 1
          fi
          
          echo "✅ Article 16: No time constraints detected"

      - name: "⚡ ARTICLE 17: Check for MVP Mentality"
        run: |
          echo "Checking for violations of Article 17: Zero Day Creativity..."
          
          # Check for MVP/incomplete solution language
          MVP_VIOLATIONS="MVP|minimum viable|ship it later|fix in post|good enough for now|we'll improve later|technical debt acceptable"
          
          if echo "${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}" | grep -iE "$MVP_VIOLATIONS"; then
            echo "❌ ARTICLE 17 VIOLATION: MVP mentality detected"
            echo "We ship COMPLETE solutions, not fragments. Artist integrity maintained."
            exit 1
          fi
          
          echo "✅ Article 17: No MVP mentality detected"

      - name: "🎯 ARTICLE XVIII: Check Artist Impact"
        run: |
          echo "Checking for Article XVIII: The Artist Liberation Mandate..."
          
          # Check for extractive language
          EXTRACTIVE_TERMS="extract value|monetize users|exploit|maximize revenue|capture data|user funnel"
          
          if echo "${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}" | grep -iE "$EXTRACTIVE_TERMS"; then
            echo "❌ ARTICLE XVIII VIOLATION: Extractive mentality detected"
            echo "We serve artist liberation, not extraction. Generosity over extraction."
            exit 1
          fi
          
          echo "✅ Article XVIII: Artist dignity maintained"

      - name: Run Constitutional Validators (if DNA package exists)
        if: hashFiles('packages/cle-dna/package.json') != ''
        run: |
          echo "Running TypeScript constitutional validators..."
          cd packages/cle-dna
          npm ci
          npm run test || echo "Tests not configured yet"

      - name: "✅ Constitutional Compliance Summary"
        if: success()
        run: |
          echo "## 🏛️ Constitutional Compliance: PASSED"
          echo ""
          echo "All constitutional articles respected:"
          echo "- ✅ Article 0: No stealing"
          echo "- ✅ Article 16: No time constraints"
          echo "- ✅ Article 17: No MVP mentality"
          echo "- ✅ Article XVIII: Artist dignity maintained"
          echo ""
          echo "This PR is constitutionally compliant."

      - name: "❌ Constitutional Violation Detected"
        if: failure()
        run: |
          echo "## ❌ Constitutional Compliance: FAILED"
          echo ""
          echo "This PR violates constitutional principles."
          echo "Please review the Constitution and update your PR."
          echo ""
          echo "Constitution: https://github.com/${{ github.repository }}/blob/main/docs/CONSTITUTION.md"
          exit 1
