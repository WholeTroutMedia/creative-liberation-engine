name: Trigger DNA Propagation NOW

# Manual trigger to force immediate DNA propagation
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual propagation'
        required: true
        default: 'Article XIX deployment'

jobs:
  trigger:
    name: Force DNA Propagation
    runs-on: ubuntu-latest
    steps:
      - name: Trigger main propagation workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'dna-propagation.yml',
              ref: 'main'
            });
            
            console.log('✅ DNA propagation triggered');
            console.log('Reason:', '${{ github.event.inputs.reason }}');
            console.log('All 10 repositories will receive DNA updates.');
