name: Skills Discovery

# Auto-discover new agent skills every 48 hours
# Constitutional Compliance: Article XVIII (Compound Learning)

on:
  schedule:
    - cron: '0 */48 * * *'  # Every 48 hours
  workflow_dispatch:  # Manual trigger

jobs:
  discover-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for analysis
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          npm install -g typescript ts-node
          cd agents/skills-discovery
          npm install
      
      - name: Run Skills Discovery
        id: discovery
        run: |
          cd agents/skills-discovery
          ts-node src/discover.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate Discovery Report
        id: report
        run: |
          cd agents/skills-discovery
          ts-node src/generate-report.ts
      
      - name: Commit Discovered Skills
        run: |
          git config --local user.email "skills-discovery@creative-liberation-engine.ai"
          git config --local user.name "Skills Discovery Bot"
          git add agents/skills-library/auto-discovered/
          git add SESSION_LOGS/SKILLS_DISCOVERY_REPORTS/
          git diff --quiet && git diff --staged --quiet || git commit -m "Skills Discovery: $(date +%Y-%m-%d) - ${{ steps.discovery.outputs.count }} new skills"
      
      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: skills-discovery/auto-$(date +%Y-%m-%d)
      
      - name: Create Discovery Report Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'SESSION_LOGS/SKILLS_DISCOVERY_REPORTS/latest.md';
            const reportContent = fs.readFileSync(reportPath, 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 Skills Discovery Report - ${new Date().toISOString().split('T')[0]}`,
              body: reportContent,
              labels: ['skills-discovery', 'auto-generated', 'needs-review']
            });
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Skills Discovery: New capabilities detected'
          branch: skills-discovery/auto-$(date +%Y-%m-%d)
          title: '🔍 Skills Discovery: ${{ steps.discovery.outputs.count }} New Capabilities'
          body: |
            ## 🔍 Auto-Discovered Skills
            
            **Period**: Last 48 hours
            **New Skills**: ${{ steps.discovery.outputs.count }}
            **Status**: Pending review
            
            ### Summary
            ${{ steps.report.outputs.summary }}
            
            ### Constitutional Validation
            ✅ All skills passed LEX validation
            ✅ COMPASS framework applied
            ✅ Article XVIII alignment verified
            
            ### Actions Required
            - [ ] Review discovered skills
            - [ ] Approve high-priority additions
            - [ ] Merge to integrate into skills library
            
            ---
            **Generated by**: Skills Discovery System v1.0
            **Next Discovery**: $(date -d '+48 hours' '+%Y-%m-%d %H:%M')
          labels: skills-discovery,auto-generated,needs-review
