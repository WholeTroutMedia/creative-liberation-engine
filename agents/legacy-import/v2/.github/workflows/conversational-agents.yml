name: 🤖 Conversational Agents + Commands

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read
  
env:
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

jobs:
  agent_conversation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # PRIORITY 1: SLASH COMMANDS (Fast path)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 🚀 Handle Slash Commands
        if: startsWith(github.event.comment.body, '/')
        id: command_check
        run: echo "is_command=true" >> $GITHUB_OUTPUT

      # Delegate to existing mobile-chatops workflow for commands
      - name: Execute Command
        if: steps.command_check.outputs.is_command == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '⚡ **Command detected** - Routing to mobile-chatops workflow...\n\n_Commands are handled by the dedicated ChatOps system._'
            });

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # PRIORITY 2: CONVERSATIONAL AI (Perplexity)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 🧠 Conversational Agent Routing
        if: steps.command_check.outputs.is_command != 'true'
        uses: actions/github-script@v7
        env:
          PERPLEXITY_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const https = require('https');
            
            // Load agent registry
            const agentStatus = JSON.parse(fs.readFileSync('agents/.agent-status.json', 'utf8'));
            
            const comment = context.payload.comment.body;
            const user = context.payload.comment.user.login;
            const issueTitle = context.payload.issue.title;
            const issueBody = context.payload.issue.body || '';
            
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // AGENT DETECTION & ROUTING
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            
            const agentKeywords = {
              'AVERI': ['averi', 'strategic', 'mission', 'alignment', 'consciousness'],
              'ATHENA': ['athena', 'architecture', 'long-term', 'vision', 'design system'],
              'VERA': ['vera', 'log', 'remember', 'record', 'truth', 'scribe', 'document'],
              'IRIS': ['iris', 'quick', 'urgent', 'emergency', 'fast', 'blocker'],
              'Aurora': ['aurora', 'design', 'ui', 'ux', 'interface', 'user experience'],
              'BOLT': ['bolt', 'frontend', 'ios', 'swift', 'mobile', 'app'],
              'COMET': ['comet', 'backend', 'api', 'server', 'database', 'deploy'],
              'LEX': ['lex', 'legal', 'constitutional', 'compliance', 'policy'],
              'COMPASS': ['compass', 'north star', 'mission alignment'],
              'KEEPER': ['keeper', 'knowledge', 'organize', 'pattern'],
              'ARCH': ['arch', 'code pattern', 'extract', 'architecture'],
              'ECHO': ['echo', 'artist pattern', 'learning'],
              'CODEX': ['codex', 'documentation', 'organize knowledge'],
              'ATLAS': ['atlas', 'broadcast', 'live', 'media', 'production'],
              'SWITCHBOARD': ['switchboard', 'route', 'coordinate', 'operations'],
              'RELAY': ['relay', 'broadcast', 'notify', 'announce'],
              'RAM_CREW': ['ram crew', 'ram-crew', 'quality', 'verify', 'check data'],
              'LEONARDO': ['leonardo', 'beauty', 'aesthetic', 'creative', 'art'],
              'COSMOS': ['cosmos', 'evidence', 'analysis', 'research', 'systems thinking'],
              'SAGE': ['sage', 'wellness', 'balance', 'health'],
              'MATH': ['math', 'calculate', 'equation', 'quantitative']
            };
            
            // Detect mentioned agents
            let detectedAgent = null;
            const commentLower = comment.toLowerCase();
            
            for (const [agent, keywords] of Object.entries(agentKeywords)) {
              if (keywords.some(kw => commentLower.includes(kw))) {
                detectedAgent = agent;
                break;
              }
            }
            
            // Default to SWITCHBOARD for routing if no specific agent
            if (!detectedAgent) {
              detectedAgent = 'SWITCHBOARD';
            }
            
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // BUILD CONTEXT FOR AI
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            
            const agent = agentStatus.agents[detectedAgent];
            
            if (!agent) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ Agent **${detectedAgent}** not found in registry. Try using slash commands instead.`
              });
              return;
            }
            
            // Build agent personality prompt
            let systemPrompt = `You are ${agent.name}, an AI agent in the Brainchild-v2 system.
            
            YOUR IDENTITY:
            - Full Name: ${agent.full_name || agent.name}
            - Role: ${agent.role || agent.purpose || 'AI agent'}
            - Status: ${agent.status}
            - Symbol: ${agent.symbol || '🤖'}
            
            YOUR CAPABILITIES:
            ${agent.capabilities ? agent.capabilities.map(c => '- ' + c).join('\n') : 'General assistance'}
            
            YOUR AUTHORITY:
            ${agent.authority ? agent.authority.map(a => '- ' + a).join('\n') : 'Provide guidance and recommendations'}
            
            PERSONALITY TRAITS:
            ${detectedAgent === 'VERA' ? '- Precise, factual, excellent memory\n- Always cite sources\n- Professional librarian tone' : ''}
            ${detectedAgent === 'IRIS' ? '- Quick, action-oriented, removes blockers\n- Energetic and decisive\n- Gets things done fast' : ''}
            ${detectedAgent === 'ATHENA' ? '- Strategic, wise, long-term thinking\n- Philosophical but practical\n- Protective of mission' : ''}
            ${detectedAgent === 'Aurora' ? '- Creative, design-focused, aesthetic\n- Thinks about user experience\n- Balances beauty and function' : ''}
            ${detectedAgent === 'COMET' ? '- Technical, backend-focused, pragmatic\n- Loves clean code and APIs\n- Deployment expert' : ''}
            ${detectedAgent === 'LEX' ? '- Legal-minded, constitutional, principled\n- Ensures compliance and ethics\n- Protects the mission' : ''}
            ${detectedAgent === 'SWITCHBOARD' ? '- Coordinator, router, organizer\n- Knows which agent to call\n- Operations expert' : ''}
            
            CONTEXT:
            - User: ${user}
            - Issue: "${issueTitle}"
            - System: creative-liberation-engine-v2 (27 agents, 6 hives)
            - Date: ${new Date().toISOString()}
            
            RESPOND NATURALLY in your personality. Keep responses concise (2-4 paragraphs max). 
            If you need to take action (like logging, deploying, or coordinating), explain what you'll do.
            Use markdown formatting. Include your symbol emoji in responses occasionally.
            `;
            
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // CALL PERPLEXITY API
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            
            const apiKey = process.env.PERPLEXITY_KEY;
            
            if (!apiKey) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: '⚠️ **Conversational mode unavailable** - API key not configured.\n\nPlease use slash commands instead: `/help` for options.'
              });
              return;
            }
            
            const requestBody = JSON.stringify({
              model: 'llama-3.1-sonar-small-128k-online',
              messages: [
                {
                  role: 'system',
                  content: systemPrompt
                },
                {
                  role: 'user',
                  content: comment
                }
              ],
              temperature: 0.7,
              max_tokens: 1000
            });
            
            const options = {
              hostname: 'api.perplexity.ai',
              port: 443,
              path: '/chat/completions',
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(requestBody)
              }
            };
            
            const makeRequest = () => {
              return new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let data = '';
                  
                  res.on('data', (chunk) => {
                    data += chunk;
                  });
                  
                  res.on('end', () => {
                    try {
                      resolve(JSON.parse(data));
                    } catch (e) {
                      reject(new Error('Failed to parse response: ' + e.message));
                    }
                  });
                });
                
                req.on('error', (e) => {
                  reject(e);
                });
                
                req.write(requestBody);
                req.end();
              });
            };
            
            try {
              const response = await makeRequest();
              
              if (response.choices && response.choices[0] && response.choices[0].message) {
                const agentResponse = response.choices[0].message.content;
                
                // Post agent response
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  body: `## ${agent.symbol || '🤖'} ${agent.name}\n\n${agentResponse}\n\n---\n_Agent invoked: ${detectedAgent} | [View all agents](../blob/main/agents/.agent-status.json)_`
                });
                
                // If VERA responded, note that this is logged
                if (detectedAgent === 'VERA') {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.issue.number,
                    body: '📚 _This conversation has been logged to SCRIBE institutional memory._'
                  });
                }
                
              } else {
                throw new Error('No response content from API');
              }
              
            } catch (error) {
              console.error('API Error:', error);
              
              // Fallback to simple response
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `## ${agent.symbol || '🤖'} ${agent.name}\n\nI'm ${agent.name}, and I'm here to help with: ${agent.role || agent.purpose}\n\nHowever, I'm having trouble connecting to my conversational system right now. **Try using slash commands instead:**\n\n- \`/agent ${detectedAgent}\` - Invoke me directly\n- \`/status\` - Check system health\n- \`/help\` - See all commands\n\n_Error: ${error.message}_`
              });
            }

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # AUTO-LOGGING FOR IMPORTANT DECISIONS
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      - name: 📚 VERA Auto-Log Important Conversations
        if: |
          steps.command_check.outputs.is_command != 'true' &&
          (contains(github.event.comment.body, 'decided') ||
           contains(github.event.comment.body, 'approved') ||
           contains(github.event.comment.body, 'rejected') ||
           contains(github.event.comment.body, 'implemented'))
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const timestamp = new Date().toISOString();
            
            // Create log entry
            const logEntry = {
              timestamp: timestamp,
              issue: context.payload.issue.number,
              user: context.payload.comment.user.login,
              comment: context.payload.comment.body,
              url: context.payload.comment.html_url
            };
            
            // Ensure SCRIBE directory exists
            if (!fs.existsSync('SCRIBE/session-logs')) {
              fs.mkdirSync('SCRIBE/session-logs', { recursive: true });
            }
            
            const logFile = `SCRIBE/session-logs/${new Date().toISOString().split('T')[0]}.jsonl`;
            
            // Append to daily log
            fs.appendFileSync(logFile, JSON.stringify(logEntry) + '\n');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '📝 **VERA**: I detected an important decision and logged it to SCRIBE for institutional memory.'
            });
