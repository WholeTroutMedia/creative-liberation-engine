name: 💬 Natural Language Chat

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  
jobs:
  chat:
    # Don't trigger on slash commands (those have their own workflow)
    if: "!startsWith(github.event.comment.body, '/')"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🧠 Parse Natural Language
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = context.payload.comment.body.trim().toLowerCase();
            const user = context.payload.comment.user.login;
            
            // Load agent registry
            let agentStatus = {};
            try {
              agentStatus = JSON.parse(fs.readFileSync('agents/.agent-status.json', 'utf8'));
            } catch (e) {
              agentStatus = { agents: {} };
            }
            
            // ════════════════════════════════════════════════════════════════
            // NATURAL LANGUAGE INTENT DETECTION
            // ════════════════════════════════════════════════════════════════
            
            const intents = {
              
              // ─────────────────────────────────────────────────────────────
              // Status & Health Checks
              // ─────────────────────────────────────────────────────────────
              status: {
                patterns: [
                  /how('s| is) (everything|the system|creative-liberation-engine)/i,
                  /what('s| is) (the |our )?status/i,
                  /(system |health )?check/i,
                  /is (everything |it )?working/i,
                  /are (we |you |things )?up/i,
                  /system health/i
                ],
                response: () => {
                  const agentCount = Object.keys(agentStatus.agents || {}).length;
                  const active = Object.values(agentStatus.agents || {})
                    .filter(a => a.status === 'active').length;
                  
                  return `## 🟢 All Systems Operational

Hey @${user}! Everything's running smoothly.

**Agent Status**
- ${active} of ${agentCount} agents active and ready
- Mobile ChatOps: ✅ Working
- GitHub Actions: ✅ Running
- SCRIBE Logging: ✅ Active

**Quick Stats**
- Repository: creative-liberation-engine-v2
- Last update: ${new Date().toISOString().split('T')[0]}
- Workflow: Natural Language Chat

Need anything specific? Just ask naturally!`;
                }
              },
              
              // ─────────────────────────────────────────────────────────────
              // List Agents
              // ─────────────────────────────────────────────────────────────
              listAgents: {
                patterns: [
                  /(show|list|who are|what are) (the |my |our )?agents/i,
                  /who('s| is) available/i,
                  /which agents (do we have|are there)/i,
                  /tell me about (the |our )?agents/i
                ],
                response: () => {
                  const hives = {
                    'Leadership': ['AVERI', 'ATHENA', 'VERA', 'IRIS'],
                    'Design': ['Aurora', 'LEONARDO', 'SAGE'],
                    'Engineering': ['BOLT', 'COMET', 'ARCH'],
                    'Operations': ['SWITCHBOARD', 'RELAY', 'KEEPER'],
                    'Media': ['ATLAS', 'COSMOS', 'MATH', 'RAM_CREW'],
                    'Governance': ['LEX', 'COMPASS', 'CODEX', 'ECHO']
                  };
                  
                  let response = `## 🤖 Your 27-Agent Team

Hey @${user}! Here's everyone available:\n\n`;
                  
                  for (const [hive, members] of Object.entries(hives)) {
                    response += `**${hive}**\n`;
                    for (const name of members) {
                      const agent = agentStatus.agents?.[name];
                      if (agent) {
                        const icon = agent.status === 'active' ? '🟢' : '⚪';
                        response += `- ${icon} ${name} - ${agent.role || agent.purpose}\n`;
                      }
                    }
                    response += '\n';
                  }
                  
                  response += '_Just mention any agent by name to work with them!_';
                  return response;
                }
              },
              
              // ─────────────────────────────────────────────────────────────
              // Talk to VERA (Decision Logging)
              // ─────────────────────────────────────────────────────────────
              vera: {
                patterns: [
                  /(log|record|remember|save) (this|that)/i,
                  /vera.*log/i,
                  /(need to|should) remember/i,
                  /for the record/i,
                  /let's document/i
                ],
                response: () => {
                  // Auto-log to SCRIBE
                  const logDir = 'SCRIBE/session-logs';
                  if (!fs.existsSync(logDir)) {
                    fs.mkdirSync(logDir, { recursive: true });
                  }
                  
                  const logEntry = {
                    timestamp: new Date().toISOString(),
                    agent: 'VERA',
                    user: user,
                    message: comment,
                    issue: context.payload.issue.number,
                    intent: 'decision_logging'
                  };
                  
                  const logFile = `${logDir}/${new Date().toISOString().split('T')[0]}.jsonl`;
                  fs.appendFileSync(logFile, JSON.stringify(logEntry) + '\n');
                  
                  return `## ⚪ VERA - Decision Logged

Hey @${user}! I've recorded this to institutional memory.

**Logged:**
\`\`\`
${comment.substring(0, 200)}${comment.length > 200 ? '...' : ''}
\`\`\`

**Location:** \`${logFile}\`

This decision is now part of our permanent record. I'll remember it for strategic continuity.

_I'm VERA - I log decisions so we never lose context._`;
                }
              },
              
              // ─────────────────────────────────────────────────────────────
              // Talk to IRIS (Unblocking)
              // ─────────────────────────────────────────────────────────────
              iris: {
                patterns: [
                  /(i'm |we're |I am )?(blocked|stuck)/i,
                  /can't (move forward|continue|proceed)/i,
                  /need (help |to )?(unblock|move forward)/i,
                  /iris/i,
                  /remove (this |the )?blocker/i
                ],
                response: () => {
                  return `## 🟣 IRIS - Let's Unblock This

Hey @${user}! I see you're blocked. Let me help.

**Quick Assessment:**
- What's blocking you: ${comment.substring(0, 100)}
- Priority: HIGH (blocking work)
- Action: Immediate escalation

**My Approach:**
1. Identify the core blocker
2. Find fastest path forward
3. Coordinate with other agents if needed
4. Get you moving again

**What I need from you:**
- What specifically is stopping progress?
- What have you tried?
- What's the ideal outcome?

_I'm IRIS - I remove blockers fast. That's my whole job._`;
                }
              },
              
              // ─────────────────────────────────────────────────────────────
              // Talk to ATHENA (Strategic)
              // ─────────────────────────────────────────────────────────────
              athena: {
                patterns: [
                  /(what should|should we)/i,
                  /(strategy|strategic|long.?term)/i,
                  /athena/i,
                  /(wise|wisdom|advice)/i,
                  /big picture/i
                ],
                response: () => {
                  return `## 🟡 ATHENA - Strategic Perspective

Hey @${user}! Let's think through this strategically.

**Your Question:**
> ${comment.substring(0, 150)}

**Strategic Analysis:**
This decision will impact:
- Long-term system architecture
- Team coordination patterns
- Future scalability
- Organizational memory

**My Recommendation:**
Before deciding, consider:
1. What does this enable 6 months from now?
2. How does it align with our core principles?
3. What patterns should we establish?
4. Is this protecting future flexibility?

**Need me to:**
- Deep-dive on strategic implications
- Coordinate with other leadership agents
- Document this for future reference

_I'm ATHENA - I protect the long-term vision while enabling today's work._`;
                }
              },
              
              // ─────────────────────────────────────────────────────────────
              // Engineering Questions (COMET, BOLT)
              // ─────────────────────────────────────────────────────────────
              engineering: {
                patterns: [
                  /(deploy|deployment|backend|api|server)/i,
                  /(code|coding|programming)/i,
                  /(comet|bolt)/i,
                  /(build|compile|run)/i,
                  /technical (issue|problem)/i
                ],
                response: () => {
                  return `## ⚡ Engineering Team Responding

Hey @${user}! Calling in the engineering hive.

**COMET** (Backend) and **BOLT** (Frontend) are on it.

**Your Request:**
> ${comment.substring(0, 150)}

**Quick Check:**
- Backend status: ✅ Running
- Frontend status: ✅ Deployed
- APIs: ✅ Responding

**How we can help:**
- Deploy new features
- Debug technical issues
- Architect solutions
- Write clean code

What specifically needs engineering attention?

_We're COMET & BOLT - we build things that work._`;
                }
              },
              
              // ─────────────────────────────────────────────────────────────
              // General Help
              // ─────────────────────────────────────────────────────────────
              help: {
                patterns: [
                  /^(help|hi|hello|hey)/i,
                  /(what can you|how do i)/i,
                  /(commands|options|features)/i
                ],
                response: () => {
                  return `## 👋 Hey ${user}!

I'm your natural language interface to Brainchild-v2's 27-agent system.

**Just talk naturally!** No commands needed. Examples:

💬 **Casual:**
- "How's everything?"
- "Is the system working?"
- "Who are my agents?"

🤖 **Agent Specific:**
- "VERA, log this decision about..."
- "IRIS, I'm blocked on..."
- "ATHENA, what should we do about..."

🛠️ **Work Requests:**
- "Deploy the backend"
- "Check the API status"
- "Help me unblock this"

**Pro Tips:**
- Just talk like you're texting a team member
- Mention agent names naturally (VERA, IRIS, ATHENA, etc.)
- No slashes, no @mentions - just chat
- VERA auto-logs important decisions

**Want to see all agents?** Just ask "who are my agents?"

What can I help with?`;
                }
              }
            };
            
            // ════════════════════════════════════════════════════════════════
            // MATCH INTENT
            // ════════════════════════════════════════════════════════════════
            
            let matchedIntent = null;
            let matchedKey = null;
            
            for (const [key, intent] of Object.entries(intents)) {
              for (const pattern of intent.patterns) {
                if (pattern.test(comment)) {
                  matchedIntent = intent;
                  matchedKey = key;
                  break;
                }
              }
              if (matchedIntent) break;
            }
            
            // If no match, give helpful hint
            if (!matchedIntent) {
              return {
                response: `## 💭 Hmm, I'm Not Sure

Hey @${user}! I didn't quite catch that.

**You said:**
> ${comment.substring(0, 100)}

**Try asking:**
- "How's everything?" - System status
- "Who are my agents?" - See all 27 agents
- "VERA, log this..." - Record decisions
- "Help" - See what I can do

Or just mention an agent name (VERA, IRIS, ATHENA, etc.) and I'll route to them!

_Tip: You can also use slash commands like \`/status\` or \`/help\` for quick actions._`
              };
            }
            
            // Generate response
            const response = matchedIntent.response();
            
            // Post response
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: response
            });
