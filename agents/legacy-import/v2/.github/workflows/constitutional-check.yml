name: Constitutional Check

# Run on all PRs and pushes
on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  constitutional-compliance:
    name: Article XVIII Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Check for Constitution
        id: constitution
        run: |
          if [ -f docs/CONSTITUTION.md ] || [ -f packages/cle-dna/CONSTITUTION.md ]; then
            echo "✅ Constitution found"
            echo "constitution_present=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Constitution not found - consider adding DNA package"
            echo "constitution_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for DNA package
        id: dna
        run: |
          if [ -d packages/cle-dna ] || grep -q '@creative-liberation-engine/cle-dna' package.json 2>/dev/null; then
            echo "✅ DNA package present"
            echo "dna_present=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ DNA package not found"
            echo "dna_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Run constitutional checks
        if: steps.dna.outputs.dna_present == 'true'
        run: |
          # Build DNA package
          if [ -d packages/cle-dna ]; then
            cd packages/cle-dna
            npm install
            npm run build
            cd ../..
          fi
          
          # Run tests if they exist
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test || echo "⚠️ Tests failed - review required"
          fi

      - name: Check for extractive patterns
        run: |
          echo "🔍 Scanning for potential extractive patterns..."
          
          # Look for potentially extractive language in code
          EXTRACTIVE_PATTERNS=(
            "extract.*value"
            "monetize.*user"
            "capture.*data"
            "exploit"
            "manipulate.*behavior"
          )
          
          VIOLATIONS_FOUND=false
          
          for pattern in "${EXTRACTIVE_PATTERNS[@]}"; do
            if grep -r -i "$pattern" --include="*.ts" --include="*.js" --include="*.tsx" --include="*.jsx" . 2>/dev/null; then
              echo "⚠️ Potential extractive pattern found: $pattern"
              VIOLATIONS_FOUND=true
            fi
          done
          
          if [ "$VIOLATIONS_FOUND" = false ]; then
            echo "✅ No extractive patterns detected"
          else
            echo "⚠️ Extractive patterns detected - manual review required"
            echo "This does not fail the check, but requires human review per Article XVIII"
          fi

      - name: Generate compliance report
        run: |
          echo "## 📜 Constitutional Compliance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Article XVIII: The Artist Liberation Mandate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Constitution | ${{ steps.constitution.outputs.constitution_present == 'true' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DNA Package | ${{ steps.dna.outputs.dna_present == 'true' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Extractive Patterns | Requires Review |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Core Principles" >> $GITHUB_STEP_SUMMARY
          echo "- Generosity over extraction" >> $GITHUB_STEP_SUMMARY
          echo "- Artist-defined success metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Compound learning without conflation" >> $GITHUB_STEP_SUMMARY
          echo "- Dignity in every interaction" >> $GITHUB_STEP_SUMMARY
          echo "- Break-even velocity as baseline success" >> $GITHUB_STEP_SUMMARY
