name: CI — creative-liberation-engine-v5

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Type Check All Packages ────────────────────────────────────────────────
  typecheck:
    name: TypeScript (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: pnpm -r --filter "!scribe-daemon" --filter "!ffmpeg-swarm" exec tsc --noEmit

  # ─── SPECTRE — Accessibility Audit ───────────────────────────────────────────
  accessibility:
    name: SPECTRE Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SPECTRE accessibility audit on HTML templates
        run: |
          node --input-type=module << 'EOF'
          import { readFileSync, readdirSync } from 'fs';
          import { join } from 'path';
          import { runAccessibilityAudit } from './packages/ghost/src/accessibility.js';

          const templatesDir = './packages/atlas-live/templates';
          let failed = 0;

          for (const file of readdirSync(templatesDir).filter(f => f.endsWith('.html'))) {
            const html = readFileSync(join(templatesDir, file), 'utf8');
            const report = await runAccessibilityAudit({ html, wcag_level: 'AA' });
            console.log(`\n[${file}] ${report.badge} — Score: ${report.score}/100`);
            if (report.critical_count > 0) {
              console.error('Critical issues:', report.issues.filter(i => i.severity === 'critical'));
              failed++;
            }
          }

          if (failed > 0) process.exit(1);
          EOF

  # ─── SPECTRE — WATCHD Security Scan ────────────────────────────────────────
  sentinel:
    name: SPECTRE WATCHD Security
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run WATCHD static analysis
        run: |
          node --input-type=module << 'EOF'
          import { SentinelAgent } from './packages/ghost/src/sentinel.js';

          const sentinel = new SentinelAgent();
          const report = await sentinel.runFullScan({
            target_base_url: 'http://localhost:3000',
            categories: ['xss', 'sqli', 'path_traversal', 'prompt_injection', 'auth_bypass'],
            verbose: true,
          });

          console.log(JSON.stringify({
            risk_score: report.risk_score,
            critical: report.critical_count,
            high: report.high_count,
            total_tests: report.total_tests,
            summary: report.summary,
          }, null, 2));

          if (report.critical_count > 0) {
            console.error('🔴 CRITICAL vulnerabilities found — blocking PR');
            process.exit(1);
          }
          EOF

  # ─── ATELIER — Typography Validation ────────────────────────────────────────
  typography-validation:
    name: Typography Validation
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ATELIER CI Validation
        run: pnpm --filter @cle/atelier run validate-typography

  # ─── Build Check ────────────────────────────────────────────────────────────
  build:
    name: Build (all packages)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages (topological order)
        run: pnpm -r --filter "!scribe-daemon" --filter "!ffmpeg-swarm" build

  # ─── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Vitest (all packages)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest across workspace
        run: pnpm -r test --reporter=verbose
