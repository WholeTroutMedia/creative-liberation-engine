name: NAS Bootstrap - Fix Infrastructure

on:
  workflow_dispatch:

jobs:
  fix-infrastructure:
    name: Fix NAS Docker infrastructure
    runs-on: host

    steps:
      - name: Prune stale act-runner networks
        run: |
          docker network prune -f

      - name: Start docker-cleanup cron service
        run: |
          docker rm -f docker-cleanup 2>/dev/null || true
          docker run -d \
            --name docker-cleanup \
            --restart unless-stopped \
            -v /var/run/docker.sock:/var/run/docker.sock \
            docker:cli \
            sh -c "echo cleanup-daemon-started; while true; do sleep 21600; docker network prune -f; docker container prune -f; echo cleanup-done; done"

      - name: Start Ollama on NAS
        run: |
          docker rm -f ollama-nas 2>/dev/null || true
          mkdir -p /volume2/ollama-models
          docker run -d \
            --name ollama-nas \
            --restart unless-stopped \
            --network host \
            -v /volume2/ollama-models:/root/.ollama \
            -e OLLAMA_HOST=0.0.0.0 \
            -e OLLAMA_KEEP_ALIVE=-1 \
            -e OLLAMA_MAX_LOADED_MODELS=3 \
            -e OLLAMA_NUM_PARALLEL=2 \
            ollama/ollama:latest

      - name: Wait for Ollama to boot
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is up"
              break
            fi
            sleep 5
          done

      - name: Pull NAS models
        run: |
          docker exec -d ollama-nas ollama pull nomic-embed-text
          docker exec -d ollama-nas ollama pull llama3.2:3b
          docker exec ollama-nas ollama pull phi4-mini

      - name: Start sony-ftp
        run: |
          docker rm -f sony-ftp 2>/dev/null || true
          docker run -d \
            --name sony-ftp \
            --restart unless-stopped \
            --network host \
            -v "/app/vault/RAW Backups/2026/Barnstorm/live-ingest/incoming:/ftp/sony-ingest" \
            -e "USERS=sony-ingest|test|/ftp/sony-ingest" \
            -e "ADDRESS=127.0.0.1" \
            -e "MIN_PORT=21000" \
            -e "MAX_PORT=21010" \
            delfer/alpine-ftp-server:latest
          echo "sony-ftp started"

      - name: Verify sony-ftp
        run: |
          sleep 5
          docker ps --filter name=sony-ftp --format "table {{.Names}}\t{{.Status}}"
          ss -tlnp | grep :21 && echo "port 21 open" || echo "port 21 not bound yet"
