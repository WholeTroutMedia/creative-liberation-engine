name: Restart Forgejo Runner (Self-Heal)

on:
  workflow_dispatch:

jobs:
  restart-with-root:
    # Uses the host: label — runs directly on NAS shell, no container.
    # This gives us native access to docker without sudo.
    runs-on: host

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Pull latest act_runner image
        run: docker pull gitea/act_runner:latest

      - name: Restart forgejo-runner with user:root fix
        working-directory: infra/forgejo-runner
        run: |
          docker compose down --remove-orphans
          docker compose up -d
          echo "✅ forgejo-runner restarted with user: root"

      - name: Verify runner is up
        run: |
          sleep 5
          docker ps --filter name=forgejo-runner --format "{{.Names}} | {{.Status}}"
