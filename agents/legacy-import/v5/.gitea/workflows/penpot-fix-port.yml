name: Fix Penpot Port Binding

on:
  workflow_dispatch:

jobs:
  fix-penpot:
    name: Fix Penpot Frontend Port
    runs-on: host
    env:
      DOCKER_HOST: "unix:///var/run/docker.sock"

    steps:
      - name: Check current penpot-frontend state
        run: |
          echo "=== Current penpot containers ==="
          docker ps --filter name=penpot --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: Stop and remove old penpot-frontend (wrong port binding)
        run: |
          docker stop penpot-frontend 2>/dev/null || echo "penpot-frontend not running"
          docker rm -f penpot-frontend 2>/dev/null || echo "penpot-frontend container removed or didn't exist"
          echo "✓ Old container removed"

      - name: Ensure cle-mesh network exists
        run: |
          docker network inspect cle-mesh > /dev/null 2>&1 || \
            docker network create cle-mesh
          echo "✓ cle-mesh network ready"

      - name: Pull latest penpot-frontend image
        run: |
          docker pull penpotapp/frontend:latest
          echo "✓ Image pulled"

      - name: Start penpot-frontend with correct port (9001:8080)
        run: |
          docker run -d \
            --name penpot-frontend \
            --restart unless-stopped \
            --network cle-mesh \
            -p 9001:8080 \
            -v penpot_assets:/opt/data/assets \
            -e PENPOT_FLAGS="enable-registration enable-login-with-password disable-email-verification disable-smtp" \
            --label "com.cle.service=design-tool" \
            --label "com.cle.component=penpot" \
            penpotapp/frontend:latest
          echo "✓ penpot-frontend started with 9001:8080"

      - name: Wait and verify Penpot is responding
        run: |
          echo "Waiting for Penpot on port 9001..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9001 > /dev/null 2>&1; then
              echo "✅ Penpot is live at http://127.0.0.1:9001"
              break
            fi
            echo "Attempt $i/20 - waiting 5s..."
            sleep 5
          done

      - name: Show final state
        run: |
          docker ps --filter name=penpot --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
