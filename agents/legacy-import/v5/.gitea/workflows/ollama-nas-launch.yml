name: Ollama NAS — Direct Launch

# Super-simple workflow. No builds. No network deps. Just starts the Ollama container.
# Isolated from deploy-genesis so it never gets queued behind Docker builds.

on:
  workflow_dispatch:

jobs:
  launch-ollama:
    name: Start Ollama on NAS
    runs-on: host

    steps:
      - name: Prune stale Docker networks (fix IPv4 pool exhaustion)
        run: docker network prune -f && echo "Networks pruned"

      - name: Ensure /volume2/ollama-models exists
        run: mkdir -p /volume2/ollama-models

      - name: Stop old container if any
        run: docker rm -f ollama-nas 2>/dev/null || true

      - name: Start Ollama container
        run: |
          docker run -d \
            --name ollama-nas \
            --restart unless-stopped \
            -p 11434:11434 \
            -v /volume2/ollama-models:/root/.ollama \
            -e OLLAMA_HOST=0.0.0.0 \
            -e OLLAMA_KEEP_ALIVE=-1 \
            -e OLLAMA_MAX_LOADED_MODELS=3 \
            -e OLLAMA_NUM_PARALLEL=2 \
            ollama/ollama:latest
          echo "Ollama container started"

      - name: Wait for Ollama to boot
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is up!"
              break
            fi
            echo "Waiting... ($i/12)"
            sleep 5
          done

      - name: Pull routing models
        run: |
          docker exec ollama-nas ollama pull phi4-mini &
          docker exec ollama-nas ollama pull llama3.2:3b &
          docker exec ollama-nas ollama pull nomic-embed-text &
          wait
          echo "All models pulled"

      - name: Verify
        run: |
          curl -s http://localhost:11434/api/tags | grep -o '"name":"[^"]*"'
          echo "Ollama NAS ready on :11434"
