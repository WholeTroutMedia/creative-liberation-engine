name: Penpot Token Sync

on:
  push:
    branches: [main]
    paths:
      - "packages/design-tokens/src/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no changes pushed to Penpot)"
        required: false
        default: "false"

jobs:
  sync-tokens:
    name: Sync ATELIER tokens → Penpot
    runs-on: host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design tokens
        run: pnpm --filter @cle/design-tokens build

      - name: Push tokens to Penpot
        run: node scripts/penpot-push.mjs
        env:
          PENPOT_HOST: ${{ secrets.PENPOT_HOST }}
          PENPOT_TOKEN: ${{ secrets.PENPOT_TOKEN }}
          PENPOT_FILE_ID: ${{ secrets.PENPOT_FILE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
