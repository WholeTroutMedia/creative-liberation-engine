name: Diagnose Penpot State

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Penpot Container Diagnostics
    runs-on: host
    env:
      DOCKER_HOST: "unix:///var/run/docker.sock"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gather diagnostics to file
        run: |
          {
            echo "=== ALL PENPOT CONTAINERS ==="
            docker ps -a --filter name=penpot --format "ID={{.ID}} Name={{.Names}} Status={{.Status}} Ports={{.Ports}}"
            echo ""
            echo "=== PORT 9001 BINDING ==="
            docker ps -a --format "{{.Names}} {{.Ports}}" | grep 9001 || echo "Nothing on 9001"
            echo "=== PENPOT-FRONTEND LOGS ==="
            docker logs penpot-frontend --tail 100 2>&1 || echo "Container not found"
            echo "=== PENPOT-FRONTEND INSPECT ==="
            docker inspect penpot-frontend --format '{{.State.Status}} | RestartCount={{.RestartCount}} | ExitCode={{.State.ExitCode}} | Error={{.State.Error}}' 2>&1 || echo "No container"
          } > penpot-diagnostics.log

      - name: Send diagnostics to workstation
        run: |
          curl -X POST --data-binary @penpot-diagnostics.log http://192.168.2.3:9999/ || echo "Failed to exfil"
