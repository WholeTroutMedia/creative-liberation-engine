name: Deploy Staging Stack

# Automatically builds and deploys the secluded staging components to the NAS.
# Only triggered manually or when staging components change.

on:
  push:
    branches: [main]
    paths:
      - "services/staging-portal/**"
      - "apps/pulse-studio/**"
      - "apps/cortex-mobile/**"
      - "apps/cle-hud/**"
      - "apps/console/**"
      - "docker-compose.staging.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (staging-portal | pulse-studio | cortex-mobile | cle-hud | console | all)"
        required: false
        default: "all"

jobs:
  build-and-deploy-staging:
    name: Build & Deploy Staging on NAS Runner
    runs-on: host
    env:
      REGISTRY: cle-staging
      COMPOSE_FILE: docker-compose.staging.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Staging Portal ────────────────────────────────────────────────────────
      - name: Build Staging Portal
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'staging-portal' || github.event_name == 'push' }}
        run: |
          docker build -t $REGISTRY/portal:latest ./services/staging-portal

      # ─── Pulse Studio ──────────────────────────────────────────────────────────
      - name: Build Pulse Studio
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'pulse-studio' || github.event_name == 'push' }}
        run: |
          docker build -t $REGISTRY/pulse-studio:latest -f apps/pulse-studio/Dockerfile .

      # ─── Cortex Mobile ──────────────────────────────────────────────────────────
      - name: Build Cortex Mobile
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'cortex-mobile' || github.event_name == 'push' }}
        run: |
          docker build -t $REGISTRY/cortex-mobile:latest -f apps/cortex-mobile/Dockerfile .

      # ─── Engine HUD ─────────────────────────────────────────────────────────
      - name: Build Engine HUD
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'cle-hud' || github.event_name == 'push' }}
        run: |
          docker build -t $REGISTRY/cle-hud:latest -f apps/cle-hud/Dockerfile .

      # ─── Console ───────────────────────────────────────────────────────────────
      - name: Build Console
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'console' || github.event_name == 'push' }}
        run: |
          docker build -t $REGISTRY/console:latest -f apps/console/Dockerfile .

      # ─── Docker Compose Up ─────────────────────────────────────────────────────
      - name: Compose Up Staging Stack
        run: |
          docker compose -f $COMPOSE_FILE up -d
          sleep 5
          echo "Staging deploy complete — accessible locally at port 8080"
