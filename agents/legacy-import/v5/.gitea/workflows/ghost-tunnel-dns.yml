name: Add Ghost Tunnel DNS + Reload cloudflared

on:
  workflow_dispatch:

jobs:
  ghost-dns:
    runs-on: self-hosted
    env:
      DOCKER_HOST: "unix:///var/run/docker.sock"

    steps:
      - name: Create ghost.cleengine.systems CNAME via cloudflared
        run: |
          echo "→ Running cloudflared tunnel route dns inside the cloudflared container..."
          docker exec cle-cloudflared cloudflared tunnel route dns \
            cle-genesis ghost.cleengine.systems || \
          docker exec cle-cloudflared cloudflared tunnel route dns \
            CLE-Core ghost.cleengine.systems || \
          echo "⚠️  cloudflared route dns failed — tunnel name may differ, checking tunnel list..."
          docker exec cle-cloudflared cloudflared tunnel list || true

      - name: Reload cloudflared config (graceful restart)
        run: |
          echo "→ Restarting cle-cloudflared to pick up new ghost ingress rule..."
          docker restart cle-cloudflared
          sleep 5
          docker inspect --format='{{.State.Status}}' cle-cloudflared

      - name: Verify ghost.cleengine.systems resolves
        run: |
          echo "→ Checking DNS resolution (may take 30-60s to propagate)..."
          sleep 10
          nslookup ghost.cleengine.systems 1.1.1.1 || true
          curl -sk -o /dev/null -w "HTTP %{http_code}\n" \
            https://ghost.cleengine.systems/health || true
          echo "✅ Done — if HTTP 200, Ghost webhook is live at:"
          echo "   https://ghost.cleengine.systems/webhooks/telnyx/sms"
