name: Deploy Sony FTP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker-compose.nas.yml"
      - "packages/sony-ingest/**"
      - ".gitea/workflows/deploy-sony-ingest.yml"

concurrency:
  group: deploy-sony-ingest
  cancel-in-progress: true

jobs:
  launch-sony-ftp:
    name: Start Sony FTP on NAS
    runs-on: host
    env:
      DOCKER_HOST: "unix:///var/run/docker.sock"

    steps:
      - name: Install Docker CLI v24 (API 1.43)
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-24.0.9.tgz -o docker.tgz
          tar xzvf docker.tgz
          mv docker/docker /usr/bin/docker || true
          mv docker/docker /usr/local/bin/docker || true
          chmod +x /usr/bin/docker 2>/dev/null || true
          chmod +x /usr/local/bin/docker 2>/dev/null || true
          docker --version

      - name: Stop old container if any
        run: docker rm -f sony-ftp 2>/dev/null || true

      - name: Start sony-ftp container
        run: |
          docker run -d \
            --name sony-ftp \
            --restart unless-stopped \
            --network host \
            -v "/app/vault/RAW Backups/2026/Barnstorm/live-ingest/incoming:/ftp/sony-ingest" \
            -e "USERS=sony-ingest|test|/ftp/sony-ingest" \
            -e "ADDRESS=127.0.0.1" \
            -e "MIN_PORT=21000" \
            -e "MAX_PORT=21010" \
            delfer/alpine-ftp-server:latest
          echo "sony-ftp started"

      - name: Verify
        run: |
          sleep 5
          docker ps --filter name=sony-ftp --format "table {{.Names}}\t{{.Status}}"
          ss -tlnp | grep :21 && echo "port 21 up" || echo "waiting on port 21"
