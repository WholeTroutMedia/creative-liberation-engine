name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: 'Relative path to the project to deploy (e.g. apps/magic-haggadah)'
        required: true
        default: 'apps/magic-haggadah'
      project_name:
        description: 'Vercel project name (used for --name flag)'
        required: true
        default: 'magic-haggadah'
  push:
    paths:
      - 'apps/magic-haggadah/**'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PROJECT_PATH="${{ github.event.inputs.project_path || 'apps/magic-haggadah' }}"
          PROJECT_NAME="${{ github.event.inputs.project_name || 'magic-haggadah' }}"
          
          cd "$PROJECT_PATH"
          
          npx vercel --token "$VERCEL_TOKEN" \
            --yes \
            --name "$PROJECT_NAME" \
            --prod \
            2>&1 | tee /tmp/vercel-output.txt
          
          # Extract and surface the deployment URL
          DEPLOY_URL=$(grep -o 'https://[a-zA-Z0-9._-]*\.vercel\.app' /tmp/vercel-output.txt | tail -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "## ✅ Deployed to Vercel" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Open on mobile: \`$DEPLOY_URL\`" >> $GITHUB_STEP_SUMMARY
