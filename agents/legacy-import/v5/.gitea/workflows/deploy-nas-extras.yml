name: Deploy NAS Extras Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker-compose.nas.yml"

concurrency:
  group: deploy-nas-extras
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy NAS Extras (Ollama + Penpot)
    runs-on: host
    env:
      DOCKER_HOST: "unix:///var/run/docker.sock"

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Ensure cle-mesh network exists
        run: docker network create cle-mesh 2>/dev/null || true

      - name: Install Docker CLI v24 (API 1.43)
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-24.0.9.tgz -o docker.tgz
          tar xzvf docker.tgz
          mv docker/docker /usr/bin/docker || true
          mv docker/docker /usr/local/bin/docker || true
          chmod +x /usr/bin/docker 2>/dev/null || true
          chmod +x /usr/local/bin/docker 2>/dev/null || true
          docker --version

      - name: Deploy NAS extras stack
        run: |
          docker compose -p nas-extras -f docker-compose.nas.yml up -d --pull always
          echo "OK NAS extras stack deployed"

      - name: Health check
        run: |
          sleep 15
          echo "=== NAS Extras Health ==="
          curl -sf http://localhost:11434/api/tags && echo "✅ Ollama NAS" || echo "⏳ Ollama NAS (may still be pulling models)"
          docker ps --filter "name=ollama" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
