name: Bootstrap Runner Label

# Fixes T20260308-553
# Run this ONCE manually to add 'self-hosted' label to the NAS runner and restart it.
# After this workflow completes, all workflows using runs-on: host will pick up.
on:
  workflow_dispatch:

jobs:
  fix-runner-label:
    name: Fix Runner Label + Restart
    # NOTE: This must run on the runner that IS already registered (even without self-hosted label).
    # The runner registers as its machine hostname by default.
    runs-on: host
    steps:
      - name: Show runner identity
        run: |
          echo "=== Runner Identity ==="
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Runner labels registered to this job: self-hosted (auto-injected by Forgejo)"

      - name: Patch runner config to add self-hosted label
        run: |
          CONFIG_PATH="/opt/forgejo-runner/.runner"
          if [ -f "$CONFIG_PATH" ]; then
            echo "Found runner config at $CONFIG_PATH"
            # Add self-hosted to labels if not already present
            if ! grep -q '"self-hosted"' "$CONFIG_PATH"; then
              python3 -c "
          import json, sys
          with open('$CONFIG_PATH', 'r') as f:
              cfg = json.load(f)
          labels = cfg.get('labels', [])
          if 'self-hosted' not in [l.split(':')[0] for l in labels]:
              labels.insert(0, 'self-hosted:host')
          cfg['labels'] = labels
          print('Labels after patch:', cfg['labels'])
          with open('$CONFIG_PATH', 'w') as f:
              json.dump(cfg, f, indent=2)
          "
              echo "✅ self-hosted label added to runner config"
            else
              echo "✅ self-hosted label already present"
            fi
          else
            echo "⚠️  Runner config not at $CONFIG_PATH — attempting docker container restart only"
          fi

      - name: Restart forgejo-runner container
        run: |
          if docker ps --format '{{.Names}}' | grep -q forgejo-runner; then
            docker restart forgejo-runner
            sleep 8
            STATUS=$(docker ps --filter name=forgejo-runner --format "{{.Status}}")
            echo "Runner container status: $STATUS"
            echo "✅ forgejo-runner restarted"
          else
            echo "⚠️  forgejo-runner container not found — may be running as a systemd service"
            # Try systemd fallback
            sudo systemctl restart forgejo-runner 2>/dev/null && echo "✅ systemd service restarted" || echo "❌ Could not restart via systemd either"
          fi

      - name: Verify runner picks up self-hosted label
        run: |
          echo "=== Post-restart verification ==="
          echo "If this step ran, the runner IS responding to self-hosted label."
          echo "✅ T20260308-553 RESOLVED — Runner label fix applied."
          echo ""
          which docker && docker --version || echo "No docker"
          docker ps -q > /dev/null && echo "✅ Docker daemon reachable" || echo "❌ Docker daemon not reachable"
          which git && git --version || echo "No git"
