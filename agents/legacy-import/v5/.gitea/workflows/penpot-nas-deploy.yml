name: Wave 35 — Penpot NAS Deploy

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.nas.yml"
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: "Force redeploy even if no compose changes"
        required: false
        default: "false"

jobs:
  deploy-penpot:
    name: Deploy Penpot → NAS Docker
    runs-on: host
    timeout-minutes: 15
    env:
      DOCKER_HOST: "unix:///var/run/docker.sock"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Penpot images
        run: |
          docker pull penpotapp/frontend:latest
          docker pull penpotapp/backend:latest
          docker pull penpotapp/exporter:latest
          docker pull postgres:15-alpine
          docker pull redis:7-alpine

      - name: Create required networks
        run: |
          docker network inspect cle-mesh >/dev/null 2>&1 || \
            docker network create cle-mesh
          docker network inspect penpot-net >/dev/null 2>&1 || \
            docker network create penpot-net

      - name: Deploy Penpot stack
        run: |
          docker compose -f docker-compose.nas.yml up -d --force-recreate \
            penpot-postgres \
            penpot-redis \
            penpot-backend \
            penpot-exporter \
            penpot-frontend

      - name: Wait for Penpot frontend to be ready
        run: |
          echo "Waiting for Penpot frontend on port 9001..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9001 >/dev/null 2>&1; then
              echo "Penpot is live at http://127.0.0.1:9001"
              break
            fi
            echo "Attempt $i/30 - retrying in 5s..."
            sleep 5
          done

      - name: Resolve dispatch task
        env:
          DISPATCH_URL: http://127.0.0.1:5050
        run: |
          TASK_ID="T20260310-980"
          curl -sf -X POST "${DISPATCH_URL}/api/tasks/${TASK_ID}/resolve" \
            -H "Content-Type: application/json" \
            -d "{\"agent_id\":\"gitea-runner\",\"result\":\"Penpot live at http://127.0.0.1:9001\"}" \
            && echo "Dispatch task resolved" \
            || echo "Could not reach dispatch server (continuing)"

      - name: Health summary
        run: |
          echo "=== Penpot Stack Status ==="
          docker compose -f docker-compose.nas.yml ps penpot-frontend penpot-backend penpot-exporter penpot-postgres penpot-redis
