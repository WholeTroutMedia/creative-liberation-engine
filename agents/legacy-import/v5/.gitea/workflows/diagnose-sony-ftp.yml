name: Diagnose Sony FTP

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Docker State + FTP Diagnosis
    runs-on: host
    env:
      DOCKER_HOST: "unix:///var/run/docker.sock"
      DOCKER_API_VERSION: "1.43"
    steps:
      - name: Container status
        run: |
          echo "=== All containers ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "sony|NAME"

      - name: sony-ftp logs
        run: |
          echo "=== sony-ftp logs ==="
          docker logs sony-ftp --tail 30 2>&1 || echo "Container not found or no logs"

      - name: sony-ingest-watcher logs
        run: |
          echo "=== sony-ingest-watcher logs ==="
          docker logs sony-ingest-watcher --tail 20 2>&1 || echo "Container not found"

      - name: Port 21 binding check
        run: |
          echo "=== Port 21 state ==="
          ss -tlnp | grep :21 || echo "Nothing bound to port 21"

      - name: Volume mount check
        run: |
          echo "=== Inspect sony-ftp mounts ==="
          docker inspect sony-ftp --format '{{json .Mounts}}' 2>/dev/null | python3 -m json.tool || echo "Container not found"
