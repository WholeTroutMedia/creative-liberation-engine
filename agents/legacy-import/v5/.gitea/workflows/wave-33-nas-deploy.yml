name: Wave 33 — NAS Deploy (FORGE + Wire + NEXUS)

# SOVEREIGN DEPLOY — Gitea CI/CD ONLY. No SSH. No manual steps.
# The self-hosted runner on the NAS executes docker compose directly.
# See: .agents/workflows/nas-deploy.md

on:
  push:
    branches: [main, "feat/wave-33*"]
    paths:
      - "packages/forge/**"
      - "packages/wire-ingestion-mcp/**"
      - "services/nexus-bridge/**"
      - "docker-compose.nas.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (forge-api | wire-ingestion-mcp | nexus-bridge | all)"
        required: false
        default: "all"

jobs:
  build-and-deploy:
    name: Build & Deploy on NAS Runner
    # Self-hosted runner has docker + compose — executes locally on NAS, no SSH
    runs-on: host
    env:
      REGISTRY: 127.0.0.1:5000
      COMPOSE_FILE: docker-compose.nas.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── FORGE API (Helix A) ──────────────────────────────────────────────────
      - name: Build & Push FORGE API
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'forge-api' || github.event_name == 'push' }}
        run: |
          docker build \
            -t $REGISTRY/forge-api:${{ github.sha }} \
            -t $REGISTRY/forge-api:latest \
            ./packages/forge
          docker push $REGISTRY/forge-api:${{ github.sha }}
          docker push $REGISTRY/forge-api:latest

      # ─── Wire Ingestion MCP (Helix B) ─────────────────────────────────────────
      - name: Build & Push Wire Ingestion MCP
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'wire-ingestion-mcp' || github.event_name == 'push' }}
        run: |
          docker build \
            -t $REGISTRY/wire-ingestion-mcp:${{ github.sha }} \
            -t $REGISTRY/wire-ingestion-mcp:latest \
            ./packages/wire-ingestion-mcp
          docker push $REGISTRY/wire-ingestion-mcp:${{ github.sha }}
          docker push $REGISTRY/wire-ingestion-mcp:latest

      # ─── NEXUS Bridge (Helix C) ───────────────────────────────────────────────
      - name: Build & Push NEXUS Bridge
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'nexus-bridge' || github.event_name == 'push' }}
        run: |
          docker build \
            -t $REGISTRY/nexus-bridge:${{ github.sha }} \
            -t $REGISTRY/nexus-bridge:latest \
            ./services/nexus-bridge
          docker push $REGISTRY/nexus-bridge:${{ github.sha }}
          docker push $REGISTRY/nexus-bridge:latest

      # ─── Docker Compose Up (runs on NAS runner — no SSH) ──────────────────────
      - name: Compose Up — forge-api + wire-ingestion-mcp + nexus-bridge
        run: |
          docker compose -f $COMPOSE_FILE pull forge-api wire-ingestion-mcp nexus-bridge
          docker compose -f $COMPOSE_FILE up -d forge-api wire-ingestion-mcp nexus-bridge
          sleep 5
          echo "=== FORGE health ==="
          curl -sf http://localhost:4300/health && echo " ✓" || echo " ✗ not responding yet"
          echo "=== Wire health ==="
          curl -sf http://localhost:4200/health && echo " ✓" || echo " ✗ not responding yet"
          echo "Wave 33 deploy complete — no SSH needed"

      # ─── Resolve dispatch tasks ───────────────────────────────────────────────
      - name: Resolve dispatch tasks
        run: |
          for task in T20260309-492 T20260309-318 T20260310-328; do
            curl -sf -X POST http://127.0.0.1:5050/api/tasks/$task/resolve \
              -H "Content-Type: application/json" \
              -d "{\"resolved_by\":\"gitea-ci\",\"note\":\"Wave 33 NAS deploy complete - SHA ${{ github.sha }}\"}" \
              && echo "Resolved $task" || echo "Could not reach dispatch for $task"
          done
