name: Deploy GENESIS Stack

on:
  workflow_dispatch:

# Only keep the latest deploy — cancel stale queued runs
concurrency:
  group: deploy-genesis-3
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to NAS
    runs-on: host
    timeout-minutes: 90
    # Executing directly on the NAS host bypasses docker-in-docker socket permission
    env:
      DOCKER_HOST: "unix:///var/run/docker.sock"
      DOCKER_API_VERSION: "1.43"

    steps:
      - name: Checkout
        run: |
          git init .
          git config --local credential.helper '!f() { echo "username=wtm-admin"; echo "password=${FORGEJO_TOKEN}"; }; f'
          git remote add origin http://127.0.0.1:3000/WholeTroutMedia/creative-liberation-engine-v5.git || true
          git remote set-url origin http://127.0.0.1:3000/WholeTroutMedia/creative-liberation-engine-v5.git
          git fetch origin main
          git reset --hard FETCH_HEAD
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

      - name: Ensure Docker CLI + Compose available
        run: |
          echo "Runner arch: $(uname -m) | OS: $(cat /etc/os-release 2>/dev/null | grep PRETTY_NAME | cut -d= -f2 || uname -s)"
          if command -v docker &>/dev/null; then
            echo "✓ Docker CLI already in PATH: $(which docker) — $(docker --version)"
          else
            echo "Docker CLI not found in runner container — downloading static binary..."
            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64|amd64) DOCKER_ARCH="x86_64" ;;
              aarch64|arm64) DOCKER_ARCH="aarch64" ;;
              *) echo "Unsupported arch: $ARCH" && exit 1 ;;
            esac
            mkdir -p /tmp/docker-dl
            wget -q -O /tmp/docker-dl/docker.tgz \
              "https://download.docker.com/linux/static/stable/${DOCKER_ARCH}/docker-24.0.9.tgz"
            tar xzf /tmp/docker-dl/docker.tgz -C /tmp/docker-dl
            cp /tmp/docker-dl/docker/docker /usr/local/bin/docker
            chmod +x /usr/local/bin/docker
            rm -rf /tmp/docker-dl
            echo "✓ Docker CLI installed: $(docker --version)"
          fi
          echo "Installing Docker Compose v2.24.7 plugin..."
          mkdir -p /usr/local/lib/docker/cli-plugins
          wget -q -O /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v2.24.7/docker-compose-linux-$(uname -m)"
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          echo "✓ Compose installed: $(docker compose version)"

      - name: Verify Docker daemon reachable
        run: |
          docker --version
          docker ps -q > /dev/null && echo "✓ Docker daemon reachable" || (echo "Docker daemon unreachable" && exit 1)

      - name: Prune stale Docker networks
        run: |
          docker network prune -f 2>&1 || true
          echo "Stale networks cleared"

      - name: Stop standalone Genkit (port conflict)
        run: |
          docker stop $(docker ps -q --filter "publish=4000") 2>/dev/null || true
          docker stop $(docker ps -q --filter "publish=8000") 2>/dev/null || true
          echo "OK Ports 4000 + 8000 cleared"

      - name: Ensure persistent volumes exist
        run: |
          docker volume create genesis-redis-data 2>/dev/null || true
          docker volume create genesis-dispatch-data 2>/dev/null || true
          docker volume create genesis-nas-assets 2>/dev/null || true
          echo "External volumes ready (survive teardown)"

      - name: Tear down stale stack
        run: |
          docker compose -p creative-liberation-engine-v5 -f docker-compose.genesis.yml down --remove-orphans 2>&1 || true
          echo "Stale containers cleared (volumes preserved)"

      - name: Prune stale build cache
        run: |
          docker builder prune -f --filter "until=24h" 2>/dev/null || true
          echo "Build cache pruned"

      - name: Create required bind-mount stubs
        run: |
          # cloudflared (profile=tunnel) bind-mounts config.yml; Docker validates it even without the profile active
          mkdir -p infra/stealth/cloudflared
          [ -f infra/stealth/cloudflared/config.yml ] || touch infra/stealth/cloudflared/config.yml
          # synology-media-mcp defaults to ~/.ssh/id_ed25519 when NAS_SSH_KEY_PATH is not set
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          [ -f /root/.ssh/id_ed25519 ] || touch /root/.ssh/id_ed25519
          echo "Bind-mount stubs ready"

      - name: Deploy GENESIS stack
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          RUNWAY_API_SECRET: ${{ secrets.RUNWAY_API_SECRET }}
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
          LINEAR_API_KEY=${LINEAR_API_KEY}
          SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
          FIGMA_ACCESS_TOKEN=${FIGMA_ACCESS_TOKEN}
          FAL_KEY=${FAL_KEY}
          ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
          RUNWAY_API_SECRET=${RUNWAY_API_SECRET}
          POSTGRES_PORT=55432
          GITEA_DOMAIN=127.0.0.1
          GITEA_URL=http://127.0.0.1:3000
          NAS_SSH_HOST=127.0.0.1
          NAS_SSH_PORT=2000
          NAS_SSH_USER=admin
          EOF

          # Persist compose + .env on the NAS *host*. The Forgejo runner is often an Alpine
          # job container: plain `mkdir -p /volume2/...` creates paths inside the runner FS,
          # not on Synology, so `docker compose` (host daemon) then fails bind-mounting.
          # Create the tree on the host by bind-mounting /volume2 or /volume1 into alpine.
          COMPOSE_PROJECT_DIR=""
          for BASE in /volume2 /volume1; do
            if docker run --rm -v "${BASE}:/v" alpine sh -c "mkdir -p /v/docker/creative-liberation-engine-v5"; then
              COMPOSE_PROJECT_DIR="${BASE}/docker/creative-liberation-engine-v5"
              break
            fi
          done
          if [ -z "${COMPOSE_PROJECT_DIR}" ]; then
            echo "FATAL: could not create docker/creative-liberation-engine-v5 under /volume2 or /volume1 on host"
            exit 1
          fi
          export COMPOSE_PROJECT_DIR
          # Build contexts in docker-compose.genesis.yml use repo-relative paths (e.g. packages/*).
          # Copying only compose + .env left an empty host dir, so Dockerfiles failed on COPY.
          # Tar the checkout from the runner FS and extract onto the host mount (no pwd bind-mount).
          echo "Syncing workspace to $COMPOSE_PROJECT_DIR (excluding heavy caches)..."
          tar czf - \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./packages/*/node_modules' \
            --exclude='./apps/*/node_modules' \
            --exclude='./.turbo' \
            . | docker run --rm -i \
            -v "${COMPOSE_PROJECT_DIR}:/out" \
            alpine sh -c \
            'apk add --no-cache tar >/dev/null && find /out -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true && tar xzf - -C /out'

          # Serial builds (COMPOSE_PARALLEL_LIMIT=1) prevent OOM when native modules
          # like better-sqlite3 are compiled from source during Docker build.
          export COMPOSE_PARALLEL_LIMIT=1
          docker compose -p creative-liberation-engine-v5 -f docker-compose.genesis.yml up -d --build
          echo "OK GENESIS stack deployed"

      - name: Health check
        run: |
          sleep 20
          echo "=== GENESIS Service Health ==="
          wget -qO- http://localhost:4000/health >/dev/null 2>&1 && echo "✓ Genkit"    || echo "✗ Genkit"
          wget -qO- http://localhost:5050/health >/dev/null 2>&1 && echo "✓ Dispatch"  || echo "✗ Dispatch"
          wget -qO- http://localhost:9000/health >/dev/null 2>&1 && echo "✓ Zero-Day"  || echo "✗ Zero-Day"
          wget -qO- http://localhost:8420/health >/dev/null 2>&1 && echo "✓ AVERI-GW"  || echo "✗ AVERI-GW"
          wget -qO- http://localhost:4300/health >/dev/null 2>&1 && echo "✓ Forge"     || echo "✗ Forge"
          WORKER=$(docker ps --filter "name=dispatch-worker" --format "{{.Status}}" | head -1)
          if [ -n "$WORKER" ]; then echo "✓ Dispatch-Worker ($WORKER)"; else echo "✗ Dispatch-Worker"; fi
          echo ""
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" || true
          echo ""
          echo "=== dispatch logs (tail 100) ==="
          docker logs --tail 100 creative-liberation-engine-v5-dispatch-1 2>&1 || true
          echo ""
          echo "=== dispatch inspect health ==="
          docker inspect creative-liberation-engine-v5-dispatch-1 --format '{{json .State.Health}}' 2>&1 || true
          echo ""
          echo "=== genkit logs (tail 50) ==="
          docker logs --tail 50 creative-liberation-engine-v5-genkit-1 2>&1 || true
          echo ""
          echo "=== gateway logs (tail 50) ==="
          docker logs --tail 50 creative-liberation-engine-v5-gateway-1 2>&1 || true
          echo ""
          echo "=== genmedia logs (tail 50) ==="
          docker logs --tail 50 creative-liberation-engine-v5-genmedia-1 2>&1 || true
          echo ""
          echo "=== forge logs (tail 50) ==="
          docker logs --tail 50 creative-liberation-engine-v5-forge-1 2>&1 || true

      - name: Cleanup Docker networks (always)
        if: always()
        run: |
          docker network prune -f 2>&1 || true
          echo "Post-run network cleanup complete"
