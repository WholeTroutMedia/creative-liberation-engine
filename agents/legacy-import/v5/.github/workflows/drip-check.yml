name: drip-check

on:
  schedule:
    # Every Monday at 9:00 AM UTC — weekly cadence
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Specific staged package ID to force-release (leave empty for auto timed check)'
        required: false
        default: ''

jobs:
  drip:
    name: Check and execute timed drips
    runs-on: ubuntu-latest

    steps:
      - name: Checkout creative-liberation-engine-v5
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clone public repo
        run: |
          git clone https://x-access-token:${{ secrets.PUBLIC_GITHUB_TOKEN }}@github.com/CLE-Engine-Community/creative-liberation-engine.git \
            ../creative-liberation-engine-public

      - name: Configure git identity
        run: |
          git config --global user.email "cortex@creative-liberation-engine.io"
          git config --global user.name "CORTEX Release Bot"

      - name: Run timed drip check
        run: |
          if [ -n "${{ github.event.inputs.release_id }}" ]; then
            npx ts-node scripts/drip/scrub-export.ts --release "${{ github.event.inputs.release_id }}" --push
          else
            npx ts-node scripts/drip/scrub-export.ts --push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_GITHUB_TOKEN }}

      - name: Generate changelog
        run: npx ts-node scripts/drip/generate-changelog.ts

      - name: Commit changelog to public repo
        run: |
          cd ../creative-liberation-engine-public
          if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
            git add CHANGELOG.md
            git commit -m "docs: update changelog"
            git push origin main
          fi
