name: Spatial Intelligence CI
on:
  push:
    paths: ['packages/spatial-intelligence/**']
  pull_request:
    paths: ['packages/spatial-intelligence/**']
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/spatial-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src/ tests/
      - run: mypy src/ --ignore-missing-imports
      - run: pytest tests/ -v --tb=short -x
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/spatial-intelligence/Dockerfile -t spatial-intelligence:test packages/spatial-intelligence/
