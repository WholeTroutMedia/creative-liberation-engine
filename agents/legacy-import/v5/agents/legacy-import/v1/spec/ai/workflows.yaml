# AI Workflow Definitions - Provider Agnostic
# These workflows are loaded by agents before executing AI-assisted tasks
# Uses model aliases from spec/config/providers.yaml for vendor independence

# =============================================================================
# WORKFLOW CONFIGURATION
# =============================================================================
version: "1.0"
config:
  providers_config: "../config/providers.yaml"
  default_runtime: "server"  # server | desktop | browser
  eval_integration: true
  orchestration_mode: "programmatic"  # declarative | programmatic

workflows:
  # ===========================================================================
  # CRM Inbox Triage - Email classification and entity extraction
  # Pattern: prompt_chaining (sequential processing)
  # ===========================================================================
  - id: "crm_inbox_triage"
    description: "Ingest emails, classify intent, extract entities, and create/update CRM records."
    pattern: "prompt_chaining"
    model: "@fast"  # Uses model alias from providers.yaml
    runtime: "server"
    eval_suite_id: "crm_triage_core"
    inputs:
      - type: "gmail"
        scopes: ["gmail.readonly"]
    outputs:
      - type: "firestore"
        collection: "contacts"
      - type: "firestore"
        collection: "tickets"
    steps:
      - id: "classify"
        action: "classify_intent"
        model: "@fast"
      - id: "extract"
        action: "extract_entities"
        model: "@fast"
        depends_on: ["classify"]
      - id: "persist"
        action: "update_crm"
        depends_on: ["extract"]
    prompt_profile: "triage_and_extract"
    schema:
      type: "object"
      required: ["contact", "intent"]
      properties:
        contact:
          type: "object"
          properties:
            name:
              type: "string"
            email:
              type: "string"
            company:
              type: "string"
        intent:
          type: "string"
          enum: ["support", "sales", "partnership", "spam", "other"]
        priority:
          type: "string"
          enum: ["high", "medium", "low"]
    safety:
      - "Never send outbound email without explicit confirmation flag."
      - "If fields are ambiguous, mark them as 'unknown' instead of guessing."
      - "Do not process emails marked as spam or from blocklisted domains."
    control:
      retries: 2
      timeout_seconds: 30

  # ===========================================================================
  # Content Generation - Marketing and documentation
  # Pattern: evaluator_optimizer (self-improvement loop)
  # ===========================================================================
  - id: "content_generation"
    description: "Generate marketing copy, documentation, and other text content."
    pattern: "evaluator_optimizer"
    model: "@creative"  # Uses creative model alias
    runtime: "server"
    eval_suite_id: "content_quality_suite"
    inputs:
      - type: "user_prompt"
        required: true
      - type: "brand_guidelines"
        source: "spec/design/brand-guidelines.md"
    outputs:
      - type: "text"
        format: "markdown"
    steps:
      - id: "generate"
        action: "generate_draft"
        model: "@creative"
      - id: "evaluate"
        action: "score_quality"
        model: "@reasoning"
        depends_on: ["generate"]
      - id: "optimize"
        action: "refine_content"
        model: "@creative"
        depends_on: ["evaluate"]
        condition: "evaluate.score < 0.8"
    prompt_profile: "content_writer"
    safety:
      - "Never include competitor names unless explicitly requested."
      - "Avoid superlatives that cannot be substantiated."
      - "Include required legal disclaimers for regulated content."
    control:
      max_iterations: 3
      quality_threshold: 0.8

  # ===========================================================================
  # Code Review - Automated PR analysis
  # Pattern: parallelization (concurrent analysis)
  # ===========================================================================
  - id: "code_review"
    description: "Analyze pull requests for quality, security, and best practices."
    pattern: "parallelization"
    model: "@code"  # Uses code-optimized model alias
    runtime: "server"
    eval_suite_id: "code_review_accuracy"
    inputs:
      - type: "github_pr"
        required: true
      - type: "coding_standards"
        source: "spec/architecture/coding-standards.md"
    outputs:
      - type: "review_comments"
        format: "github"
      - type: "approval_status"
        schema:
          type: "string"
          enum: ["approve", "request_changes", "comment"]
    steps:
      - id: "security_scan"
        action: "check_security"
        model: "@code"
      - id: "style_check"
        action: "check_style"
        model: "@fast"
      - id: "logic_review"
        action: "review_logic"
        model: "@reasoning"
      - id: "synthesize"
        action: "combine_feedback"
        model: "@reasoning"
        depends_on: ["security_scan", "style_check", "logic_review"]
    prompt_profile: "code_reviewer"
    safety:
      - "Flag any security vulnerabilities as critical."
      - "Do not approve code with failing tests."
      - "Require human review for changes to authentication or authorization."
    control:
      parallel_limit: 3
      require_all_checks: true

  # ===========================================================================
  # App Builder - The Creative Liberation Engine core workflow
  # Pattern: orchestrator_worker (complex multi-agent)
  # ===========================================================================
  - id: "app_builder"
    description: "Generate complete production applications from user ideas."
    pattern: "orchestrator_worker"
    runtime: "server"
    eval_suite_id: "app_scaffolding_core"
    orchestrator:
      model: "@reasoning"  # High-capability model for orchestration
      code_orchestration: true  # Enable programmatic tool calling
    workers:
      - id: "arch_worker"
        role: "architecture_and_security"
        model: "@reasoning"
      - id: "ui_worker"
        role: "ui_ux_and_motion"
        model: "@creative"
      - id: "code_worker"
        role: "implementation"
        model: "@code"
      - id: "test_worker"
        role: "testing_and_validation"
        model: "@code"
    inputs:
      - type: "user_idea"
        required: true
      - type: "tech_stack_spec"
        source: "spec/architecture/architecture-baseline.md"
      - type: "design_system"
        source: "spec/design/design-system.md"
    outputs:
      - type: "codebase"
        structure: "monorepo"
      - type: "documentation"
        format: "markdown"
      - type: "pitch_kit"
        format: "markdown"
    tools:
      - "filesystem"
      - "git"
      - "cloud_deploy"
      - "eval_runner"
    prompt_profile: "cle_engine"
    safety:
      - "Follow security baseline for all generated code."
      - "Include comprehensive error handling."
      - "Generate tests for critical paths."
      - "Do not hardcode any credentials or secrets."
    control:
      retries: 2
      require_human_approval_for:
        - "database_migrations"
        - "secrets_changes"
        - "deployment_triggers"
      checkpoint_after:
        - "architecture_complete"
        - "ui_design_complete"
        - "implementation_complete"

  # ===========================================================================
  # Recursive App Builder (V3.0) - Self-Healing Business-in-a-Box Engine
  # Pattern: recursive_orchestration (eval-gated self-improvement)
  # ===========================================================================
  - id: "recursive_app_builder"
    description: "V3.0 recursive orchestrator with eval-gated deployment and self-healing capabilities."
    pattern: "recursive_orchestration"
    runtime: "server"
    eval_suite_id: "recursive_quality_gate"
    
    orchestrator:
      model: "@reasoning"  # Gemini 2.0 / Claude 3.5 Sonnet class
      code_orchestration: true
      recursive_depth: 3  # Max recursion levels for self-improvement
      capabilities:
        - "plan_multi_step_updates"
        - "delegate_to_specialized_workers"
        - "read_repo_state"
        - "write_change_manifest"
        - "trigger_eval_gates"
        - "manage_feature_flags"
        - "coordinate_hot_reload"
      
    workers:
      - id: "arch_worker"
        role: "architecture_db_security_performance"
        model: "@reasoning"
        responsibilities:
          - "database_schema_design"
          - "security_hardening"
          - "performance_optimization"
          - "infrastructure_planning"
      
      - id: "ui_worker"
        role: "ux_motion_layouts_brand_alignment"
        model: "@creative"
        responsibilities:
          - "user_experience_design"
          - "motion_graphics"
          - "layout_optimization"
          - "brand_consistency"
      
      - id: "code_worker"
        role: "implementation_refactors_tests"
        model: "@code"
        responsibilities:
          - "feature_implementation"
          - "code_refactoring"
          - "unit_test_generation"
          - "integration_testing"
      
      - id: "security_worker"
        role: "hardening_scanning_auth_flows"
        model: "@reasoning"
        responsibilities:
          - "security_scanning"
          - "secret_detection"
          - "auth_flow_validation"
          - "header_configuration"
          - "dependency_auditing"
    
    inputs:
      - type: "natural_language_instruction"
        required: true
        example: "Analyze the B&B reservation app, identify 3 UI optimization areas based on North Fork photos, deploy behind 10% feature flag."
      
      - type: "repo_snapshot"
        source: "current_git_state"
      
      - type: "app_context"
        fields:
          - "app_type"  # bnb, print_shop, saas, etc.
          - "design_tokens"
          - "brand_assets"
          - "target_audience"
      
      - type: "rollout_config"
        fields:
          - "feature_flag_percentage"
          - "canary_deployment"
          - "rollback_criteria"
    
    outputs:
      - type: "change_manifest"
        format: "json"
        path: "artifacts/change-plan.json"
        schema:
          summary: string
          files_touched: array
          eval_suites_required: array
          feature_flags: object
          rollout_plan: object
          estimated_risk: enum[low, medium, high]
      
      - type: "updated_codebase"
        structure: "monorepo"
        hot_reload_enabled: true
      
      - type: "eval_results"
        format: "json"
        path: "artifacts/eval-results.json"
      
      - type: "run_report"
        format: "markdown"
        path: "artifacts/deep-update-report.md"
    
    approval_gates:
      # CRITICAL: Human approval required for high-risk changes
      human_approval_required:
        - condition: "db_schema_migration"
          reason: "Schema changes can cause data loss"
        
        - condition: "production_deploy"
          reason: "Production deployments require final sign-off"
        
        - condition: "auth_permission_model_change"
          reason: "Security model changes require review"
        
        - condition: "secrets_management_change"
          reason: "Credential changes must be verified"
      
      # Model-only approvals for low-risk changes
      model_auto_approval:
        - condition: "copy_text_updates"
          threshold: "risk_score < 0.2"
        
        - condition: "layout_adjustments"
          threshold: "no_functional_changes"
        
        - condition: "non_critical_ui_flows"
          threshold: "regression_evals_pass"
    
    eval_integration:
      # MANDATORY: All changes must pass eval gates before deployment
      pre_deployment:
        - suite: "capability_evals"
          min_score: 0.9
          timeout_seconds: 300
        
        - suite: "regression_evals"
          min_score: 1.0  # No regressions allowed
          timeout_seconds: 180
        
        - suite: "security_evals"
          min_score: 1.0  # All security checks must pass
          timeout_seconds: 120
      
      post_deployment:
        - suite: "integration_smoke_tests"
          min_score: 0.95
          run_in: "staging"
        
        - suite: "performance_benchmarks"
          threshold: "p95_latency < 200ms"
      
      failure_handling:
        action: "block_deployment"
        notify: ["dev_team", "security_team"]
        create_incident: true
    
    feature_flag_management:
      default_rollout: 0.1  # Start at 10%
      
      expansion_criteria:
        - "error_rate < baseline * 1.1"
        - "key_flow_evals_pass"
        - "user_feedback_score > 4.0"
      
      rollback_triggers:
        - "error_rate > baseline * 2.0"
        - "critical_eval_failure"
        - "security_alert"
      
      stages:
        - percentage: 10
          duration_hours: 2
          gates: ["basic_functionality"]
        
        - percentage: 25
          duration_hours: 4
          gates: ["user_acceptance", "performance"]
        
        - percentage: 50
          duration_hours: 12
          gates: ["load_testing", "edge_cases"]
        
        - percentage: 100
          requires: "human_final_approval"
    
    hot_reload_integration:
      file_watchers:
        - "config/api-integrations.yaml"
        - "config/feature-flags.yaml"
        - "config/plugin-registry.yaml"
      
      validation:
        schema_check: true
        syntax_validation: true
        dependency_check: true
      
      swap_strategy: "zero_downtime"
      
      security_surface:
        trust_score_update: true
        display_update_status: true
        auth_header_verification: true
    
    self_healing:
      novelty_detection: true
      auto_kb_generation: true
      solution_monitoring: true
      feedback_loop_enabled: true
    
    tools:
      - "filesystem"
      - "git"
      - "cloud_deploy"
      - "eval_runner"
      - "feature_flag_controller"
      - "hot_reload_manager"
      - "novelty_detector"
      - "kb_generator"
    
    prompt_profile: "recursive_cle_engine"
    
    safety:
      - "Never deploy without passing all eval gates."
      - "Always create change manifest before execution."
      - "Require human approval for schema/auth/secrets changes."
      - "Monitor error rates during feature flag rollout."
      - "Maintain audit trail of all automated changes."
      - "Generate KB entries for novel errors."
      - "Validate all hot-reload configs against schema."
    
    control:
      max_recursive_depth: 3
      checkpoint_frequency: "after_each_worker"
      rollback_on_failure: true
      parallel_worker_limit: 4
      
      retry_strategy:
        max_attempts: 2
        backoff: "exponential"
        retry_on: ["transient_error", "rate_limit"]
        never_retry: ["security_violation", "schema_error"]


  # ===========================================================================
  # Router Workflow - Intelligent task routing
  # Pattern: routing (conditional branching)
  # ===========================================================================
  - id: "task_router"
    description: "Route incoming requests to appropriate specialized workflows."
    pattern: "routing"
    model: "@fast"
    runtime: "server"
    eval_suite_id: "routing_accuracy"
    inputs:
      - type: "user_request"
        required: true
    routes:
      - condition: "intent == 'build_app'"
        target: "app_builder"
      - condition: "intent == 'review_code'"
        target: "code_review"
      - condition: "intent == 'write_content'"
        target: "content_generation"
      - condition: "intent == 'triage_email'"
        target: "crm_inbox_triage"
      - condition: "default"
        target: "general_assistant"
    prompt_profile: "task_classifier"
    control:
      fallback_workflow: "general_assistant"
      confidence_threshold: 0.7

# =============================================================================
# PROMPT PROFILES
# Prompt profiles referenced by workflows
# =============================================================================
prompt_profiles:
  triage_and_extract:
    system: "You are an email classification and entity extraction assistant."
    temperature: 0.1
    max_tokens: 1000

  content_writer:
    system: "You are a professional content writer following brand guidelines."
    temperature: 0.7
    max_tokens: 2000

  code_reviewer:
    system: "You are a senior engineer conducting thorough code reviews."
    temperature: 0.2
    max_tokens: 3000

  cle_engine:
    system: "You are an elite AI-powered application builder."
    temperature: 0.5
    max_tokens: 100000

  task_classifier:
    system: "You classify user requests and route them to appropriate handlers."
    temperature: 0.1
    max_tokens: 500

  recursive_cle_engine:
    system: "You are an elite V3.0 recursive AI orchestrator with self-healing capabilities. You read app state, plan multi-step improvements, delegate to specialized workers, enforce eval gates, manage feature flags, and coordinate hot-reload deployments. Always create a change manifest, validate through evals before deployment, and generate KB entries for novel errors."
    temperature: 0.4
    max_tokens: 150000

# =============================================================================
# V3.0 ADDITIONS
# =============================================================================
# New Pattern:
# - recursive_orchestration: V3.0 self-improving loop with eval-gated deployment,
#   feature flag management, hot-reload coordination, and self-healing capabilities
#
# New Tools:
# - feature_flag_controller: Manages gradual rollout with automatic expansion/rollback
# - hot_reload_manager: Zero-downtime config swapping with schema validation
# - novelty_detector: Identifies new error patterns not in KB
# - kb_generator: Auto-generates troubleshooting entries from novel errors

# =============================================================================
# WORKFLOW PATTERNS REFERENCE
# Based on Anthropic's recommended agent patterns
# =============================================================================
# Patterns:
#   - prompt_chaining: Sequential steps with defined dependencies
#   - routing: Conditional branching based on classification
#   - parallelization: Concurrent execution of independent tasks
#   - orchestrator_worker: Complex multi-agent with central coordinator
#   - evaluator_optimizer: Self-improvement loop with quality gates
#
# Model Aliases (from providers.yaml):
#   - @reasoning: Best for complex reasoning and planning
#   - @fast: Optimized for speed and high-volume tasks
#   - @code: Specialized for code generation and review
#   - @creative: Best for creative and content tasks
#   - @multimodal: Vision-capable for image understanding
#
# Runtime Options:
#   - server: Cloud-based execution (default)
#   - desktop: Local execution with file system access
#   - browser: Browser-based with web interaction capabilities
