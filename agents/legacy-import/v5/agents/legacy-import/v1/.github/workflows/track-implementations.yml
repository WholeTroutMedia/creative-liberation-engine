name: Track Implementations

# Auto-update IMPLEMENTATION_TRACKER.md when changes are pushed

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.sh'
      - '**.yml'
      - '**.md'

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install anthropic
      
      - name: Detect new implementations
        id: detect
        run: |
          echo "Checking for new implementations..."
          
          # Find recently modified implementation files
          NEW_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(py|js|ts|sh)$' | grep -v test | grep -v node_modules || true)
          
          if [ -n "$NEW_FILES" ]; then
            echo "new_files<<EOF" >> $GITHUB_OUTPUT
            echo "$NEW_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_new_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_new_files=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update tracker
        if: steps.detect.outputs.has_new_files == 'true'
        run: |
          echo "New files detected:"
          echo "${{ steps.detect.outputs.new_files }}"
          
          # Update IMPLEMENTATION_TRACKER.md
          python3 << 'PYTHON_SCRIPT'
          import re
          from pathlib import Path
          from datetime import datetime
          
          tracker_path = Path('IMPLEMENTATION_TRACKER.md')
          if not tracker_path.exists():
              print("Tracker not found")
              exit(0)
          
          content = tracker_path.read_text()
          new_files = """${{ steps.detect.outputs.new_files }}""".strip().split('\n')
          
          # For each new file, try to update corresponding tracker entry
          for file in new_files:
              if not file:
                  continue
              
              # Try to match file to a design doc
              # e.g., scripts/auto_implement.py -> auto_implement or IMPLEMENTATION
              base_name = Path(file).stem
              
              # Update status from 🔴 to 🟡 (in progress)
              pattern = rf'(\| \[.*{base_name}.*\]\(.*\) \| )🔴( .* \|)'
              content = re.sub(pattern, r'\1🟡\2', content, flags=re.IGNORECASE)
              
              # If it's a complete implementation, mark as 🟢
              if 'test' not in file.lower():
                  pattern = rf'(\| \[.*{base_name}.*\]\(.*\) \| )🟡( .* \|)'
                  content = re.sub(pattern, r'\1🟢\2', content, flags=re.IGNORECASE)
          
          # Update "Last Updated" timestamp
          now = datetime.now().strftime("%Y-%m-%d %H:%M EST")
          content = re.sub(
              r'\*\*Last Updated\*\*: .*',
              f'**Last Updated**: {now}',
              content
          )
          
          # Write back
          tracker_path.write_text(content)
          print("Tracker updated")
          PYTHON_SCRIPT
      
      - name: Commit tracker updates
        if: steps.detect.outputs.has_new_files == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          if git diff --quiet IMPLEMENTATION_TRACKER.md; then
            echo "No tracker changes"
          else
            git add IMPLEMENTATION_TRACKER.md
            git commit -m "Auto-update implementation tracker [skip ci]"
            git push
          fi
      
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && steps.detect.outputs.has_new_files == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎉 Implementation detected! IMPLEMENTATION_TRACKER.md has been updated automatically.'
            })
