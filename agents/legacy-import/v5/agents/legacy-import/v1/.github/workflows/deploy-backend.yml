name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  issue_comment:
    types: [created]

jobs:
  deploy:
    # Only run on comments containing /deploy-backend
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && 
       contains(github.event.comment.body, '/deploy-backend'))
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      issues: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: React to trigger comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });
      
      - name: Post deployment start comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '🚀 **Backend deployment started**\n\nBuilding and deploying to Cloud Run...\n\n_I\'ll update you when it\'s live._'
            });
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
      
      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker
      
      - name: Enable required APIs
        run: |
          gcloud services enable \
            cloudbuild.googleapis.com \
            run.googleapis.com \
            containerregistry.googleapis.com \
            aiplatform.googleapis.com \
            sqladmin.googleapis.com \
            --quiet
      
      - name: Build and push Docker image
        run: |
          export PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          export IMAGE_NAME="gcr.io/$PROJECT_ID/cle-engine-api"
          
          gcloud builds submit \
            --tag $IMAGE_NAME \
            --timeout=20m \
            cle_engine/
      
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          export PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          export REGION="${{ secrets.GCP_REGION || 'us-central1' }}"
          export SERVICE_NAME="cle-engine-api"
          export IMAGE_NAME="gcr.io/$PROJECT_ID/$SERVICE_NAME"
          
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_NAME \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --set-env-vars "DEV_MODE=false" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT_ID" \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --quiet
          
          # Get service URL
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION \
            --format 'value(status.url)')
          
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT
      
      - name: Test health endpoint
        id: health_check
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.SERVICE_URL }}"
          
          # Wait for service to be ready (max 60 seconds)
          for i in {1..12}; do
            if curl -sf "$SERVICE_URL/health" > /dev/null; then
              echo "Health check passed!"
              echo "HEALTH_STATUS=healthy" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting for service to be ready... ($i/12)"
            sleep 5
          done
          
          # Get health response
          HEALTH_RESPONSE=$(curl -s "$SERVICE_URL/health" || echo "Service starting...")
          echo "HEALTH_RESPONSE<<EOF" >> $GITHUB_OUTPUT
          echo "$HEALTH_RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Post success comment
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const serviceUrl = '${{ steps.deploy.outputs.SERVICE_URL }}';
            const healthStatus = '${{ steps.health_check.outputs.HEALTH_STATUS }}';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `## ✅ Backend Deployment Complete\n\n` +
                    `**Service URL:** ${serviceUrl}\n` +
                    `**API Docs:** ${serviceUrl}/docs\n` +
                    `**Health Check:** ${serviceUrl}/health\n\n` +
                    `**Status:** ${healthStatus === 'healthy' ? '🟢 Healthy' : '🟡 Starting...'}\n\n` +
                    `**Features Available:**\n` +
                    `- ✅ Vertex AI (Imagen 3, Veo 2, Gemini 2.0)\n` +
                    `- ✅ Media Library\n` +
                    `- ✅ Workflow Engine\n` +
                    `- ✅ Admin Dashboard\n` +
                    `- ✅ WebSocket Real-Time\n\n` +
                    `**Auto-scaling:** 0-10 instances\n` +
                    `**Region:** ${{ secrets.GCP_REGION || 'us-central1' }}\n\n` +
                    `_Engine is revving. Ready for frontend connection._`
            });
      
      - name: Post failure comment
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `## ❌ Backend Deployment Failed\n\n` +
                    `Check the [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\n` +
                    `**Common issues:**\n` +
                    `- GCP credentials not configured\n` +
                    `- Billing not enabled\n` +
                    `- API permissions missing\n\n` +
                    `_I\'ll need human assistance to resolve this._`
            });
      
      - name: Update Issue #39 on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const serviceUrl = '${{ steps.deploy.outputs.SERVICE_URL }}';
            
            // Get current issue body
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 39
            });
            
            // Add deployment info to issue (this would be more sophisticated in practice)
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 39,
              body: `## ✅ Task 1 Complete: Backend Deployed\n\n` +
                    `**API URL:** ${serviceUrl}\n` +
                    `**Deployed:** ${new Date().toISOString()}\n` +
                    `**Status:** Live and healthy\n\n` +
                    `Moving to Task 2: Homepage deployment`
            });
