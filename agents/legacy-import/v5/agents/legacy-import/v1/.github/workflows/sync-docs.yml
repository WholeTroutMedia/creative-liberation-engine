name: Sync Build Directives

on:
  push:
    paths:
      - 'CLE-Engine-Brainchild-Technical-Manuscript.md'
      - 'docs/manuscript.md'
    branches:
      - main
  
  # Manual trigger for on-demand sync
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if no changes detected'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  sync-directives:
    name: Sync Build Directives from Manuscript
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install requests python-dateutil pyyaml
      
      - name: Check for manuscript changes
        id: check_changes
        run: |
          # Check if manuscript has changed in last commit
          if git diff --name-only HEAD~1 | grep -q 'CLE-Engine-Brainchild-Technical-Manuscript.md\|docs/manuscript.md'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Extract build directives
        if: steps.check_changes.outputs.changed == 'true' || github.event.inputs.force_sync == 'true'
        run: |
          python scripts/extract_directives.py \
            --tracker IMPLEMENTATION_TRACKER.md \
            --output .comet/directives.json
      
      - name: Update COMET_BUILD_DIRECTIVES.md
        if: steps.check_changes.outputs.changed == 'true' || github.event.inputs.force_sync == 'true'
        run: |
          python scripts/update_manuscript.py \
            --design-docs docs/designs \
            --manuscript docs/manuscript.md \
            --output COMET_BUILD_DIRECTIVES.md
      
      - name: Update build failures log
        run: |
          # Update last_updated timestamp in build_failures.json
          if [ -f spec/build_failures.json ]; then
              python -c "import json; from datetime import datetime; f = open('spec/build_failures.json', 'r'); data = json.load(f); f.close(); data['last_updated'] = datetime.utcnow().strftime('%Y-%m-%d'); f = open('spec/build_failures.json', 'w'); json.dump(data, f, indent=2); f.close()"
            fi      
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs(automation): sync build directives from manuscript'
          file_pattern: |
            COMET_BUILD_DIRECTIVES.md
            .comet/directives.json
            spec/build_failures.json
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
      
      - name: Create sync report
        run: |
          echo "## Sync Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Manuscript changed**: ${{ steps.check_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force sync**: ${{ github.event.inputs.force_sync || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Updated" >> $GITHUB_STEP_SUMMARY
          echo "- COMET_BUILD_DIRECTIVES.md" >> $GITHUB_STEP_SUMMARY
          echo "- .comet/directives.json" >> $GITHUB_STEP_SUMMARY
          echo "- spec/build_failures.json" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    needs: sync-directives
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        run: |
          echo "::error::Sync Build Directives workflow failed. Please check the logs."
          echo "## Workflow Failed" >> $GITHUB_STEP_SUMMARY
          echo "The sync-directives job failed. Please review the error logs." >> $GITHUB_STEP_SUMMARY
