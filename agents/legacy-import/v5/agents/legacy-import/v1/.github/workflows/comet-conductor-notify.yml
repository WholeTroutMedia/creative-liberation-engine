name: Comet Conductor - Task Added Notification

on:
  push:
    paths:
      - 'core/task_queue/pending/*.yaml'
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Count pending tasks
        id: count
        run: |
          count=$(ls core/task_queue/pending/*.yaml 2>/dev/null | wc -l)
          echo "task_count=$count" >> $GITHUB_OUTPUT
      
      - name: Create notification
        run: |
          echo "🔔 New task(s) added to queue!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pending Tasks**: ${{ steps.count.outputs.task_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Comet Conductor will pick these up automatically." >> $GITHUB_STEP_SUMMARY
      
      - name: Create task ping file
        run: |
          date > core/task_queue/.task_added
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add core/task_queue/.task_added
          git commit -m "Ping: New task(s) added to queue" || true
          git push || true
