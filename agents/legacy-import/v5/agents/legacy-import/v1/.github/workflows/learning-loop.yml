name: Learning Loop - Continuous Improvement System

on:
  # Trigger after any workflow completes
  workflow_run:
    workflows:
      - "Auto-Sync Manuscript & Implementation"
      - "Track Implementations"
      - "Comet Automation Suite"
    types:
      - completed
  
  # Also run on schedule for comprehensive analysis
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday midnight
  
  workflow_dispatch:
    inputs:
      analysis_depth:
        description: 'Depth of analysis (quick/standard/deep)'
        required: false
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - deep

env:
  LEARNING_DATA_PATH: .learning
  METRICS_FILE: .learning/metrics.json
  PATTERNS_FILE: .learning/patterns.json

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    outputs:
      has_new_data: ${{ steps.collect.outputs.has_new_data }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests pandas

      - name: Ensure learning directory exists
        run: mkdir -p ${{ env.LEARNING_DATA_PATH }}

      - name: Collect build metrics
        id: collect
        run: |
          python << 'EOF'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          
          metrics_file = Path(os.environ['METRICS_FILE'])
          
          # Load existing metrics or create new
          if metrics_file.exists():
              with open(metrics_file) as f:
                  metrics = json.load(f)
          else:
              metrics = {'history': [], 'summary': {}}
          
          # Collect current session metrics
          session = {
              'timestamp': datetime.now().isoformat(),
              'trigger': os.environ.get('GITHUB_EVENT_NAME', 'manual'),
              'workflow': os.environ.get('GITHUB_WORKFLOW', 'unknown'),
              'run_id': os.environ.get('GITHUB_RUN_ID', '0'),
              'success': True  # Will be updated by subsequent steps
          }
          
          metrics['history'].append(session)
          
          # Keep last 100 sessions
          metrics['history'] = metrics['history'][-100:]
          
          with open(metrics_file, 'w') as f:
              json.dump(metrics, f, indent=2)
          
          print("has_new_data=true" if len(metrics['history']) > 0 else "has_new_data=false")
          EOF
          echo "has_new_data=true" >> $GITHUB_OUTPUT

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: learning-metrics
          path: ${{ env.LEARNING_DATA_PATH }}

  analyze-patterns:
    needs: collect-metrics
    if: needs.collect-metrics.outputs.has_new_data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download metrics
        uses: actions/download-artifact@v4
        with:
          name: learning-metrics
          path: ${{ env.LEARNING_DATA_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analyze patterns
        run: |
          python << 'EOF'
          import json
          import os
          from pathlib import Path
          from collections import Counter
          
          metrics_file = Path(os.environ['METRICS_FILE'])
          patterns_file = Path(os.environ['PATTERNS_FILE'])
          
          with open(metrics_file) as f:
              metrics = json.load(f)
          
          # Analyze patterns
          patterns = {
              'total_runs': len(metrics['history']),
              'triggers': dict(Counter(s['trigger'] for s in metrics['history'])),
              'workflows': dict(Counter(s['workflow'] for s in metrics['history'])),
              'success_rate': sum(1 for s in metrics['history'] if s.get('success', True)) / max(len(metrics['history']), 1),
              'recommendations': []
          }
          
          # Generate recommendations based on patterns
          if patterns['success_rate'] < 0.9:
              patterns['recommendations'].append('Consider reviewing failing workflows')
          
          if patterns['total_runs'] > 50:
              patterns['recommendations'].append('Good automation coverage - consider expanding to new areas')
          
          with open(patterns_file, 'w') as f:
              json.dump(patterns, f, indent=2)
          
          print("Pattern analysis complete:")
          print(json.dumps(patterns, indent=2))
          EOF

      - name: Commit learning data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Learning Loop)"
          git add ${{ env.LEARNING_DATA_PATH }} || true
          git diff --staged --quiet || git commit -m "chore(learning): Update learning data and patterns"
          git push || echo "No changes to push"

  generate-insights:
    needs: analyze-patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download learning data
        uses: actions/download-artifact@v4
        with:
          name: learning-metrics
          path: ${{ env.LEARNING_DATA_PATH }}

      - name: Generate weekly insights
        if: github.event.schedule == '0 0 * * 0'
        run: |
          echo "## Weekly Learning Loop Insights" > insights.md
          echo "Generated: $(date)" >> insights.md
          echo "" >> insights.md
          
          if [ -f "${{ env.PATTERNS_FILE }}" ]; then
            echo "### Patterns Detected" >> insights.md
            cat "${{ env.PATTERNS_FILE }}" >> insights.md
          fi
          
          echo "" >> insights.md
          echo "### Recommendations" >> insights.md
          echo "- Review IMPLEMENTATION_TRACKER.md for next priorities" >> insights.md
          echo "- Check workflow success rates" >> insights.md

      - name: Create insights issue (weekly)
        if: github.event.schedule == '0 0 * * 0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let insights = '';
            try {
              insights = fs.readFileSync('insights.md', 'utf8');
            } catch (e) {
              insights = 'Weekly learning loop completed. Check workflow logs for details.';
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🧠 Weekly Learning Loop Insights - ${new Date().toISOString().split('T')[0]}`,
              body: insights,
              labels: ['automation', 'insights', 'learning-loop']
            });
