name: Auto-Fix Issues

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install black ruff mypy
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Auto-format Python
        run: |
          black orchestration/ || echo "FORMAT_CHANGED=true" >> $GITHUB_ENV

      - name: Auto-fix lint
        run: |
          ruff check orchestration/ --fix || echo "LINT_CHANGED=true" >> $GITHUB_ENV

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "CHANGES=false" >> $GITHUB_OUTPUT
          else
            echo "CHANGES=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit auto-fixes
        if: steps.check-changes.outputs.CHANGES == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: auto-fix formatting and lint [skip ci]"
          git push

      - name: Comment on PR
        if: steps.check-changes.outputs.CHANGES == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Auto-fix applied**\n\n✅ Formatting and lint issues automatically fixed.\n\n**What was fixed:**\n- Python formatting (Black)\n- Lint issues (Ruff)\n- Import sorting\n\nPull latest changes to continue.'
            })
