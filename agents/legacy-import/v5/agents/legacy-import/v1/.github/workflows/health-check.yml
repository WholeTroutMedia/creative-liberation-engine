name: System Health Check

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: Check System Health
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install tsx
      
      - name: Run health check
        run: npx tsx scripts/health-check.ts
        env:
          BACKEND_URL: https://agentic-studio-creative-liberation-engine-869068567982.europe-west1.run.app
          FRONTEND_URL: https://agentic-studio-creative-liberation-engine.vercel.app
      
      - name: Create health check badge
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "Health check: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "Health check: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
