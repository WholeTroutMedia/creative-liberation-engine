name: RAM CREW - Daily Audit

# Run daily at 6 AM UTC (1 AM EST)
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  daily-audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log analysis
      
      - name: Set up GitHub CLI
        run: |
          # GitHub CLI is pre-installed on ubuntu-latest
          gh --version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Make audit script executable
        run: chmod +x scripts/ram-crew-audit.sh
      
      - name: Run RAM CREW Audit
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_TYPE: Daily
        run: |
          # Run audit and capture output
          scripts/ram-crew-audit.sh | tee audit-output.txt
          
          # Extract key metrics
          HEALTH_STATUS=$(grep "SYSTEM HEALTH:" audit-output.txt | cut -d':' -f2 | xargs || echo "UNKNOWN")
          ISSUES_SCANNED=$(grep "Issues Scanned:" audit-output.txt | awk '{print $3}' || echo "0")
          FLAGS_RAISED=$(grep "Flags Raised:" audit-output.txt | awk '{print $3}' || echo "0")
          
          # Save to GitHub output
          echo "health_status=$HEALTH_STATUS" >> $GITHUB_OUTPUT
          echo "issues_scanned=$ISSUES_SCANNED" >> $GITHUB_OUTPUT
          echo "flags_raised=$FLAGS_RAISED" >> $GITHUB_OUTPUT
      
      - name: Post audit results to Issue #39
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create audit report
          cat > audit-report.md << 'EOF'
          ## 🧹 RAM CREW DAILY AUDIT - $(date '+%Y-%m-%d')
          
          **Type:** Daily Automated Scan  
          **Duration:** ${{ job.duration }} seconds  
          **Timestamp:** $(date '+%Y-%m-%d %H:%M:%S %Z')
          
          ### 📊 Summary
          
          - **System Health:** ${{ steps.audit.outputs.health_status }}
          - **Issues Scanned:** ${{ steps.audit.outputs.issues_scanned }}
          - **Flags Raised:** ${{ steps.audit.outputs.flags_raised }}
          
          ### 🔍 Audit Details
          
          ```
          $(cat audit-output.txt)
          ```
          
          ---
          
          **Next audit:** $(date -u -d '+1 day' '+%Y-%m-%d' 2>/dev/null || date -u -v+1d '+%Y-%m-%d')
          
          *Automated by RAM CREW • [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          EOF
          
          # Post to Issue #39
          gh issue comment 39 --body-file audit-report.md || echo "Issue #39 not found, skipping comment"
      
      - name: Alert on critical issues
        if: steps.audit.outputs.flags_raised > 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create alert comment
          cat > alert.md << 'EOF'
          ## 🚨 RAM CREW ALERT - System Needs Attention
          
          **Flags Raised:** ${{ steps.audit.outputs.flags_raised }}
          **Health Status:** ${{ steps.audit.outputs.health_status }}
          
          The daily audit has detected more than 10 issues that need attention.
          
          Please review the [full audit report above](#issuecomment-latest) and address flagged items.
          
          **Recommended Actions:**
          1. Review stale issues (30+ days old)
          2. Add labels to unlabeled issues
          3. Check deployment health
          4. Clean up stale branches
          
          cc: @jaharoni
          EOF
          
          gh issue comment 39 --body-file alert.md
      
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram-crew-audit-log-${{ github.run_id }}
          path: |
            audit-output.txt
            .ram-crew-audit.log
          retention-days: 30