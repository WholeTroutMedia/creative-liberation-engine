name: SDK Publish

on:
  push:
    tags:
      - 'sdk-python-v*'
      - 'sdk-typescript-v*'
  workflow_dispatch:
    inputs:
      sdk:
        description: 'Which SDK to publish'
        required: true
        type: choice
        options:
          - python
          - typescript
          - both
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: true

jobs:
  publish-python:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-python-v')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.sdk == 'python' || github.event.inputs.sdk == 'both'))
    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        if: github.event.inputs.dry_run != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: sdk/python/dist/

  publish-typescript:
    name: Publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-typescript-v')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.sdk == 'typescript' || github.event.inputs.sdk == 'both'))
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        if: github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typescript-sdk-dist
          path: sdk/typescript/dist/

  sdk-test:
    name: SDK Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - sdk: python
            python-version: '3.11'
          - sdk: python
            python-version: '3.12'
          - sdk: typescript
            node-version: '18'
          - sdk: typescript
            node-version: '20'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test Python SDK
        if: matrix.sdk == 'python'
        working-directory: sdk/python
        run: |
          pip install -e ".[dev]"
          python -m pytest tests/ -v --tb=short

      - name: Set up Node.js
        if: matrix.sdk == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test TypeScript SDK
        if: matrix.sdk == 'typescript'
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run typecheck
          npm test
