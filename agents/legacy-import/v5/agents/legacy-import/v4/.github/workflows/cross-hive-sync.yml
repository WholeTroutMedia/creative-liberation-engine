name: 🔄 Cross-Hive Learning Sync

# Shares learned patterns across agent hives using APOLLO
# Enables knowledge transfer while preserving specialization

on:
  workflow_run:
    workflows: ["🧬 APOLLO Training Pipeline"]
    types: [completed]
  schedule:
    - cron: '0 6 * * *'  # Every day at 6 AM EST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-hive-knowledge:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      
      - name: 📁 Create Required Directories
        run: |
          mkdir -p sync
          mkdir -p reports
          mkdir -p models/apollo
      
      - name: 📥 Load Latest APOLLO Model
        id: load_model
        run: |
          python scripts/automation/load_latest_apollo.py \
            --model-dir models/apollo/ \
            --output latest_model_path.txt
          
          MODEL_PATH=$(cat latest_model_path.txt)
          echo "model_path=$MODEL_PATH" >> $GITHUB_OUTPUT
      
      - name: 🧬 Extract Shared Constitutional Knowledge
        run: |
          python cle_engine/memory/scribe_apollo_integration.py \
            extract-constitutional \
            --model "${{ steps.load_model.outputs.model_path }}" \
            --output sync/constitutional_knowledge.json
      
      - name: 🔄 Sync to All Hives
        id: sync
        run: |
          python scripts/automation/sync_hive_knowledge.py \
            --knowledge sync/constitutional_knowledge.json \
            --hives AURORA,LEX,KEEPER,BROADCAST,SWITCHBOARD,COMPASS \
            --registry CORE_FOUNDATION/agents/.agent-status.json \
            --output sync/sync_results.json
          
          SYNCED=$(python -c "import json; print(len(json.load(open('sync/sync_results.json'))['synced_hives']))")
          echo "synced_hives=$SYNCED" >> $GITHUB_OUTPUT
      
      - name: ✅ Validate Cross-Hive Transfer
        run: |
          python scripts/automation/validate_transfer.py \
            --results sync/sync_results.json \
            --hives all \
            --threshold 0.85 \
            --output sync/validation.json
      
      - name: 📊 Generate Transfer Report
        run: |
          python scripts/automation/generate_transfer_report.py \
            --sync sync/sync_results.json \
            --validation sync/validation.json \
            --output reports/cross_hive_sync_$(date +%Y%m%d).md
      
      - name: 🧪 Test Cross-Hive Predictions
        run: |
          python scripts/automation/test_cross_hive_predictions.py \
            --model "${{ steps.load_model.outputs.model_path }}" \
            --hives all \
            --samples 10 \
            --output sync/prediction_tests.json
      
      - name: 💾 Commit Sync Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Cross-hive learning sync: ${{ steps.sync.outputs.synced_hives }} hives updated"
          file_pattern: 'reports/cross_hive_sync_*.md sync/'
          commit_user_name: 'Cross-Hive Sync'
          commit_user_email: 'sync@cle-engine.ai'
      
      - name: 🔔 Notify Sync Complete
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(`reports/cross_hive_sync_${new Date().toISOString().split('T')[0].replace(/-/g, '')}.md`, 'utf8');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔄 Cross-Hive Sync Complete: ${{ steps.sync.outputs.synced_hives }} Hives`,
              body: report,
              labels: ['apollo', 'cross-hive', 'learning']
            });
