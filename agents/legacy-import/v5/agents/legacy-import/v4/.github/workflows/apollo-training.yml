name: 🧬 APOLLO Training Pipeline

# Trains APOLLO model on accumulated SCRIBE sessions
# Runs DAILY for continuous model improvement

on:
  schedule:
    - cron: '0 2 * * *'  # Every day at 2 AM EST
  workflow_dispatch:
    inputs:
      num_sessions:
        description: 'Number of sessions to train on'
        required: false
        default: '1000'
      epochs:
        description: 'Training epochs'
        required: false
        default: '100'
      learning_rate:
        description: 'Learning rate'
        required: false
        default: '0.0001'

permissions:
  contents: write
  issues: write

env:
  MODEL_VERSION: v1_$(date +%Y%m%d)
  PYTHON_VERSION: '3.11'

jobs:
  prepare-training-data:
    runs-on: ubuntu-latest
    outputs:
      session_count: ${{ steps.extract.outputs.session_count }}
      data_path: ${{ steps.extract.outputs.data_path }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      
      - name: 📁 Create Required Directories
        run: |
          mkdir -p training_data
          mkdir -p models/apollo
          mkdir -p reports
      
      - name: 📋 Extract SCRIBE Sessions
        id: extract
        run: |
          python cle_engine/memory/scribe_apollo_integration.py \
            extract \
            --archive-path cle_engine/memory/scribe_archive/ \
            --limit ${{ github.event.inputs.num_sessions || 1000 }} \
            --output training_data/scribe_sessions.pkl
          
          SESSION_COUNT=$(python -c "import pickle; d=pickle.load(open('training_data/scribe_sessions.pkl','rb')); print(len(d))")
          echo "session_count=$SESSION_COUNT" >> $GITHUB_OUTPUT
          echo "data_path=training_data/scribe_sessions.pkl" >> $GITHUB_OUTPUT
      
      - name: 📏 Analyze Session Distribution
        run: |
          python scripts/automation/analyze_training_data.py \
            --data training_data/scribe_sessions.pkl \
            --output training_data/distribution_report.json
      
      - name: 📊 Generate Data Report
        run: |
          python scripts/automation/generate_data_report.py \
            --distribution training_data/distribution_report.json \
            --output training_data/DATA_REPORT.md
      
      - name: 💾 Upload Training Data
        uses: actions/upload-artifact@v4
        with:
          name: training-data
          path: training_data/
          retention-days: 30

  train-apollo-model:
    needs: prepare-training-data
    runs-on: ubuntu-latest
    if: needs.prepare-training-data.outputs.session_count > 100
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      
      - name: 💾 Download Training Data
        uses: actions/download-artifact@v4
        with:
          name: training-data
          path: training_data/
      
      - name: 📁 Create Model Directory
        run: |
          mkdir -p "models/apollo/$(date +%Y%m%d_%H%M%S)"
      
      - name: 🏋️ Train APOLLO Model
        id: train
        run: |
          MODEL_DIR="models/apollo/$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$MODEL_DIR"
          
          python cle_engine/learning/apollo_trainer.py \
            --data-path training_data/scribe_sessions.pkl \
            --epochs ${{ github.event.inputs.epochs || 100 }} \
            --batch-size 32 \
            --learning-rate ${{ github.event.inputs.learning_rate || 0.0001 }} \
            --save-dir "$MODEL_DIR" \
            --shared-dim 50 \
            --specific-dim 20 \
            --checkpoint-freq 10
          
          echo "model_dir=$MODEL_DIR" >> $GITHUB_OUTPUT
      
      - name: ✅ Validate Constitutional Alignment
        id: validate
        run: |
          python scripts/automation/validate_apollo_model.py \
            --model-path "${{ steps.train.outputs.model_dir }}/best_model.pt" \
            --test-data training_data/scribe_sessions.pkl \
            --target-alignment 0.90 \
            --output validation_results.json
          
          ALIGNMENT=$(python -c "import json; print(json.load(open('validation_results.json'))['constitutional_alignment'])")
          echo "alignment=$ALIGNMENT" >> $GITHUB_OUTPUT
      
      - name: 📈 Generate Training Report
        run: |
          python scripts/automation/generate_training_report.py \
            --model-dir "${{ steps.train.outputs.model_dir }}" \
            --validation validation_results.json \
            --output "${{ steps.train.outputs.model_dir }}/TRAINING_REPORT.md"
      
      - name: 💾 Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apollo-model-$(date +%Y%m%d)
          path: ${{ steps.train.outputs.model_dir }}/
          retention-days: 90
      
      - name: 📝 Log Training to Migration Tracker
        run: |
          python scripts/automation/log_training_event.py \
            --model-dir "${{ steps.train.outputs.model_dir }}" \
            --sessions ${{ needs.prepare-training-data.outputs.session_count }} \
            --alignment ${{ steps.validate.outputs.alignment }} \
            --tracker KEEPER/migration-tracker.json
      
      - name: 💾 Commit Training Logs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🧬 APOLLO training complete: ${{ steps.validate.outputs.alignment }} alignment"
          file_pattern: 'KEEPER/migration-tracker.json models/apollo/**/TRAINING_REPORT.md'
          commit_user_name: 'APOLLO Trainer'
          commit_user_email: 'apollo@cle-engine.ai'
      
      - name: 🔔 Notify Training Complete
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🧬 APOLLO Training Complete: ${process.env.ALIGNMENT}% Alignment`,
              body: `## Training Results\n\n**Sessions Trained**: ${{ needs.prepare-training-data.outputs.session_count }}\n**Constitutional Alignment**: ${{ steps.validate.outputs.alignment }}\n**Model Directory**: \`${{ steps.train.outputs.model_dir }}\`\n\n[View Training Report](${{ steps.train.outputs.model_dir }}/TRAINING_REPORT.md)`,
              labels: ['apollo', 'training', 'ml']
            });
        env:
          ALIGNMENT: ${{ steps.validate.outputs.alignment }}
      
      - name: ⚠️ Alert on Low Alignment
        if: steps.validate.outputs.alignment < 0.90
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ APOLLO Training: Low Constitutional Alignment`,
              body: `## ⚠️ Alignment Below Target\n\n**Current Alignment**: ${{ steps.validate.outputs.alignment }}\n**Target**: 0.90\n\n**Action Required**: VERA review needed\n\n[View Training Report](${{ steps.train.outputs.model_dir }}/TRAINING_REPORT.md)`,
              labels: ['apollo', 'vera-review', 'urgent']
            });
