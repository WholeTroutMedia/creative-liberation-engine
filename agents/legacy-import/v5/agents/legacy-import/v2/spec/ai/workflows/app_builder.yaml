version: "1.0"
name: app_builder
description: "Build complete production application from user prompt"

stages:
  - name: requirements
    agent_type: reasoning
    requires_approval: false
    critical: false
    timeout: 60000

  - name: architecture
    agent_type: architect
    requires_approval: true
    critical: true
    timeout: 120000

  - name: implementation
    agent_type: coder
    requires_approval: false
    critical: false
    timeout: 300000

  - name: review
    agent_type: reviewer
    requires_approval: false
    critical: false
    timeout: 120000

  - name: final_validation
    agent_type: tester
    requires_approval: false
    critical: false
    timeout: 180000
