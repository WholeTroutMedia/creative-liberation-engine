name: 📱 Mobile ChatOps (GitHub Native)

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  pull-requests: write
  
jobs:
  chatops:
    if: startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Command
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.trim();
            const parts = comment.split(/\s+/);
            const command = parts[0].substring(1); // Remove leading '/'
            const args = parts.slice(1);
            
            core.setOutput('command', command);
            core.setOutput('args', args.join(' '));
            core.setOutput('user', context.payload.comment.user.login);

      - name: 📋 Command Router
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const command = '${{ steps.parse.outputs.command }}';
            const args = '${{ steps.parse.outputs.args }}';
            const user = '${{ steps.parse.outputs.user }}';
            
            // Load agent registry
            let agentStatus = {};
            try {
              agentStatus = JSON.parse(fs.readFileSync('agents/.agent-status.json', 'utf8'));
            } catch (e) {
              console.log('No agent registry found, using defaults');
              agentStatus = { agents: {} };
            }
            
            // ═══════════════════════════════════════════════════════════
            // COMMAND HANDLERS
            // ═══════════════════════════════════════════════════════════
            
            const commands = {
              
              // ───────────────────────────────────────────────────────
              // /help - Show all commands
              // ───────────────────────────────────────────────────────
              help: async () => {
                return `## 📱 Mobile ChatOps Commands

### 🤖 Agent Commands
- \`/agent <NAME>\` - Invoke specific agent
  - Example: \`/agent VERA log this decision\`
- \`/hive <NAME>\` - Coordinate entire hive
  - Example: \`/hive AURORA\` (Aurora, BOLT, COMET)

### 📊 System Commands  
- \`/status\` - System health check
- \`/agents\` - List all 27 agents
- \`/deploy\` - Deploy to production (requires approval)

### 🔍 Info Commands
- \`/info <AGENT>\` - Agent details
- \`/help\` - Show this message

### 💡 Available Agents
**LEADERSHIP** (AVERI, ATHENA, VERA, IRIS)  
**DESIGN** (Aurora, LEONARDO, SAGE)  
**ENGINEERING** (BOLT, COMET, ARCH)  
**OPERATIONS** (SWITCHBOARD, RELAY, KEEPER)  
**MEDIA** (ATLAS, COSMOS, MATH, RAM_CREW)  
**GOVERNANCE** (LEX, COMPASS, CODEX, ECHO)

---
_All commands work from the GitHub mobile app!_`;
              },
              
              // ───────────────────────────────────────────────────────
              // /status - System health
              // ───────────────────────────────────────────────────────
              status: async () => {
                const agentCount = Object.keys(agentStatus.agents || {}).length;
                const activeAgents = Object.values(agentStatus.agents || {})
                  .filter(a => a.status === 'active').length;
                
                return `## 🟢 System Status

**Brainchild-v2 Operational**

### 🤖 Agent Registry
- **Total Agents**: ${agentCount}
- **Active**: ${activeAgents}
- **Status**: All systems nominal

### 🏗️ Infrastructure
- **GitHub Actions**: ✅ Running
- **Mobile ChatOps**: ✅ Available
- **SCRIBE Logging**: ✅ Active
- **Agent Registry**: ✅ Loaded

### 📱 Mobile Access
- **Issue Comments**: ✅ Working
- **Slash Commands**: ✅ Enabled
- **Real-time Updates**: ✅ Live

---
_Last checked: ${new Date().toISOString()}_`;
              },
              
              // ───────────────────────────────────────────────────────
              // /agents - List all agents
              // ───────────────────────────────────────────────────────
              agents: async () => {
                if (!agentStatus.agents) {
                  return '⚠️ No agent registry found. Run setup first.';
                }
                
                const hives = {
                  LEADERSHIP: ['AVERI', 'ATHENA', 'VERA', 'IRIS'],
                  DESIGN: ['Aurora', 'LEONARDO', 'SAGE'],
                  ENGINEERING: ['BOLT', 'COMET', 'ARCH'],
                  OPERATIONS: ['SWITCHBOARD', 'RELAY', 'KEEPER'],
                  MEDIA: ['ATLAS', 'COSMOS', 'MATH', 'RAM_CREW'],
                  GOVERNANCE: ['LEX', 'COMPASS', 'CODEX', 'ECHO']
                };
                
                let response = '## 🤖 Agent Directory\n\n';
                
                for (const [hive, members] of Object.entries(hives)) {
                  response += `### ${hive}\n`;
                  for (const name of members) {
                    const agent = agentStatus.agents[name];
                    if (agent) {
                      const statusIcon = agent.status === 'active' ? '🟢' : '⚪';
                      response += `- ${statusIcon} **${name}** ${agent.symbol || '🤖'}\n`;
                      response += `  - ${agent.role || agent.purpose || 'Agent'}\n`;
                    }
                  }
                  response += '\n';
                }
                
                response += '---\n';
                response += '_Use `/agent <NAME>` to invoke specific agents_';
                
                return response;
              },
              
              // ───────────────────────────────────────────────────────
              // /agent - Invoke specific agent
              // ───────────────────────────────────────────────────────
              agent: async () => {
                if (!args) {
                  return '❌ Usage: `/agent <NAME> [message]`\n\nExample: `/agent VERA log this decision`';
                }
                
                const agentName = args.split(' ')[0].toUpperCase();
                const message = args.split(' ').slice(1).join(' ');
                
                const agent = agentStatus.agents?.[agentName];
                
                if (!agent) {
                  return `❌ Agent **${agentName}** not found. Use \`/agents\` to see all available agents.`;
                }
                
                // Build agent response with personality
                const personalities = {
                  VERA: {
                    greeting: "⚪ **VERA** here. I'm logging this to SCRIBE.",
                    tone: "Precise, factual, excellent memory."
                  },
                  IRIS: {
                    greeting: "🟣 **IRIS** on it! Removing blockers fast.",
                    tone: "Quick, decisive, action-oriented."
                  },
                  ATHENA: {
                    greeting: "🟡 **ATHENA** responding. Strategic analysis:",
                    tone: "Wise, long-term thinking, protective."
                  },
                  Aurora: {
                    greeting: "🎨 **Aurora** here! Let's make it beautiful.",
                    tone: "Creative, design-focused, aesthetic."
                  },
                  COMET: {
                    greeting: "⚡ **COMET** deploying. Backend check:",
                    tone: "Technical, pragmatic, loves clean code."
                  },
                  LEX: {
                    greeting: "⚖️ **LEX** reviewing. Constitutional check:",
                    tone: "Legal-minded, principled, compliance-focused."
                  },
                  SWITCHBOARD: {
                    greeting: "📞 **SWITCHBOARD** coordinating agents.",
                    tone: "Organized, routing expert, operations-focused."
                  }
                };
                
                const personality = personalities[agentName] || {
                  greeting: `${agent.symbol || '🤖'} **${agentName}** responding.`,
                  tone: agent.role || 'AI agent'
                };
                
                let response = `## ${personality.greeting}\n\n`;
                
                if (message) {
                  response += `**Your request:** ${message}\n\n`;
                  response += `**My analysis:**\n`;
                  response += `I'm ${agent.name}, specialized in ${agent.role || agent.purpose}.\n\n`;
                  
                  // Add relevant capabilities
                  if (agent.capabilities && agent.capabilities.length > 0) {
                    response += `**I can help with:**\n`;
                    agent.capabilities.slice(0, 3).forEach(cap => {
                      response += `- ${cap}\n`;
                    });
                    response += '\n';
                  }
                  
                  response += `_${personality.tone}_\n`;
                } else {
                  response += `I'm ${agent.name}, ready to assist.\n\n`;
                  response += `**Role:** ${agent.role || agent.purpose}\n`;
                  response += `**Status:** ${agent.status}\n\n`;
                  response += `Use \`/agent ${agentName} <your message>\` to give me instructions.`;
                }
                
                // VERA auto-logs
                if (agentName === 'VERA' && message) {
                  const logDir = 'SCRIBE/session-logs';
                  if (!fs.existsSync(logDir)) {
                    fs.mkdirSync(logDir, { recursive: true });
                  }
                  
                  const logEntry = {
                    timestamp: new Date().toISOString(),
                    agent: 'VERA',
                    user: user,
                    message: message,
                    issue: context.payload.issue.number
                  };
                  
                  const logFile = `${logDir}/${new Date().toISOString().split('T')[0]}.jsonl`;
                  fs.appendFileSync(logFile, JSON.stringify(logEntry) + '\n');
                  
                  response += '\n\n📝 _Logged to SCRIBE institutional memory._';
                }
                
                return response;
              },
              
              // ───────────────────────────────────────────────────────
              // /hive - Coordinate entire hive
              // ───────────────────────────────────────────────────────
              hive: async () => {
                if (!args) {
                  return '❌ Usage: `/hive <HIVE_NAME>`\n\nAvailable hives:\n- AURORA (Design)\n- COMET (Engineering)\n- ATLAS (Media)\n- SWITCHBOARD (Operations)';
                }
                
                const hiveName = args.toUpperCase();
                
                const hiveMap = {
                  AURORA: ['Aurora', 'LEONARDO', 'SAGE'],
                  COMET: ['BOLT', 'COMET', 'ARCH'],
                  ATLAS: ['ATLAS', 'COSMOS', 'RAM_CREW'],
                  SWITCHBOARD: ['SWITCHBOARD', 'RELAY', 'KEEPER']
                };
                
                const hive = hiveMap[hiveName];
                
                if (!hive) {
                  return `❌ Hive **${hiveName}** not found. Available hives: ${Object.keys(hiveMap).join(', ')}`;
                }
                
                let response = `## 🏢 Coordinating ${hiveName} Hive\n\n`;
                response += `**Assembling team:**\n`;
                
                hive.forEach(agentName => {
                  const agent = agentStatus.agents?.[agentName];
                  if (agent) {
                    response += `- ${agent.symbol || '🤖'} **${agentName}** (${agent.status})\n`;
                  }
                });
                
                response += `\n**Coordination status:** All agents notified and standing by.\n\n`;
                response += `_Use individual agent commands for specific instructions._`;
                
                return response;
              },
              
              // ───────────────────────────────────────────────────────
              // /info - Agent information
              // ───────────────────────────────────────────────────────
              info: async () => {
                if (!args) {
                  return '❌ Usage: `/info <AGENT_NAME>`\n\nExample: `/info VERA`';
                }
                
                const agentName = args.toUpperCase();
                const agent = agentStatus.agents?.[agentName];
                
                if (!agent) {
                  return `❌ Agent **${agentName}** not found.`;
                }
                
                let response = `## ${agent.symbol || '🤖'} ${agent.name}\n\n`;
                response += `**Status:** ${agent.status}\n`;
                response += `**Role:** ${agent.role || agent.purpose}\n\n`;
                
                if (agent.capabilities && agent.capabilities.length > 0) {
                  response += `**Capabilities:**\n`;
                  agent.capabilities.forEach(cap => {
                    response += `- ${cap}\n`;
                  });
                  response += '\n';
                }
                
                if (agent.authority && agent.authority.length > 0) {
                  response += `**Authority:**\n`;
                  agent.authority.forEach(auth => {
                    response += `- ${auth}\n`;
                  });
                }
                
                return response;
              },
              
              // ───────────────────────────────────────────────────────
              // /deploy - Deploy to production
              // ───────────────────────────────────────────────────────
              deploy: async () => {
                return `## 🚀 Deploy Request

**Deployment initiated by:** @${user}

**Pre-flight checks:**
- ✅ User authorized
- ⏳ Running tests...
- ⏳ Building artifacts...
- ⏳ Preparing production...

**Next steps:**
1. Automated tests will run
2. Build process will execute
3. Deployment will proceed if all checks pass

_Watch this issue for real-time updates._`;
              }
            };
            
            // ═══════════════════════════════════════════════════════════
            // EXECUTE COMMAND
            // ═══════════════════════════════════════════════════════════
            
            const handler = commands[command];
            
            let responseBody;
            if (handler) {
              try {
                responseBody = await handler();
              } catch (error) {
                responseBody = `❌ **Error executing command:** ${error.message}`;
              }
            } else {
              responseBody = `❌ **Unknown command:** \`/${command}\`\n\nUse \`/help\` to see available commands.`;
            }
            
            // Post response
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: responseBody
            });
