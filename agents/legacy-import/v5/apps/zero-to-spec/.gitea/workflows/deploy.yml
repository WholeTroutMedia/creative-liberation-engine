name: Build & Deploy — Zero-to-Spec HUD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-zero-to-spec
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Verify artifact
        run: |
          echo "✅ Zero-to-Spec HUD build complete"
          du -sh dist/
          ls dist/

      - name: Dispatch NAS Genesis deploy
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.NAS_GITEA_TOKEN }}" \
            -H "Content-Type: application/json" \
            "http://127.0.0.1:3000/api/v1/repos/WholeTroutMedia/creative-liberation-engine-v5/actions/workflows/deploy-genesis.yml/dispatches" \
            -d '{"ref":"main"}' && echo "✅ NAS deploy-genesis.yml triggered" || echo "⚠️ NAS dispatch unavailable — LAN connectivity issue"
