name: RAP Audit - Creative Authenticity Check

on:
  pull_request:
    paths:
      - 'design-system/**'
      - 'design-library/**'
      - '**/*.{png,jpg,jpeg,svg,gif}'
      - '**/*.{css,scss}'
  push:
    branches:
      - main
    paths:
      - 'design-system/**'
      - 'design-library/**'

jobs:
  rap-audit:
    name: Article XIX Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run RAP Audit
        id: rap_audit
        run: |
          npm run rap:audit
        continue-on-error: true

      - name: Check RAP Score
        run: |
          SCORE=$(cat .rap-audit-results.json | jq -r '.overall_score')
          echo "RAP Audit Score: $SCORE/10"
          
          if (( $(echo "$SCORE < 7.0" | bc -l) )); then
            echo "❌ RAP Audit FAILED: Score $SCORE is below minimum 7.0"
            echo "Article XIX, Section 8 requires minimum 7/10 for deployment"
            exit 1
          else
            echo "✅ RAP Audit PASSED: Score $SCORE meets Article XIX standards"
          fi

      - name: Comment PR with RAP Score
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.rap-audit-results.json', 'utf8'));
            
            const body = `## 🎨 Article XIX RAP Audit Results\n\n` +
              `**Overall Score:** ${results.overall_score}/10\n\n` +
              `### The Three Audits\n` +
              `- **Visible Labor:** ${results.visible_labor.score}/10 ${results.visible_labor.score >= 7 ? '✅' : '❌'}\n` +
              `- **Historical Friction:** ${results.historical_friction.score}/10 ${results.historical_friction.score >= 7 ? '✅' : '❌'}\n` +
              `- **Contextual Dissonance:** ${results.contextual_dissonance.score}/10 ${results.contextual_dissonance.score >= 7 ? '✅' : '❌'}\n\n` +
              `${results.overall_score >= 7 ? '✅ **APPROVED** - Meets Article XIX standards' : '❌ **BLOCKED** - Below minimum 7/10 threshold'}\n\n` +
              `---\n*Enforced by Article XIX, Section 8*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });