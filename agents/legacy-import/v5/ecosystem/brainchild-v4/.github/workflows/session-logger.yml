name: "\U0001F4DD Session Auto-Logger"

# Captures session data automatically on every commit
# Integrates with KEEPER migration tracker for continuous learning

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'KEEPER/migration-tracker.json'
      - 'SESSION_LOGS/**'
      - 'docs/CONSTITUTIONAL_DASHBOARD.md'
      - 'reports/**'
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  log-session:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
      
      - name: "\U0001F40D Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: "\U0001F4E6 Install Dependencies"
        run: |
          pip install -r requirements.txt
      
      - name: "\U0001F4C1 Create Required Directories"
        run: |
          mkdir -p SESSION_LOGS
      
      - name: "\U0001F50D Extract Session Data"
        id: extract
        run: |
          python scripts/automation/auto_session_logger.py \
            --commit-sha "${{ github.sha }}" \
            --author "${{ github.actor }}" \
            --event-type "${{ github.event_name }}" \
            --repo "${{ github.repository }}" \
            --output session_data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: "\U0001F4CA Analyze Changes"
        id: analyze
        if: steps.extract.outcome == 'success'
        run: |
          python scripts/automation/analyze_session_changes.py \
            --session-data session_data.json \
            --output analysis.json
        continue-on-error: true
      
      - name: "\U0001F4DD Update Migration Tracker"
        id: update_tracker
        if: steps.analyze.outcome == 'success'
        run: |
          python scripts/automation/update_migration_tracker.py \
            --session-data session_data.json \
            --analysis analysis.json \
            --tracker KEEPER/migration-tracker.json \
            --output updated_tracker.json
        continue-on-error: true
      
      - name: "\U0001F9E0 Extract Lessons Learned"
        if: steps.analyze.outcome == 'success'
        run: |
          python scripts/automation/extract_auto_lessons.py \
            --session-data session_data.json \
            --analysis analysis.json \
            --tracker KEEPER/migration-tracker.json
        continue-on-error: true
      
      - name: "\U0001F4BE Commit Tracker Updates"
        if: steps.update_tracker.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "\U0001F916 Auto-log session: ${{ github.event.head_commit.message || 'PR merged' }}"
          file_pattern: 'KEEPER/migration-tracker.json SESSION_LOGS/*.md'
          commit_user_name: 'KEEPER Bot'
          commit_user_email: 'keeper@cle-engine.ai'
          commit_author: 'KEEPER <keeper@cle-engine.ai>'
      
      - name: "\U0001F4C8 Generate Session Summary"
        if: success()
        run: |
          python scripts/automation/generate_session_summary.py \
            --tracker KEEPER/migration-tracker.json \
            --output SESSION_LOGS/summary_$(date +%Y%m%d_%H%M%S).md
        continue-on-error: true
      
      - name: "\U0001F514 Notify on Significant Learning"
        if: steps.analyze.outputs.significant_learning == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('./analysis.json')) {
              const analysis = require('./analysis.json');
              
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Significant Learning Detected: ${analysis.key_insight || 'New pattern'}`,
                body: `## Session Learning Summary\n\n${analysis.summary || 'Analysis complete'}\n\n**Lessons Learned**: ${(analysis.lessons || []).length}\n**Patterns Identified**: ${(analysis.patterns || []).length}`,
                labels: ['learning', 'keeper', 'auto-detected']
              });
            }
