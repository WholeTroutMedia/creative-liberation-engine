name: Sync NBC NEXUS Content from Brainchild

on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Sync mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - incremental

jobs:
  sync-nexus-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nbc-nexus (target)
        uses: actions/checkout@v4
        with:
          path: nbc-nexus
          token: ${{ secrets.PAT_TOKEN }}

      - name: Clone agentic-studio-creative-liberation-engine (source)
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/WholeTroutMedia/agentic-studio-creative-liberation-engine.git source

      - name: Sync ALL NBC NEXUS folders
        run: |
          # Create organized structure in nbc-nexus
          mkdir -p nbc-nexus/apps/nbc-nexus
          mkdir -p nbc-nexus/packages/nexus-chat
          mkdir -p nbc-nexus/packages/nexus-console
          mkdir -p nbc-nexus/packages/nexus-core
          mkdir -p nbc-nexus/packages/nexus-media
          mkdir -p nbc-nexus/packages/nexus-metrics
          mkdir -p nbc-nexus/packages/nexus-offline
          mkdir -p nbc-nexus/packages/nexus-webstore
          mkdir -p nbc-nexus/packages/nexus-workstation
          mkdir -p nbc-nexus/backend
          mkdir -p nbc-nexus/frontend
          mkdir -p nbc-nexus/command-center
          mkdir -p nbc-nexus/docs
          
          # Copy apps/nbc-nexus
          if [ -d "source/apps/nbc-nexus" ]; then
            cp -r source/apps/nbc-nexus/* nbc-nexus/apps/nbc-nexus/ 2>/dev/null || true
          fi
          
          # Copy nexus packages
          for pkg in nexus-chat nexus-console nexus-core nexus-media nexus-metrics nexus-offline nexus-webstore nexus-workstation; do
            if [ -d "source/$pkg" ]; then
              cp -r source/$pkg/* nbc-nexus/packages/$pkg/ 2>/dev/null || true
            fi
          done
          
          # Copy backend (has NBC NEXUS routes)
          if [ -d "source/backend" ]; then
            cp -r source/backend/* nbc-nexus/backend/ 2>/dev/null || true
          fi
          
          # Copy frontend (has NBC NEXUS page route)
          if [ -d "source/frontend" ]; then
            cp -r source/frontend/* nbc-nexus/frontend/ 2>/dev/null || true
          fi
          
          # Copy command-center (has NEXUS Canvas View)
          if [ -d "source/command-center" ]; then
            cp -r source/command-center/* nbc-nexus/command-center/ 2>/dev/null || true
          fi
          
          # Copy relevant docs
          if [ -d "source/docs" ]; then
            mkdir -p nbc-nexus/docs
            find source/docs -iname "*nexus*" -exec cp {} nbc-nexus/docs/ \; 2>/dev/null || true
          fi
          
          echo "NBC NEXUS content synced successfully!"

      - name: Create comprehensive README
        run: |
          cat > nbc-nexus/README.md << 'EOF'
          # 📺 NBC NEXUS

          ## AI-Powered Broadcast Operations & Content Creation Platform

          > Liberating broadcast professionals from manual workflows through intelligent automation and generative UI.

          ![Status](https://img.shields.io/badge/status-active_development-green)
          ![Team](https://img.shields.io/badge/team-BROADCAST_HIVE-blue)
          ![Client](https://img.shields.io/badge/client-NBC_Sports-red)

          ---

          ## 🎯 What is NBC NEXUS?

          NBC NEXUS is a revolutionary broadcast platform that combines:

          1. **Operations Intelligence** - AI-powered show sheet generation and crew coordination
          2. **Content Creation Engine** - Automated video generation and graphics overlays
          3. **Generative UI** - Interfaces that adapt to each user's role and context

          **Built for:** NBC Sports Bay Area (Devon Fox - anchor customer)  
          **Led by:** ATLAS & BROADCAST HIVE  
          **Mission:** Liberate broadcast professionals to focus on storytelling, not busy work

          ---

          ## 📁 Repository Structure

          ```
          nbc-nexus/
          ├── apps/
          │   └── nbc-nexus/          # Main NBC NEXUS application
          ├── packages/
          │   ├── nexus-chat/         # Real-time communication
          │   ├── nexus-console/      # Admin console
          │   ├── nexus-core/         # Core platform logic
          │   ├── nexus-media/        # Media processing
          │   ├── nexus-metrics/      # Analytics & reporting
          │   ├── nexus-offline/      # Offline capabilities
          │   ├── nexus-webstore/     # Digital asset store
          │   └── nexus-workstation/  # Production workstation
          ├── backend/                # API & server
          ├── frontend/               # Web interface
          ├── command-center/         # Operations hub
          └── docs/                   # Documentation
          ```

          ---

          ## 🚀 Quick Start

          ```bash
          # Install dependencies
          npm install

          # Start development server
          npm run dev

          # Build for production
          npm run build
          ```

          ---

          ## 🔗 Related

          - **Parent System:** [agentic-studio-creative-liberation-engine](https://github.com/WholeTroutMedia/agentic-studio-creative-liberation-engine)
          - **Deployment:** Production on Vercel

          ---

          *Part of the Creative Liberation Engine ecosystem by WholeTroutMedia*
          EOF

      - name: Commit and push changes
        run: |
          cd nbc-nexus
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "🔄 Sync NBC NEXUS content from creative-liberation-engine - $(date '+%Y-%m-%d %H:%M')"
          git push
