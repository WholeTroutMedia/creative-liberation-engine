name: Mirror to GitHub

# Runs after every push to main — mirrors this repo to GitHub automatically
on:
  push:
    branches: [main]

# Only keep the latest mirror run — cancel stale queued runs
concurrency:
  group: github-mirror
  cancel-in-progress: true

jobs:
  mirror:
    name: Push to GitHub
    # Must run on the NAS self-hosted runner — ubuntu-latest is not available
    runs-on: self-hosted

    steps:
      - name: Checkout full history (mirror clone from Gitea)
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          # GITEA_TOKEN is a Gitea personal access token (not github.token)
          # Create one at: http://127.0.0.1:3000/user/settings/applications
          # Store as GITEA_TOKEN in repo secrets
          git clone --mirror "http://oauth2:${GITEA_TOKEN}@127.0.0.1:3000/WholeTroutMedia/creative-liberation-engine-v5.git" . 2>&1
          echo "✓ Mirror cloned — HEAD: $(git log -1 --oneline HEAD 2>/dev/null || echo 'bare repo')"

      - name: Push to GitHub
        env:
          GITHUB_MIRROR_TOKEN: ${{ secrets.GITHUB_MIRROR_TOKEN }}
        run: |
          git push --mirror "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/WholeTroutMedia/creative-liberation-engine-v5.git" 2>&1
          echo "✓ Mirrored to GitHub"
