name: Redeploy Dispatch Only
on:
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Build and Restart Dispatch
        env:
          DOCKER_API_VERSION: "1.43"
          DOCKER_HOST: "unix:///var/run/docker.sock"
        run: |
          docker compose -p creative-liberation-engine-v5 -f docker-compose.genesis.yml up -d --build dispatch
          echo "✅ Dispatch service redeployed"
          docker ps --filter "name=dispatch" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
