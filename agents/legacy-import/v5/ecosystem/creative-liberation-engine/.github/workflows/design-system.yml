name: Design System Gates

on:
  pull_request:
    paths:
      - "packages/design-tokens/**"
      - "packages/ui/**"
      - "packages/theme-engine/**"
      - "packages/design-agent/**"
      - "packages/design-sandbox/**"
      - "packages/gen-ui/**"

jobs:
  # ─── DS-106: Token Validation Gate ────────────────────────────────────────
  token-validate:
    name: Token Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate design tokens
        run: pnpm --filter @cle/design-tokens validate
        # Exits non-zero if: spacing not on 4px grid, >9 type sizes, >4 shadows,
        # semantic tokens have raw values, component tokens reference primitives directly

  # ─── DS-407: Design Quality Gate ──────────────────────────────────────────
  design-quality:
    name: Design Quality Gate (VERA-DESIGN)
    runs-on: ubuntu-latest
    needs: token-validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build design-agent
        run: pnpm --filter @cle/design-agent build
      - name: Run VERA-DESIGN compliance scan
        run: |
          node -e "
          import('@cle/design-agent').then(({ scanDirectory, formatReport }) => {
            const results = scanDirectory('./packages/ui/src');
            const totalViolations = results.reduce((n, r) => n + r.violations.length, 0);
            const avgScore = results.reduce((n, r) => n + r.score, 0) / results.length;
            console.log('Scanned:', results.length, 'files');
            console.log('Avg compliance score:', avgScore.toFixed(1));
            console.log('Total violations:', totalViolations);
            if (avgScore < 70) {
              console.error('❌ Design quality gate failed — avg score', avgScore.toFixed(1), '< 70');
              process.exit(1);
            }
            console.log('✅ Design quality gate passed');
          });
          "
        env:
          QUALITY_THRESHOLD: "70"

  # ─── Build verification ────────────────────────────────────────────────────
  build-packages:
    name: Build All Design System Packages
    runs-on: ubuntu-latest
    needs: token-validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build design-tokens
        run: pnpm --filter @cle/design-tokens build
      - name: Build theme-engine
        run: pnpm --filter @cle/theme-engine build
      - name: Build design-agent
        run: pnpm --filter @cle/design-agent build
      - name: Build ui
        run: pnpm --filter @cle/ui build

  # ─── TypeScript type check ─────────────────────────────────────────────────
  typecheck:
    name: TypeScript Strict Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check design-agent
        run: pnpm --filter @cle/design-agent exec tsc --noEmit
      - name: Type check theme-engine
        run: pnpm --filter @cle/theme-engine exec tsc --noEmit
      - name: Type check ui
        run: pnpm --filter @cle/ui exec tsc --noEmit
