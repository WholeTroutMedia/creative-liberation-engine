name: GHOST QA
# Runs on every push and PR — PROOF validates before anything ships

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  GHOST_REPORT_PATH: ./ghost-reports

jobs:
  ghost-qa:
    name: GHOST — Autonomous QA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @cle/ghost exec playwright install chromium

      - name: Build GHOST
        run: pnpm --filter @cle/ghost build

      - name: Start app under test
        run: |
          # Start the app in background for testing
          pnpm dev &
          echo "APP_PID=$!" >> $GITHUB_ENV
          sleep 10  # Wait for app to be ready
        env:
          PORT: 3000
        continue-on-error: true

      - name: Run GHOST — Full QA Suite
        run: |
          mkdir -p ${{ env.GHOST_REPORT_PATH }}
          node packages/ghost/dist/cli.js run \
            --target-url http://localhost:3000 \
            --journeys all \
            --report-path ${{ env.GHOST_REPORT_PATH }} \
            --fail-on blocking,critical
        env:
          GHOST_HEADLESS: true
          GHOST_SCREENSHOT_DIR: ${{ env.GHOST_REPORT_PATH }}/screenshots

      - name: Run GHOST — Accessibility Audit
        run: |
          node packages/ghost/dist/cli.js accessibility \
            --target-url http://localhost:3000 \
            --wcag-level AA \
            --report-path ${{ env.GHOST_REPORT_PATH }}/accessibility.md
        continue-on-error: true # Warn but don't block on accessibility

      - name: Run GHOST — Security Scan (SENTINEL)
        run: |
          node packages/ghost/dist/cli.js security \
            --target-url http://localhost:3000 \
            --scenarios xss,csrf,open-redirect \
            --report-path ${{ env.GHOST_REPORT_PATH }}/security.md
        continue-on-error: false # Security blocks release

      - name: Upload QA Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-qa-reports-${{ github.sha }}
          path: ${{ env.GHOST_REPORT_PATH }}
          retention-days: 30

      - name: Annotate PR with GHOST Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '${{ env.GHOST_REPORT_PATH }}/ghost-summary.md';

            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf-8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 👻 GHOST QA Report\n\n${report}`
              });
            }

      - name: Stop app
        if: always()
        run: |
          kill $APP_PID 2>/dev/null || true
