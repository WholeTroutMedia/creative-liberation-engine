name: Ship Complete - 100% Production Ready

on:
  workflow_dispatch:

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================
      # HELIX A: STATE MANAGEMENT
      # ============================================
      - name: Create Zustand Store
        run: |
          cat > src/lib/store.ts << 'EOF'
          import { create } from "zustand";

          export interface Scene {
            id: string;
            type: "text" | "image" | "video" | "transition";
            content: string;
            startFrame: number;
            durationFrames: number;
            style?: Record<string, any>;
            src?: string;
          }

          export interface VideoProject {
            id: string;
            title: string;
            scenes: Scene[];
            duration: number;
            fps: number;
            width: number;
            height: number;
            template: string;
          }

          interface StudioState {
            project: VideoProject | null;
            isGenerating: boolean;
            isRendering: boolean;
            renderProgress: number;
            error: string | null;
            setProject: (project: VideoProject) => void;
            updateScene: (id: string, updates: Partial<Scene>) => void;
            addScene: (scene: Scene) => void;
            removeScene: (id: string) => void;
            reorderScenes: (fromIndex: number, toIndex: number) => void;
            setGenerating: (val: boolean) => void;
            setRendering: (val: boolean) => void;
            setRenderProgress: (val: number) => void;
            setError: (error: string | null) => void;
            reset: () => void;
          }

          export const useStudioStore = create<StudioState>((set) => ({
            project: null,
            isGenerating: false,
            isRendering: false,
            renderProgress: 0,
            error: null,
            setProject: (project) => set({ project, error: null }),
            updateScene: (id, updates) =>
              set((state) => ({
                project: state.project
                  ? {
                      ...state.project,
                      scenes: state.project.scenes.map((s) =>
                        s.id === id ? { ...s, ...updates } : s
                      ),
                    }
                  : null,
              })),
            addScene: (scene) =>
              set((state) => ({
                project: state.project
                  ? { ...state.project, scenes: [...state.project.scenes, scene] }
                  : null,
              })),
            removeScene: (id) =>
              set((state) => ({
                project: state.project
                  ? {
                      ...state.project,
                      scenes: state.project.scenes.filter((s) => s.id !== id),
                    }
                  : null,
              })),
            reorderScenes: (fromIndex, toIndex) =>
              set((state) => {
                if (!state.project) return state;
                const scenes = [...state.project.scenes];
                const [removed] = scenes.splice(fromIndex, 1);
                scenes.splice(toIndex, 0, removed);
                return { project: { ...state.project, scenes } };
              }),
            setGenerating: (isGenerating) => set({ isGenerating }),
            setRendering: (isRendering) => set({ isRendering }),
            setRenderProgress: (renderProgress) => set({ renderProgress }),
            setError: (error) => set({ error }),
            reset: () =>
              set({
                project: null,
                isGenerating: false,
                isRendering: false,
                renderProgress: 0,
                error: null,
              }),
          }));
          EOF

      # ============================================
      # HELIX B: UI COMPONENTS
      # ============================================
      - name: Create UI Components
        run: |
          mkdir -p src/components/ui
          
          cat > src/components/ui/button.tsx << 'EOF'
          import { cn } from "@/lib/utils";
          import { forwardRef } from "react";

          interface ButtonProps extends React.ButtonHTMLAttributes<HTMLButtonElement> {
            variant?: "default" | "outline" | "ghost" | "destructive";
            size?: "default" | "sm" | "lg" | "icon";
          }

          export const Button = forwardRef<HTMLButtonElement, ButtonProps>(
            ({ className, variant = "default", size = "default", ...props }, ref) => {
              return (
                <button
                  ref={ref}
                  className={cn(
                    "inline-flex items-center justify-center rounded-lg font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none",
                    {
                      "bg-blue-600 text-white hover:bg-blue-700": variant === "default",
                      "border border-gray-700 hover:bg-gray-800": variant === "outline",
                      "hover:bg-gray-800": variant === "ghost",
                      "bg-red-600 text-white hover:bg-red-700": variant === "destructive",
                      "h-10 px-4 py-2": size === "default",
                      "h-8 px-3 text-sm": size === "sm",
                      "h-12 px-6 text-lg": size === "lg",
                      "h-10 w-10": size === "icon",
                    },
                    className
                  )}
                  {...props}
                />
              );
            }
          );
          Button.displayName = "Button";
          EOF

          cat > src/components/ui/progress.tsx << 'EOF'
          import { cn } from "@/lib/utils";

          interface ProgressProps {
            value: number;
            className?: string;
          }

          export function Progress({ value, className }: ProgressProps) {
            return (
              <div className={cn("w-full bg-gray-800 rounded-full h-2", className)}>
                <div
                  className="bg-blue-600 h-2 rounded-full transition-all duration-300"
                  style={{ width: `${Math.min(100, Math.max(0, value))}%` }}
                />
              </div>
            );
          }
          EOF

          cat > src/components/ui/card.tsx << 'EOF'
          import { cn } from "@/lib/utils";

          export function Card({ className, ...props }: React.HTMLAttributes<HTMLDivElement>) {
            return (
              <div
                className={cn("rounded-xl border border-gray-800 bg-gray-900 p-4", className)}
                {...props}
              />
            );
          }
          EOF

          cat > src/components/ui/index.ts << 'EOF'
          export { Button } from "./button";
          export { Progress } from "./progress";
          export { Card } from "./card";
          EOF

      - name: Create Utils
        run: |
          mkdir -p src/lib/utils
          cat > src/lib/utils/index.ts << 'EOF'
          import { clsx, type ClassValue } from "clsx";
          import { twMerge } from "tailwind-merge";

          export function cn(...inputs: ClassValue[]) {
            return twMerge(clsx(inputs));
          }

          export function generateId(): string {
            return Math.random().toString(36).substring(2, 9);
          }

          export function formatDuration(frames: number, fps: number): string {
            const seconds = frames / fps;
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, "0")}`;
          }
          EOF

      # ============================================
      # HELIX A: COMPLETE API ROUTES
      # ============================================
      - name: Create Render API
        run: |
          mkdir -p src/app/api/render
          cat > src/app/api/render/route.ts << 'EOF'
          import { NextRequest, NextResponse } from "next/server";
          import { bundle } from "@remotion/bundler";
          import { renderMedia, selectComposition } from "@remotion/renderer";
          import path from "path";
          import fs from "fs";

          export async function POST(req: NextRequest) {
            try {
              const { project } = await req.json();
              const outputPath = path.join(process.cwd(), "public", "renders", `${project.id}.mp4`);

              // Ensure output directory exists
              fs.mkdirSync(path.dirname(outputPath), { recursive: true });

              // Bundle the Remotion project
              const bundleLocation = await bundle({
                entryPoint: path.join(process.cwd(), "src/remotion/index.ts"),
                webpackOverride: (config) => config,
              });

              // Select composition
              const composition = await selectComposition({
                serveUrl: bundleLocation,
                id: "MainVideo",
                inputProps: project,
              });

              // Render the video
              await renderMedia({
                composition,
                serveUrl: bundleLocation,
                codec: "h264",
                outputLocation: outputPath,
                inputProps: project,
                onProgress: ({ progress }) => {
                  console.log(`Rendering: ${Math.round(progress * 100)}%`);
                },
              });

              return NextResponse.json({
                success: true,
                url: `/renders/${project.id}.mp4`,
              });
            } catch (error) {
              console.error("Render error:", error);
              return NextResponse.json(
                { error: "Render failed", details: String(error) },
                { status: 500 }
              );
            }
          }
          EOF

      - name: Create Ideas API
        run: |
          mkdir -p src/app/api/ideas
          cat > src/app/api/ideas/route.ts << 'EOF'
          import { NextRequest, NextResponse } from "next/server";
          import { generateVideoIdeas } from "@/lib/ai/gemini";

          export async function POST(req: NextRequest) {
            try {
              const { topic } = await req.json();
              const ideas = await generateVideoIdeas(topic);
              return NextResponse.json({ ideas });
            } catch (error) {
              return NextResponse.json(
                { error: "Failed to generate ideas" },
                { status: 500 }
              );
            }
          }
          EOF

      - name: Update Generate API with full implementation
        run: |
          cat > src/app/api/generate/route.ts << 'EOF'
          import { NextRequest, NextResponse } from "next/server";
          import { generateVideoScript, generateRemotionCode } from "@/lib/ai/claude";
          import { generateId } from "@/lib/utils";

          export async function POST(req: NextRequest) {
            try {
              const { prompt, duration = 10, style = "modern", template = "default" } = await req.json();

              if (!prompt) {
                return NextResponse.json({ error: "Prompt is required" }, { status: 400 });
              }

              const script = await generateVideoScript(prompt, { duration, style });

              // Ensure all scenes have IDs
              const scenes = script.scenes.map((scene: any, index: number) => ({
                ...scene,
                id: scene.id || generateId(),
                startFrame: scene.startFrame || index * 90,
                durationFrames: scene.durationFrames || 90,
              }));

              const project = {
                id: generateId(),
                title: script.title,
                scenes,
                duration: script.duration,
                fps: script.fps || 30,
                width: script.width || 1920,
                height: script.height || 1080,
                template,
              };

              return NextResponse.json(project);
            } catch (error) {
              console.error("Generation error:", error);
              return NextResponse.json(
                { error: "Failed to generate video", details: String(error) },
                { status: 500 }
              );
            }
          }
          EOF

      # ==========================================
      # COMMIT AND PUSH CHANGES
      # ==========================================
      - name: Commit and push scaffolded files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "Ship complete: Zustand store, UI components, utils, and API routes"
          git push
