name: Add Deployment Configs

on:
  workflow_dispatch:

jobs:
  add-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          # Motion Studio - Cloud Run Dockerfile
          FROM node:20-slim AS base

          # Install dependencies for Remotion (Chrome/Puppeteer)
          RUN apt-get update && apt-get install -y \
              chromium \
              fonts-ipafont-gothic fonts-wqy-zenhei fonts-thai-tlwg fonts-kacst fonts-freefont-ttf \
              --no-install-recommends \
              && rm -rf /var/lib/apt/lists/*

          ENV PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
          ENV PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium

          WORKDIR /app

          # Install dependencies
          FROM base AS deps
          COPY package*.json ./
          RUN npm ci --only=production

          # Build
          FROM base AS builder
          COPY --from=deps /app/node_modules ./node_modules
          COPY . .
          RUN npm run build

          # Production
          FROM base AS runner
          WORKDIR /app

          ENV NODE_ENV=production
          ENV PORT=8080

          COPY --from=builder /app/public ./public
          COPY --from=builder /app/.next/standalone ./
          COPY --from=builder /app/.next/static ./.next/static

          EXPOSE 8080

          CMD ["node", "server.js"]
          EOF

      - name: Create .dockerignore
        run: |
          cat > .dockerignore << 'EOF'
          node_modules
          .next
          .git
          .gitignore
          README.md
          .env*
          Dockerfile
          .dockerignore
          EOF

      - name: Create vercel.json
        run: |
          cat > vercel.json << 'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "nextjs",
            "buildCommand": "npm run build",
            "installCommand": "npm install",
            "regions": ["iad1"],
            "functions": {
              "src/app/api/**/*.ts": {
                "maxDuration": 60
              }
            },
            "env": {
              "ANTHROPIC_API_KEY": "@anthropic-api-key",
              "GOOGLE_GENERATIVE_AI_API_KEY": "@google-ai-api-key",
              "GOOGLE_CLOUD_PROJECT": "@google-cloud-project"
            }
          }
          EOF

      - name: Create Vertex AI client
        run: |
          cat > src/lib/ai/vertex.ts << 'EOF'
          /**
           * Vertex AI Integration for Motion Studio
           * Includes Veo 2/3.1 video generation capabilities
           */
          import { VertexAI } from "@google-cloud/vertexai";

          const PROJECT_ID = process.env.GOOGLE_CLOUD_PROJECT || "";
          const LOCATION = process.env.GOOGLE_CLOUD_LOCATION || "us-central1";

          let vertexAI: VertexAI | null = null;

          function getVertexAI(): VertexAI {
            if (!vertexAI) {
              vertexAI = new VertexAI({
                project: PROJECT_ID,
                location: LOCATION,
              });
            }
            return vertexAI;
          }

          export interface VideoGenerationRequest {
            prompt: string;
            durationSeconds?: number;
            aspectRatio?: "16:9" | "9:16" | "1:1";
            numberOfVideos?: number;
          }

          export interface GeneratedVideo {
            uri: string;
            mimeType: string;
          }

          /**
           * Generate video using Veo 2 model via Vertex AI
           */
          export async function generateVideoWithVeo(
            request: VideoGenerationRequest
          ): Promise<GeneratedVideo[]> {
            const { prompt, aspectRatio = "16:9", numberOfVideos = 1 } = request;

            // Veo 2 video generation endpoint
            const endpoint = `https://${LOCATION}-aiplatform.googleapis.com/v1/projects/${PROJECT_ID}/locations/${LOCATION}/publishers/google/models/veo-2.0-generate-001:predictLongRunning`;

            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${await getAccessToken()}`,
              },
              body: JSON.stringify({
                instances: [{ prompt }],
                parameters: {
                  aspectRatio,
                  sampleCount: numberOfVideos,
                },
              }),
            });

            if (!response.ok) {
              throw new Error(`Veo generation failed: ${response.statusText}`);
            }

            const data = await response.json();
            return data.predictions || [];
          }

          /**
           * Use Gemini via Vertex AI (alternative to direct Gemini API)
           */
          export async function generateWithVertexGemini(
            prompt: string,
            options: { model?: string } = {}
          ): Promise<string> {
            const { model = "gemini-2.0-flash-001" } = options;
            const vertex = getVertexAI();
            const generativeModel = vertex.getGenerativeModel({ model });

            const result = await generativeModel.generateContent(prompt);
            const response = result.response;
            return response.candidates?.[0]?.content?.parts?.[0]?.text || "";
          }

          async function getAccessToken(): Promise<string> {
            // In Cloud Run, uses default service account
            // Locally, uses GOOGLE_APPLICATION_CREDENTIALS
            const { GoogleAuth } = await import("google-auth-library");
            const auth = new GoogleAuth({
              scopes: ["https://www.googleapis.com/auth/cloud-platform"],
            });
            const client = await auth.getClient();
            const token = await client.getAccessToken();
            return token.token || "";
          }
          EOF

      - name: Update AI index with Vertex
        run: |
          cat > src/lib/ai/index.ts << 'EOF'
          export * from "./claude";
          export * from "./gemini";
          export * from "./vertex";
          EOF

      - name: Create Cloud Run service config
        run: |
          cat > cloudbuild.yaml << 'EOF'
          # Cloud Build config for Cloud Run deployment
          steps:
            - name: "gcr.io/cloud-builders/docker"
              args:
                - "build"
                - "-t"
                - "gcr.io/$PROJECT_ID/motion-studio:$COMMIT_SHA"
                - "."

            - name: "gcr.io/cloud-builders/docker"
              args:
                - "push"
                - "gcr.io/$PROJECT_ID/motion-studio:$COMMIT_SHA"

            - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
              entrypoint: gcloud
              args:
                - "run"
                - "deploy"
                - "motion-studio"
                - "--image"
                - "gcr.io/$PROJECT_ID/motion-studio:$COMMIT_SHA"
                - "--region"
                - "us-central1"
                - "--platform"
                - "managed"
                - "--allow-unauthenticated"
                - "--memory"
                - "2Gi"
                - "--cpu"
                - "2"
                - "--set-env-vars"
                - "NODE_ENV=production"

          images:
            - "gcr.io/$PROJECT_ID/motion-studio:$COMMIT_SHA"

          options:
            logging: CLOUD_LOGGING_ONLY
          EOF

      - name: Update .env.example with GCP config
        run: |
          cat > .env.example << 'EOF'
          # AI Providers
          ANTHROPIC_API_KEY=sk-ant-...
          GOOGLE_GENERATIVE_AI_API_KEY=...

          # Google Cloud / Vertex AI
          GOOGLE_CLOUD_PROJECT=your-project-id
          GOOGLE_CLOUD_LOCATION=us-central1
          GOOGLE_APPLICATION_CREDENTIALS=./service-account.json

          # App Config
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          EOF

      - name: Add Vertex AI to package.json
        run: |
          # Add @google-cloud/vertexai and google-auth-library to dependencies
          npm pkg set dependencies.@google-cloud/vertexai="^1.9.0"
          npm pkg set dependencies.google-auth-library="^9.14.0"

      - name: Update next.config for standalone output
        run: |
          cat > next.config.ts << 'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            reactStrictMode: true,
            output: "standalone", // Required for Docker/Cloud Run
            serverExternalPackages: ["@remotion/renderer"],
            webpack: (config) => {
              config.resolve.alias.canvas = false;
              return config;
            },
          };

          export default nextConfig;
          EOF

      - name: Create deploy scripts in README
        run: |
          cat >> README.md << 'EOF'

          ## Deployment

          ### Vercel (Recommended for quick start)
          ```bash
          # Install Vercel CLI
          npm i -g vercel

          # Deploy
          vercel

          # Set environment variables in Vercel dashboard
          ```

          ### Cloud Run (Full GCP integration)
          ```bash
          # Authenticate with GCP
          gcloud auth login
          gcloud config set project YOUR_PROJECT_ID

          # Enable required APIs
          gcloud services enable run.googleapis.com
          gcloud services enable cloudbuild.googleapis.com
          gcloud services enable aiplatform.googleapis.com

          # Deploy via Cloud Build
          gcloud builds submit --config cloudbuild.yaml

          # Or build and deploy manually
          docker build -t gcr.io/YOUR_PROJECT_ID/motion-studio .
          docker push gcr.io/YOUR_PROJECT_ID/motion-studio
          gcloud run deploy motion-studio --image gcr.io/YOUR_PROJECT_ID/motion-studio --region us-central1
          ```

          ### Environment Variables for Production
          | Variable | Description |
          |----------|-------------|
          | `ANTHROPIC_API_KEY` | Claude API key |
          | `GOOGLE_GENERATIVE_AI_API_KEY` | Gemini API key (direct) |
          | `GOOGLE_CLOUD_PROJECT` | GCP project ID (for Vertex AI) |
          | `GOOGLE_CLOUD_LOCATION` | GCP region (default: us-central1) |
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add deployment configs: Dockerfile, Vercel, Cloud Run, Vertex AI" || echo "No changes"
          git push
