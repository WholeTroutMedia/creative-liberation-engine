      - name: Commit and push all production files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "Ship 100%: Types, Remotion components, Editor UI, Templates, Pages - Production Ready"
          git push
