name: Ship Production - 100% Complete
on:
  workflow_dispatch:

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================
      # HELIX 1: TYPES SYSTEM
      # ============================================
      - name: Create Types
        run: |
          mkdir -p src/types
          cat > src/types/index.ts << 'TYPES_EOF'
          export type SceneType = "text" | "image" | "video" | "transition" | "shape" | "audio";

          export interface Scene {
            id: string;
            type: SceneType;
            content: string;
            startFrame: number;
            durationFrames: number;
            style?: SceneStyle;
            src?: string;
            animation?: AnimationConfig;
          }

          export interface SceneStyle {
            backgroundColor?: string;
            color?: string;
            fontSize?: number;
            fontFamily?: string;
            fontWeight?: number;
            textAlign?: "left" | "center" | "right";
            padding?: number;
            opacity?: number;
            scale?: number;
            x?: number;
            y?: number;
            rotation?: number;
          }

          export interface AnimationConfig {
            type: "fade" | "slide" | "scale" | "rotate" | "spring";
            direction?: "left" | "right" | "up" | "down";
            duration?: number;
            delay?: number;
            easing?: string;
          }

          export interface VideoProject {
            id: string;
            title: string;
            description?: string;
            scenes: Scene[];
            duration: number;
            fps: number;
            width: number;
            height: number;
            template: string;
            createdAt: string;
            updatedAt: string;
          }

          export interface Template {
            id: string;
            name: string;
            description: string;
            thumbnail?: string;
            defaultScenes: Partial<Scene>[];
            defaultStyle: Partial<SceneStyle>;
            category: "social" | "presentation" | "ad" | "story" | "custom";
          }

          export interface RenderOptions {
            codec: "h264" | "h265" | "vp8" | "vp9";
            quality: "draft" | "medium" | "high";
            format: "mp4" | "webm" | "gif";
          }

          export interface GenerateRequest {
            prompt: string;
            duration?: number;
            style?: string;
            template?: string;
          }

          export interface AIResponse {
            title: string;
            scenes: Scene[];
            duration: number;
            fps: number;
            width: number;
            height: number;
          }
          TYPES_EOF

      # ============================================
      # HELIX 2: REMOTION SCENE RENDERERS
      # ============================================
      - name: Create Scene Renderers
        run: |
          mkdir -p src/remotion/components
          
          cat > src/remotion/components/TextScene.tsx << 'TEXTSCENE_EOF'
          import React from "react";
          import { AbsoluteFill, useCurrentFrame, interpolate, spring, useVideoConfig } from "remotion";

          interface TextSceneProps {
            content: string;
            style?: Record<string, any>;
            animation?: {
              type: "fade" | "slide" | "scale" | "spring";
              direction?: "left" | "right" | "up" | "down";
            };
          }

          export const TextScene: React.FC<TextSceneProps> = ({ content, style = {}, animation }) => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            
            let opacity = 1;
            let transform = "";
            
            if (animation?.type === "fade") {
              opacity = interpolate(frame, [0, 20], [0, 1], { extrapolateRight: "clamp" });
            } else if (animation?.type === "slide") {
              const direction = animation.direction || "left";
              const offset = interpolate(frame, [0, 25], [100, 0], { extrapolateRight: "clamp" });
              if (direction === "left") transform = `translateX(-${offset}%)`;
              else if (direction === "right") transform = `translateX(${offset}%)`;
              else if (direction === "up") transform = `translateY(-${offset}%)`;
              else if (direction === "down") transform = `translateY(${offset}%)`;
              opacity = interpolate(frame, [0, 15], [0, 1], { extrapolateRight: "clamp" });
            } else if (animation?.type === "scale" || animation?.type === "spring") {
              const scale = spring({ frame, fps, config: { damping: 100 } });
              transform = `scale(${scale})`;
              opacity = interpolate(frame, [0, 10], [0, 1], { extrapolateRight: "clamp" });
            }

            return (
              <AbsoluteFill
                style={{
                  justifyContent: "center",
                  alignItems: "center",
                  backgroundColor: style.backgroundColor || "transparent",
                }}
              >
                <div
                  style={{
                    color: style.color || "#ffffff",
                    fontSize: style.fontSize || 64,
                    fontFamily: style.fontFamily || "Inter, system-ui, sans-serif",
                    fontWeight: style.fontWeight || 700,
                    textAlign: style.textAlign || "center",
                    maxWidth: "85%",
                    padding: style.padding || 40,
                    opacity,
                    transform,
                    lineHeight: 1.2,
                  }}
                >
                  {content}
                </div>
              </AbsoluteFill>
            );
          };
          TEXTSCENE_EOF

          cat > src/remotion/components/ImageScene.tsx << 'IMAGESCENE_EOF'
          import React from "react";
          import { AbsoluteFill, Img, useCurrentFrame, interpolate, spring, useVideoConfig } from "remotion";

          interface ImageSceneProps {
            src: string;
            style?: Record<string, any>;
            animation?: {
              type: "fade" | "zoom" | "pan";
            };
          }

          export const ImageScene: React.FC<ImageSceneProps> = ({ src, style = {}, animation }) => {
            const frame = useCurrentFrame();
            const { fps, durationInFrames } = useVideoConfig();
            
            let opacity = 1;
            let scale = 1;
            let transform = "";

            if (animation?.type === "fade") {
              opacity = interpolate(frame, [0, 20], [0, 1], { extrapolateRight: "clamp" });
            } else if (animation?.type === "zoom") {
              scale = interpolate(frame, [0, durationInFrames], [1, 1.2], { extrapolateRight: "clamp" });
            } else if (animation?.type === "pan") {
              const x = interpolate(frame, [0, durationInFrames], [0, -10], { extrapolateRight: "clamp" });
              transform = `translateX(${x}%)`;
              scale = 1.1;
            }

            return (
              <AbsoluteFill style={{ backgroundColor: style.backgroundColor || "#000" }}>
                <Img
                  src={src}
                  style={{
                    width: "100%",
                    height: "100%",
                    objectFit: "cover",
                    opacity,
                    transform: `${transform} scale(${scale})`,
                  }}
                />
              </AbsoluteFill>
            );
          };
          IMAGESCENE_EOF

          cat > src/remotion/components/TransitionScene.tsx << 'TRANSITIONSCENE_EOF'
          import React from "react";
          import { AbsoluteFill, useCurrentFrame, interpolate } from "remotion";

          interface TransitionSceneProps {
            type: "fade" | "wipe" | "slide" | "zoom";
            direction?: "left" | "right" | "up" | "down";
            color?: string;
          }

          export const TransitionScene: React.FC<TransitionSceneProps> = ({ 
            type, 
            direction = "left",
            color = "#000000" 
          }) => {
            const frame = useCurrentFrame();
            
            if (type === "fade") {
              const opacity = interpolate(frame, [0, 15, 15, 30], [0, 1, 1, 0], { extrapolateRight: "clamp" });
              return <AbsoluteFill style={{ backgroundColor: color, opacity }} />;
            }
            
            if (type === "wipe" || type === "slide") {
              const progress = interpolate(frame, [0, 30], [0, 200], { extrapolateRight: "clamp" });
              let clipPath = "";
              if (direction === "left") clipPath = `inset(0 ${100 - progress/2}% 0 0)`;
              else if (direction === "right") clipPath = `inset(0 0 0 ${100 - progress/2}%)`;
              else if (direction === "up") clipPath = `inset(0 0 ${100 - progress/2}% 0)`;
              else if (direction === "down") clipPath = `inset(${100 - progress/2}% 0 0 0)`;
              return <AbsoluteFill style={{ backgroundColor: color, clipPath }} />;
            }

            if (type === "zoom") {
              const scale = interpolate(frame, [0, 15, 15, 30], [0, 1.5, 1.5, 0], { extrapolateRight: "clamp" });
              const opacity = interpolate(frame, [0, 5, 25, 30], [0, 1, 1, 0], { extrapolateRight: "clamp" });
              return (
                <AbsoluteFill style={{ justifyContent: "center", alignItems: "center" }}>
                  <div style={{ 
                    width: 100, 
                    height: 100, 
                    borderRadius: "50%", 
                    backgroundColor: color,
                    transform: `scale(${scale * 20})`,
                    opacity 
                  }} />
                </AbsoluteFill>
              );
            }

            return <AbsoluteFill style={{ backgroundColor: color }} />;
          };
          TRANSITIONSCENE_EOF

          cat > src/remotion/components/ShapeScene.tsx << 'SHAPESCENE_EOF'
          import React from "react";
          import { AbsoluteFill, useCurrentFrame, interpolate, spring, useVideoConfig } from "remotion";

          interface ShapeSceneProps {
            shape: "rectangle" | "circle" | "triangle";
            color?: string;
            style?: Record<string, any>;
            animation?: { type: "fade" | "scale" | "rotate" };
          }

          export const ShapeScene: React.FC<ShapeSceneProps> = ({ 
            shape, 
            color = "#3b82f6",
            style = {},
            animation 
          }) => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            
            let opacity = 1;
            let transform = "";

            if (animation?.type === "fade") {
              opacity = interpolate(frame, [0, 20], [0, 1], { extrapolateRight: "clamp" });
            } else if (animation?.type === "scale") {
              const scale = spring({ frame, fps, config: { damping: 80 } });
              transform = `scale(${scale})`;
            } else if (animation?.type === "rotate") {
              const rotation = interpolate(frame, [0, 60], [0, 360], { extrapolateRight: "clamp" });
              transform = `rotate(${rotation}deg)`;
            }

            const shapeStyle: React.CSSProperties = {
              width: style.width || 200,
              height: style.height || 200,
              backgroundColor: color,
              opacity,
              transform,
            };

            if (shape === "circle") {
              shapeStyle.borderRadius = "50%";
            } else if (shape === "triangle") {
              shapeStyle.backgroundColor = "transparent";
              shapeStyle.borderLeft = `${(style.width || 200) / 2}px solid transparent`;
              shapeStyle.borderRight = `${(style.width || 200) / 2}px solid transparent`;
              shapeStyle.borderBottom = `${style.height || 200}px solid ${color}`;
              shapeStyle.width = 0;
              shapeStyle.height = 0;
            }

            return (
              <AbsoluteFill style={{ justifyContent: "center", alignItems: "center", backgroundColor: style.backgroundColor }}>
                <div style={shapeStyle} />
              </AbsoluteFill>
            );
          };
          SHAPESCENE_EOF

          cat > src/remotion/components/index.ts << 'COMPONENTS_INDEX_EOF'
          export { TextScene } from "./TextScene";
          export { ImageScene } from "./ImageScene";
          export { TransitionScene } from "./TransitionScene";
          export { ShapeScene } from "./ShapeScene";
          COMPONENTS_INDEX_EOF

      # ============================================
      # HELIX 3: UPDATED MAIN COMPOSITION
      # ============================================
      - name: Update Main Composition
        run: |
          cat > src/remotion/compositions/MainComposition.tsx << 'MAINCOMP_EOF'
          import React from "react";
          import { AbsoluteFill, Sequence, useCurrentFrame, interpolate, spring, useVideoConfig } from "remotion";
          import { TextScene, ImageScene, TransitionScene, ShapeScene } from "../components";

          interface Scene {
            id: string;
            type: string;
            content: string;
            startFrame: number;
            durationFrames: number;
            style?: Record<string, any>;
            src?: string;
            animation?: { type: string; direction?: string };
          }

          interface MainCompositionProps {
            title: string;
            scenes: Scene[];
          }

          export const MainComposition: React.FC<MainCompositionProps> = ({ title, scenes }) => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            
            const titleOpacity = interpolate(frame, [0, 30], [0, 1], { extrapolateRight: "clamp" });
            const titleScale = spring({ frame, fps, config: { damping: 100 } });

            return (
              <AbsoluteFill style={{ backgroundColor: "#0a0a0a" }}>
                <Sequence from={0} durationInFrames={90}>
                  <AbsoluteFill style={{ justifyContent: "center", alignItems: "center" }}>
                    <h1 style={{
                      color: "white",
                      fontSize: 80,
                      fontFamily: "Inter, system-ui, sans-serif",
                      fontWeight: 700,
                      opacity: titleOpacity,
                      transform: `scale(${titleScale})`,
                    }}>
                      {title}
                    </h1>
                  </AbsoluteFill>
                </Sequence>
                
                {scenes.map((scene) => (
                  <Sequence key={scene.id} from={scene.startFrame} durationInFrames={scene.durationFrames}>
                    <SceneRenderer scene={scene} />
                  </Sequence>
                ))}
              </AbsoluteFill>
            );
          };

          const SceneRenderer: React.FC<{ scene: Scene }> = ({ scene }) => {
            switch (scene.type) {
              case "text":
                return <TextScene content={scene.content} style={scene.style} animation={scene.animation as any} />;
              case "image":
                return <ImageScene src={scene.src || ""} style={scene.style} animation={scene.animation as any} />;
              case "transition":
                return <TransitionScene type={(scene.animation?.type || "fade") as any} direction={scene.animation?.direction as any} color={scene.style?.backgroundColor} />;
              case "shape":
                return <ShapeScene shape={(scene.content as any) || "rectangle"} color={scene.style?.color} style={scene.style} animation={scene.animation as any} />;
              default:
                return <TextScene content={scene.content} style={scene.style} />;
            }
          };
          MAINCOMP_EOF

      # ============================================
      # HELIX 4: EDITOR UI COMPONENTS
      # ============================================
      - name: Create Timeline Component
        run: |
          mkdir -p src/components/editor
          cat > src/components/editor/Timeline.tsx << 'TIMELINE_EOF'
          "use client";
          import React from "react";
          import { useStudioStore } from "@/lib/store";
          import { formatDuration } from "@/lib/utils";

          export function Timeline() {
            const { project } = useStudioStore();
            if (!project) return null;

            const totalFrames = project.scenes.reduce((acc, s) => Math.max(acc, s.startFrame + s.durationFrames), 0);
            const pxPerFrame = 2;

            return (
              <div className="bg-gray-900 border-t border-gray-800 p-4">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-sm text-gray-400">Timeline</span>
                  <span className="text-sm text-gray-500">{formatDuration(totalFrames, project.fps)}</span>
                </div>
                <div className="relative h-20 bg-gray-950 rounded-lg overflow-hidden">
                  <div className="absolute inset-0 flex items-center">
                    {project.scenes.map((scene, i) => (
                      <div
                        key={scene.id}
                        className="absolute h-12 rounded bg-blue-600/80 border border-blue-500 flex items-center px-2 cursor-pointer hover:bg-blue-500/80 transition-colors"
                        style={{
                          left: scene.startFrame * pxPerFrame,
                          width: scene.durationFrames * pxPerFrame,
                        }}
                      >
                        <span className="text-xs text-white truncate">{scene.content.slice(0, 20)}</span>
                      </div>
                    ))}
                  </div>
                  <div className="absolute top-0 left-0 h-full w-0.5 bg-red-500" />
                </div>
              </div>
            );
          }
          TIMELINE_EOF

      - name: Create Scene List Component
        run: |
          cat > src/components/editor/SceneList.tsx << 'SCENELIST_EOF'
          "use client";
          import React from "react";
          import { useStudioStore } from "@/lib/store";
          import { Button } from "@/components/ui";
          import { Trash2, GripVertical, Plus } from "lucide-react";
          import { generateId } from "@/lib/utils";

          export function SceneList() {
            const { project, removeScene, addScene } = useStudioStore();
            if (!project) return null;

            const handleAddScene = () => {
              const lastScene = project.scenes[project.scenes.length - 1];
              const startFrame = lastScene ? lastScene.startFrame + lastScene.durationFrames : 90;
              addScene({
                id: generateId(),
                type: "text",
                content: "New Scene",
                startFrame,
                durationFrames: 90,
                style: { color: "#ffffff", fontSize: 48 },
              });
            };

            return (
              <div className="w-64 bg-gray-900 border-r border-gray-800 flex flex-col">
                <div className="p-3 border-b border-gray-800 flex items-center justify-between">
                  <span className="text-sm font-medium">Scenes</span>
                  <Button size="icon" variant="ghost" onClick={handleAddScene}>
                    <Plus className="w-4 h-4" />
                  </Button>
                </div>
                <div className="flex-1 overflow-y-auto">
                  {project.scenes.map((scene, index) => (
                    <div key={scene.id} className="p-3 border-b border-gray-800 hover:bg-gray-800/50 cursor-pointer group">
                      <div className="flex items-center gap-2">
                        <GripVertical className="w-4 h-4 text-gray-600" />
                        <div className="flex-1 min-w-0">
                          <div className="text-sm font-medium truncate">{scene.content.slice(0, 25) || `Scene ${index + 1}`}</div>
                          <div className="text-xs text-gray-500">{scene.type} • {scene.durationFrames} frames</div>
                        </div>
                        <Button size="icon" variant="ghost" className="opacity-0 group-hover:opacity-100" onClick={() => removeScene(scene.id)}>
                          <Trash2 className="w-4 h-4 text-red-400" />
                        </Button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          }
          SCENELIST_EOF

      - name: Create Properties Panel
        run: |
          cat > src/components/editor/PropertiesPanel.tsx << 'PROPERTIES_EOF'
          "use client";
          import React, { useState } from "react";
          import { useStudioStore } from "@/lib/store";
          import { Button } from "@/components/ui";

          export function PropertiesPanel() {
            const { project, updateScene } = useStudioStore();
            const [selectedId, setSelectedId] = useState<string | null>(null);
            
            const selectedScene = project?.scenes.find(s => s.id === selectedId) || project?.scenes[0];
            
            if (!project || !selectedScene) {
              return (
                <div className="w-72 bg-gray-900 border-l border-gray-800 p-4">
                  <p className="text-gray-500 text-sm">No scene selected</p>
                </div>
              );
            }

            return (
              <div className="w-72 bg-gray-900 border-l border-gray-800 flex flex-col">
                <div className="p-3 border-b border-gray-800">
                  <span className="text-sm font-medium">Properties</span>
                </div>
                <div className="p-4 space-y-4 overflow-y-auto flex-1">
                  <div>
                    <label className="text-xs text-gray-400 block mb-1">Content</label>
                    <textarea
                      value={selectedScene.content}
                      onChange={(e) => updateScene(selectedScene.id, { content: e.target.value })}
                      className="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm resize-none h-20"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-gray-400 block mb-1">Type</label>
                    <select
                      value={selectedScene.type}
                      onChange={(e) => updateScene(selectedScene.id, { type: e.target.value as any })}
                      className="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
                    >
                      <option value="text">Text</option>
                      <option value="image">Image</option>
                      <option value="transition">Transition</option>
                      <option value="shape">Shape</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Start Frame</label>
                      <input
                        type="number"
                        value={selectedScene.startFrame}
                        onChange={(e) => updateScene(selectedScene.id, { startFrame: parseInt(e.target.value) || 0 })}
                        className="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Duration</label>
                      <input
                        type="number"
                        value={selectedScene.durationFrames}
                        onChange={(e) => updateScene(selectedScene.id, { durationFrames: parseInt(e.target.value) || 30 })}
                        className="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs text-gray-400 block mb-1">Font Size</label>
                    <input
                      type="number"
                      value={selectedScene.style?.fontSize || 48}
                      onChange={(e) => updateScene(selectedScene.id, { style: { ...selectedScene.style, fontSize: parseInt(e.target.value) || 48 } })}
                      className="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-gray-400 block mb-1">Text Color</label>
                    <input
                      type="color"
                      value={selectedScene.style?.color || "#ffffff"}
                      onChange={(e) => updateScene(selectedScene.id, { style: { ...selectedScene.style, color: e.target.value } })}
                      className="w-full h-10 bg-gray-800 border border-gray-700 rounded cursor-pointer"
                    />
                  </div>
                </div>
              </div>
            );
          }
          PROPERTIES_EOF

      - name: Create Editor Components Index
        run: |
          cat > src/components/editor/index.ts << 'EDITORINDEX_EOF'
          export { Timeline } from "./Timeline";
          export { SceneList } from "./SceneList";
          export { PropertiesPanel } from "./PropertiesPanel";
          EDITORINDEX_EOF

      # ============================================
      # HELIX 5: UPDATED EDITOR PAGE
      # ============================================
      - name: Update Editor Page
        run: |
          cat > src/app/editor/page.tsx << 'EDITORPAGE_EOF'
          "use client";
          import React, { useState } from "react";
          import { Player } from "@remotion/player";
          import { MainComposition } from "@/remotion/compositions/MainComposition";
          import { useStudioStore } from "@/lib/store";
          import { Button, Progress } from "@/components/ui";
          import { Timeline, SceneList, PropertiesPanel } from "@/components/editor";
          import { Play, Download, Sparkles, Loader2 } from "lucide-react";

          export default function EditorPage() {
            const [prompt, setPrompt] = useState("");
            const { project, setProject, isGenerating, setGenerating, isRendering, setRendering, renderProgress, setRenderProgress } = useStudioStore();

            const handleGenerate = async () => {
              if (!prompt.trim()) return;
              setGenerating(true);
              try {
                const res = await fetch("/api/generate", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ prompt }),
                });
                const data = await res.json();
                if (data.id) setProject(data);
              } catch (error) {
                console.error("Generation failed:", error);
              } finally {
                setGenerating(false);
              }
            };

            const handleRender = async () => {
              if (!project) return;
              setRendering(true);
              setRenderProgress(0);
              try {
                const res = await fetch("/api/render", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ project }),
                });
                const data = await res.json();
                if (data.url) {
                  setRenderProgress(100);
                  window.open(data.url, "_blank");
                }
              } catch (error) {
                console.error("Render failed:", error);
              } finally {
                setRendering(false);
              }
            };

            const totalFrames = project?.scenes.reduce((acc, s) => Math.max(acc, s.startFrame + s.durationFrames), 300) || 300;

            return (
              <div className="h-screen bg-gray-950 text-white flex flex-col">
                {/* Header */}
                <header className="h-14 border-b border-gray-800 flex items-center justify-between px-4">
                  <h1 className="text-lg font-semibold">Motion Studio</h1>
                  <div className="flex items-center gap-2">
                    <Button variant="outline" size="sm" onClick={handleRender} disabled={!project || isRendering}>
                      {isRendering ? <Loader2 className="w-4 h-4 animate-spin mr-2" /> : <Download className="w-4 h-4 mr-2" />}
                      {isRendering ? "Rendering..." : "Export"}
                    </Button>
                  </div>
                </header>

                <div className="flex-1 flex overflow-hidden">
                  {/* Scene List */}
                  <SceneList />

                  {/* Main Content */}
                  <div className="flex-1 flex flex-col">
                    {/* Preview */}
                    <div className="flex-1 p-4 flex items-center justify-center bg-gray-900">
                      <div className="w-full max-w-4xl aspect-video bg-black rounded-lg overflow-hidden shadow-2xl">
                        <Player
                          component={MainComposition}
                          durationInFrames={totalFrames}
                          fps={project?.fps || 30}
                          compositionWidth={project?.width || 1920}
                          compositionHeight={project?.height || 1080}
                          style={{ width: "100%", height: "100%" }}
                          controls
                          inputProps={{
                            title: project?.title || "Motion Studio",
                            scenes: project?.scenes || [],
                          }}
                        />
                      </div>
                    </div>

                    {/* AI Prompt Bar */}
                    <div className="p-4 border-t border-gray-800 bg-gray-900">
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={prompt}
                          onChange={(e) => setPrompt(e.target.value)}
                          placeholder="Describe your video... (e.g., 'A 30 second intro for a tech startup')"
                          className="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                          onKeyDown={(e) => e.key === "Enter" && handleGenerate()}
                        />
                        <Button onClick={handleGenerate} disabled={isGenerating || !prompt.trim()}>
                          {isGenerating ? <Loader2 className="w-4 h-4 animate-spin mr-2" /> : <Sparkles className="w-4 h-4 mr-2" />}
                          {isGenerating ? "Generating..." : "Generate"}
                        </Button>
                      </div>
                      {isRendering && (
                        <div className="mt-3">
                          <Progress value={renderProgress} />
                        </div>
                      )}
                    </div>

                    {/* Timeline */}
                    <Timeline />
                  </div>

                  {/* Properties Panel */}
                  <PropertiesPanel />
                </div>
              </div>
            );
          }
          EDITORPAGE_EOF

      # ============================================
      # HELIX 6: TEMPLATES
      # ============================================
      - name: Create Templates
        run: |
          mkdir -p src/remotion/templates
          cat > src/remotion/templates/index.ts << 'TEMPLATES_EOF'
          import { Template } from "@/types";

          export const templates: Template[] = [
            {
              id: "modern-intro",
              name: "Modern Intro",
              description: "Clean, minimalist intro with smooth animations",
              category: "presentation",
              defaultScenes: [
                { type: "text", content: "Title", durationFrames: 90, style: { fontSize: 80, color: "#ffffff" } },
                { type: "transition", content: "", durationFrames: 30, animation: { type: "fade" } },
                { type: "text", content: "Subtitle", durationFrames: 60, style: { fontSize: 48, color: "#a0a0a0" } },
              ],
              defaultStyle: { backgroundColor: "#0a0a0a", color: "#ffffff", fontFamily: "Inter" },
            },
            {
              id: "social-story",
              name: "Social Story",
              description: "Vertical format for Instagram/TikTok stories",
              category: "story",
              defaultScenes: [
                { type: "text", content: "Hook", durationFrames: 60, style: { fontSize: 64, color: "#ffffff" }, animation: { type: "spring" } },
                { type: "text", content: "Main Point", durationFrames: 90, style: { fontSize: 48, color: "#ffffff" } },
                { type: "text", content: "CTA", durationFrames: 60, style: { fontSize: 56, color: "#3b82f6" } },
              ],
              defaultStyle: { backgroundColor: "#1a1a2e", color: "#ffffff" },
            },
            {
              id: "product-ad",
              name: "Product Ad",
              description: "Eye-catching product advertisement",
              category: "ad",
              defaultScenes: [
                { type: "text", content: "Problem?", durationFrames: 60, style: { fontSize: 72 }, animation: { type: "slide", direction: "left" } },
                { type: "transition", content: "", durationFrames: 20 },
                { type: "text", content: "Solution!", durationFrames: 90, style: { fontSize: 80, color: "#22c55e" }, animation: { type: "spring" } },
                { type: "text", content: "Get Started", durationFrames: 60, style: { fontSize: 48 } },
              ],
              defaultStyle: { backgroundColor: "#000000", color: "#ffffff" },
            },
          ];

          export function getTemplate(id: string): Template | undefined {
            return templates.find(t => t.id === id);
          }
          TEMPLATES_EOF

