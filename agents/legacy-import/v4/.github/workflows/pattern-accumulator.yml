name: 🧠 Pattern Accumulator

# Automatically analyzes sessions for recurring patterns and lessons
# Extracts knowledge and updates context library

on:
  schedule:
    - cron: '0 3 * * *'  # Every day at 3 AM (nightly analysis)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days to look back'
        required: false
        default: '7'
      min_frequency:
        description: 'Minimum pattern frequency'
        required: false
        default: '3'

permissions:
  contents: write
  issues: write

jobs:
  accumulate-patterns:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt
      
      - name: 📁 Create Required Directories
        run: |
          mkdir -p patterns
          mkdir -p SESSION_LOGS
          mkdir -p CORE_FOUNDATION/context-library
          mkdir -p reports
      
      - name: 🔍 Analyze Recent Sessions
        run: |
          python cle_engine/memory/pattern_accumulator.py \
            --sessions KEEPER/migration-tracker.json \
            --lookback ${{ github.event.inputs.lookback_days || '7' }}d \
            --min-frequency ${{ github.event.inputs.min_frequency || 3 }} \
            --output patterns/detected_patterns.json
      
      - name: 🎓 Extract Lessons Learned
        run: |
          python scripts/automation/extract_lessons.py \
            --patterns patterns/detected_patterns.json \
            --tracker KEEPER/migration-tracker.json \
            --auto-add \
            --output patterns/lessons.json
      
      - name: 📊 Generate Insights Report
        run: |
          python scripts/automation/generate_insights.py \
            --patterns patterns/detected_patterns.json \
            --lessons patterns/lessons.json \
            --output SESSION_LOGS/insights_$(date +%Y%m%d).md
      
      - name: 📚 Update Context Library
        id: update_context
        run: |
          python scripts/automation/update_context_library.py \
            --patterns patterns/detected_patterns.json \
            --library CORE_FOUNDATION/context-library/ \
            --threshold 0.75 \
            --output context_updates.json
          
          UPDATES=$(python -c "import json; print(len(json.load(open('context_updates.json'))['updates']))")
          echo "updates=$UPDATES" >> $GITHUB_OUTPUT
      
      - name: 🔗 Identify Cross-Hive Patterns
        run: |
          python scripts/automation/identify_cross_hive_patterns.py \
            --patterns patterns/detected_patterns.json \
            --hives AURORA,LEX,KEEPER,BROADCAST,SWITCHBOARD,COMPASS \
            --output patterns/cross_hive.json
      
      - name: 🎯 Generate Pattern Summary
        run: |
          python scripts/automation/generate_pattern_summary.py \
            --detected patterns/detected_patterns.json \
            --cross-hive patterns/cross_hive.json \
            --lessons patterns/lessons.json \
            --output patterns/PATTERN_SUMMARY.md
      
      - name: 💾 Commit Pattern Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🧠 Pattern accumulation: $(date +%Y-%m-%d) - ${{ steps.update_context.outputs.updates }} updates"
          file_pattern: 'KEEPER/migration-tracker.json SESSION_LOGS/ CORE_FOUNDATION/context-library/ patterns/'
          commit_user_name: 'Pattern Accumulator'
          commit_user_email: 'patterns@cle-engine.ai'
      
      - name: 🔔 Notify on Significant Patterns
        if: steps.update_context.outputs.updates > 5
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('patterns/PATTERN_SUMMARY.md', 'utf8');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🧠 Significant Patterns Detected: ${{ steps.update_context.outputs.updates }} insights`,
              body: summary,
              labels: ['patterns', 'learning', 'keeper']
            });
