name: Mirror to GitHub

# Runs after every push to main — mirrors this repo to GitHub automatically
on:
  push:
    branches: [main]

jobs:
  mirror:
    name: Push to GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        run: |
          git clone --mirror http://oauth2:${{ github.token }}@127.0.0.1:3000/WholeTroutMedia/creative-liberation-engine-v4.git .
          echo "OK Checked out $(git log -1 --oneline HEAD)"

      - name: Push to GitHub
        env:
          GITHUB_MIRROR_TOKEN: ${{ secrets.GITHUB_MIRROR_TOKEN }}
        run: |
          git push --mirror https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/WholeTroutMedia/creative-liberation-engine-v4.git
          echo "OK Mirrored to GitHub"
