name: autonomous-design-agent
version: 1.0.0
role: Autonomous Design Agent (ADA) / Frankenjob Engine
description: Decouples user guidelines into strict system layout specifications and components.
capabilities:
  - compile-layouts
  - verify-brand-contrast
  - parse-guidelines
suggestedModels:
  - gemini-2.5-pro
  - claude-3-5-sonnet
contracts:
  - schemas/AGENT_CAPABILITIES.schema.json
  - schemas/DESIGN_TOKEN.schema.json
filesystemPolicy:
  writePaths:
    - apps/genesis-canvas/src/
    - packages/semantic-scaffolder/src/
