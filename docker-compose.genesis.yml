# version removed -- obsolete in Compose V2+

# 
# CREATIVE LIBERATION ENGINE: GENESIS
# One-command deploy for the full creative OS stack
#
# Usage:
#   cp .env.genesis.example .env
#   docker compose -f docker-compose.genesis.yml up -d
#
# Minimum: 8GB RAM, 4 cores, 100GB disk
# 

x-common-env: &common-env
  NODE_ENV: production
  TZ: America/New_York

x-restart-policy: &restart-policy
  restart: always

services:
  #  Core Database Layer 

  postgres:
    image: postgres:16-alpine
    <<: *restart-policy
    environment:
      POSTGRES_DB: cle_genesis
      POSTGRES_USER: ${POSTGRES_USER:-cle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cle_genesis_dev}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [ genesis-net ]

  redis:
    image: redis:7-alpine
    <<: *restart-policy
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-cle_redis} --appendonly yes --appendfsync everysec --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cle_redis}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [ genesis-net ]

  #  Memory Layer 

  chromadb:
    image: chromadb/chroma:latest
    <<: *restart-policy
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    networks: [ genesis-net ]

  averi-memory-service:
    image: cle/averi-memory-service:genesis
    build:
      context: .
      dockerfile: services/averi-memory-service/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 3030
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      CHROMA_URL: http://chromadb:8000
    ports:
      - "${MEMORY_SERVICE_PORT:-3030}:3030"
    depends_on:
      - redis
      - chromadb
    networks: [ genesis-net ]

  reasoning-core:
    image: cle/reasoning-core:genesis
    build:
      context: .
      dockerfile: services/reasoning-core/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 5090
      MEMORY_SERVICE_URL: http://averi-memory-service:3030
    ports:
      - "${REASONING_CORE_PORT:-5090}:5090"
    depends_on:
      - averi-memory-service
    networks: [ genesis-net ]

  workspace-autonomy:
    image: cle/workspace-autonomy:genesis
    build:
      context: .
      dockerfile: services/workspace-autonomy/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 5091
      MEMORY_SERVICE_URL: http://averi-memory-service:3030
    ports:
      - "${WORKSPACE_AUTONOMY_PORT:-5091}:5091"
    depends_on:
      - averi-memory-service
    networks: [ genesis-net ]

  cle-dream:
    image: cle/cle-dream:genesis
    build:
      context: .
      dockerfile: services/cle-dream/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      CHROMA_URL: http://chromadb:8000
      MAX_TOKENS_PER_CYCLE: 50000
      MAX_DURATION_MS: 300000
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks: [ genesis-net ]

  #  Sovereign Git 

  forgejo:
    image: codeberg.org/forgejo/forgejo:1.21
    <<: *restart-policy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: ${POSTGRES_USER:-cle}
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:-localhost}
      FORGEJO__server__ROOT_URL: ${FORGEJO_URL:-http://localhost:3001}
    volumes:
      - forgejo_data:/data
    ports:
      - "${FORGEJO_PORT:-3002}:3000"
      - "${FORGEJO_SSH_PORT:-2223}:22"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ genesis-net ]

  #  AI Orchestration (Genkit) 

  genkit:
    image: cle/genkit:genesis
    build:
      context: .
      dockerfile: packages/genkit/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      GENKIT_ENV: dev
      GENKIT_API_KEY: ${GENKIT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      CHROMA_URL: http://chromadb:8000
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      GENKIT_DEFAULT_MODEL: ${GENKIT_DEFAULT_MODEL:-googleAI/gemini-flash-latest}
      GENKIT_PRO_MODEL: ${GENKIT_PRO_MODEL:-googleAI/gemini-pro-latest}
      GENKIT_CACHE_MODEL: ${GENKIT_CACHE_MODEL:-googleAI/gemini-pro-latest}
      
      #  Biometric Mesh Context 
      BIOMETRIC_CONSENT_MODE: ${BIOMETRIC_CONSENT_MODE:-silent}
      BIOMETRIC_BRIDGE_URL: ${BIOMETRIC_BRIDGE_URL:-ws://127.0.0.1:4000}
      BIOMETRIC_ROUTING_ENABLED: ${BIOMETRIC_ROUTING_ENABLED:-true}
      #  WordPress.com MCP Publishing 
      # Get token from: https://developer.wordpress.com/apps/  OAuth 2.1 token
      # Site ID: numeric site ID or site slug (e.g. 12345678 or mysite.wordpress.com)
      WP_ACCESS_TOKEN: ${WP_ACCESS_TOKEN:-}
      WP_SITE_ID: ${WP_SITE_ID:-}

    ports:
      - "${GENKIT_HOST_PORT:-4000}:4000"
      - "4001:3100"
    depends_on:
      - redis
      - chromadb
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health" ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    volumes:
      - /app/creative-liberation-engine/runtime:/app/creative-liberation-engine/runtime
    networks: [ genesis-net ]


  #  GHOST  Autonomous QA Engine 

  ghost:
    image: cle/ghost:genesis
    build:
      context: .
      dockerfile: packages/ghost/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      GHOST_HEADLESS: "true"
      GHOST_SCREENSHOT_DIR: /ghost/screenshots
      GHOST_REPORT_DIR: /ghost/reports
      DISPATCH_URL: http://dispatch:5150
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      TELNYX_FROM_NUMBER: ${TELNYX_FROM_NUMBER:-}
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY:-}
      GHOST_ALLOW_UNVERIFIED_TELNYX: ${GHOST_ALLOW_UNVERIFIED_TELNYX:-false}
    shm_size: "2gb" # Required for Chrome
    volumes:
      - ghost_screenshots:/ghost/screenshots
      - ghost_reports:/ghost/reports
    ports:
      - "${GHOST_PORT:-6000}:6000"
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [ genesis-net ]

  #  GOD PROMPT  Dockerfile pending (packages/god-prompt/Dockerfile) 
  # god-prompt: disabled  Dockerfile not yet created

  #  ATLAS LIVE  Broadcast Engine 

  caspar-cg:
    image: casparserver/caspar-cg:latest
    <<: *restart-policy
    volumes:
      - caspar_media:/media
      - caspar_templates:/templates
      - ./packages/atlas-live/templates:/templates/cle
    ports:
      - "5250:5250" # AMCP
      - "8080:8080" # HTTP API
    networks: [ genesis-net ]
    profiles: [ broadcast ] # Only starts with --profile broadcast

  atlas-live:
    image: cle/atlas-live:genesis
    build:
      context: .
      dockerfile: packages/atlas-live/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      CASPAR_HOST: caspar-cg
      CASPAR_PORT: 5250
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-} # For live transcription

    ports:
      - "${ATLAS_PORT:-8500}:8000"
    networks: [ genesis-net ]

  #  DISPATCH WORKER  Autonomous Agent Loop 

  dispatch-worker:
    image: cle/dispatch:genesis
    build:
      context: .
      dockerfile: services/dispatch/Dockerfile
    <<: *restart-policy
    command: node build/worker.js
    environment:
      <<: *common-env
      WORKER_ID: dispatch-worker-genesis
      VAULT_MASTER_KEY: c7847ea63b519fdb23ea9a1ab38d7acab2d20e741bfabefced9e8da3085521e3
      GENKIT_URL: http://genkit:4000
      DISPATCH_URL: http://dispatch:5150
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      POSTGRES_URL: postgresql://${POSTGRES_USER:-cle}:${POSTGRES_PASSWORD}@postgres:5432/cle_genesis
      DISPATCH_DATA_DIR: /data
      PROJECT: ${PROJECT:-creative-liberation-engine-v5}
      WORKER_POLL_MS: "15000"
      GENKIT_API_KEY: ${GENKIT_API_KEY:-}
      GENKIT_DEFAULT_MODEL: ${GENKIT_DEFAULT_MODEL:-googleAI/gemini-flash-latest}
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      TELNYX_FROM_NUMBER: ${TELNYX_FROM_NUMBER:-}
      TELNYX_MESSAGING_PROFILE_ID: ${TELNYX_MESSAGING_PROFILE_ID:-}
    volumes:
      # Shared bind-mount  worker reads from the same DB as the dispatch server
      - /volume2/cle-engine/dispatch/data:/data
    depends_on:
      genkit:
        condition: service_started
      redis:
        condition: service_healthy
    # Worker has no HTTP server; image HEALTHCHECK targets :5160 (dispatch API) and fails here.
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://genkit:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [ genesis-net ]

  #  BLUEPRINTS  Vertical Blueprint Runtime 

  blueprints:
    image: cle/blueprints:genesis
    build:
      context: .
      dockerfile: packages/blueprints/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      BLUEPRINTS_PORT: 4200
      GENKIT_URL: http://genkit:4000
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
    ports:
      - "${BLUEPRINTS_PORT:-4200}:4200"
    depends_on:
      genkit:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4200/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [ genesis-net ]

  #  GENMEDIA  AI Media Provider Engine 

  genmedia:
    image: cle/genmedia:genesis
    build:
      context: .
      dockerfile: packages/genmedia/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      GENMEDIA_PORT: 4300
      GENKIT_URL: http://genkit:4000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      KLING_API_KEY: ${KLING_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      RUNWAY_API_SECRET: ${RUNWAY_API_SECRET:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      CHROMA_URL: http://chromadb:8000
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
    ports:
      - "${GENMEDIA_PORT:-4300}:4300"
    depends_on:
      genkit:
        condition: service_started
      chromadb:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4300/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [ genesis-net ]

  #  SYNOLOGY MEDIA MCP  NAS MCP Control Plane 

  synology-media-mcp:
    image: cle/synology-media-mcp:genesis
    build:
      context: .
      dockerfile: services/synology-media-mcp/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      SYNOLOGY_MCP_PORT: 4400
    ports:
      - "${SYNOLOGY_MCP_PORT:-4400}:4400"
    volumes:
      - /app/vault/RAW Backups:/volume2/The Vault/RAW Backups:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:4400/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [ genesis-net ]

  #  FFMPEG SWARM  Autonomous Video Workers 

  ffmpeg-swarm:
    image: cle/ffmpeg-swarm:genesis
    build:
      context: .
      dockerfile: services/ffmpeg-swarm/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      ASSETS_DIR: /data/assets
    volumes:
      - nas_assets:/data/assets
    depends_on:
      redis:
        condition: service_healthy
    networks: [ genesis-net ]
    deploy:
      mode: replicated
      replicas: 1

  #  SCRIBE DAEMON  Autonomous Memory Watcher 

  scribe-daemon:
    image: cle/scribe-daemon:genesis
    build:
      context: .
      dockerfile: services/scribe-daemon/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      CHROMA_URL: http://chromadb:8000
      HOST_WORKSPACE: /workspace
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      SCRIBE_WEBHOOK_SECRET: ${SCRIBE_WEBHOOK_SECRET:-}
      SCRIBE_HTTP_PORT: "9100"
    ports:
      - "${SCRIBE_PORT:-9100}:9100"
    volumes:
      - .:/workspace
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9100/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [ genesis-net ]

  #  FORGE  Real-Time Asset Economy Engine 

  forge:
    image: cle/forge:genesis
    build:
      context: .
      dockerfile: packages/forge/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 4350
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      # Cloud mesh routing endpoints (optional  FORGE routes locally if not set)
      FORGE_SOVEREIGN_ENDPOINT: http://dispatch:5150
      FORGE_GCP_ENDPOINT: ${FORGE_GCP_ENDPOINT:-}
      FORGE_CF_ENDPOINT: ${FORGE_CF_ENDPOINT:-}
      FORGE_AWS_ENDPOINT: ${FORGE_AWS_ENDPOINT:-}
      # Forward dispatch URL so FORGE can register jobs with the broker
      DISPATCH_URL: http://dispatch:5150
    ports:
      - "${FORGE_PORT:-4350}:4350"
    depends_on:
      redis:
        condition: service_healthy
      dispatch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:4350/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [ genesis-net ]

  #  WIRE INGESTION MCP  Real-Time Feed Engine 

  wire-ingestion-mcp:
    image: cle/wire-ingestion-mcp:latest
    build:
      context: ./packages/wire-ingestion-mcp
      dockerfile: Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
    ports:
      - "4250:4200"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:4200/health || exit 0" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [ genesis-net ]

  #  VERCEL MCP  Sovereign Vercel Integration 

  vercel-mcp:
    image: cle/vercel-mcp:genesis
    build:
      context: ./packages/vercel-mcp
      dockerfile: Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
    ports:
      - "5060:5060"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5060/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [ genesis-net ]


  #  DIRECTOR  Autonomous Task Queue Populator 

  director:
    image: cle/director:genesis
    build:
      context: .
      dockerfile: packages/director/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      DISPATCH_URL: http://dispatch:5150
      WORKSPACE_ROOT: /workspace
      CRON_SCHEDULE: "0 */6 * * *"
    volumes:
      # Read-only monorepo mount  director only reads, never writes
      - .:/workspace:ro
    depends_on:
      dispatch:
        condition: service_healthy
    networks: [ genesis-net ]



  #  ZERO DAY  Client Operations 

  zero-day:
    image: cle/zero-day:genesis
    build:
      context: .
      dockerfile: packages/zero-day/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_API_KEY: ${VERTEX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cle-engine}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      CHROMA_URL: http://chromadb:8000
      POSTGRES_URL: postgresql://${POSTGRES_USER:-cle}:${POSTGRES_PASSWORD}@postgres:5432/cle_genesis
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      GENKIT_URL: http://genkit:4000
      GDRIVE_OAUTH_PATH: ${GDRIVE_OAUTH_PATH:-}
      GDRIVE_CREDENTIALS_PATH: ${GDRIVE_CREDENTIALS_PATH:-}
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      TELNYX_FROM_NUMBER: ${TELNYX_FROM_NUMBER:-}
      SONY_INGEST_INCOMING_DIR: /ingest/incoming
    ports:
      - "${ZERO_DAY_PORT:-9000}:9000"
    volumes:
      - /app/vault/RAW Backups/2026/Barnstorm/live-ingest/incoming:/ingest/incoming
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks: [ genesis-net ]

  #  CLOUDFLARED QUICK-TUNNEL  Public HTTPS for zero-day webhooks 
  # Exposes zero-day:9000 as a public https://*.trycloudflare.com URL.
  # No Cloudflare account or DNS setup required.
  # Read the URL from container logs: docker logs cloudflared-tunnel | grep trycloudflare
  cloudflared-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://zero-day:9000 --logfile /dev/stdout
    depends_on:
      - zero-day
    networks: [ genesis-net ]
    labels:
      - cle.service=cloudflared-tunnel
      - cle.role=public-ingress

  #  DISPATCH  Universal Agent Task Broker 

  dispatch:
    image: cle/dispatch:genesis
    build:
      context: .
      dockerfile: services/dispatch/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 5150
      # Align with dispatch-worker PROJECT so Telnyx-ingested tasks are claimable.
      PROJECT: ${PROJECT:-creative-liberation-engine-v5}
      # Bind-mounted to a sovereign NAS path so the SQLite DB survives any container restart.
      # Path: /volume2/cle-engine/dispatch/data/dispatch.db
      DISPATCH_STORE_DIR: /data
      POSTGRES_URL: postgresql://${POSTGRES_USER:-cle}:${POSTGRES_PASSWORD}@postgres:5432/cle_genesis
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY:-}
      DISPATCH_ALLOW_UNVERIFIED_TELNYX: ${DISPATCH_ALLOW_UNVERIFIED_TELNYX:-false}
      GENKIT_API_KEY: ${GENKIT_API_KEY:-}
      GENKIT_API_URL: http://genkit:4000
      VAULT_MASTER_KEY: c7847ea63b519fdb23ea9a1ab38d7acab2d20e741bfabefced9e8da3085521e3
    ports:
      - "${DISPATCH_HOST_PORT:-5160}:5150"
    volumes:
      #  Sovereign bind-mount  NOT a named volume 
      # Named volumes declared as 'external' silently no-op if the volume doesn't exist.
      # This bind mount guarantees dispatch.db lives at a known, survives-restart path.
      - /volume2/cle-engine/dispatch/data:/data
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5150/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [ genesis-net ]

  #  COMET MOBILE  Field Agent PWA 
  # iOS/Android PWA served over Tailscale mesh. Installable on home screen.
  # Open http://100.95.235.5:3500 in Safari  Share  Add to Home Screen

  comet-mobile:
    image: cle/comet-mobile:genesis
    build:
      context: .
      dockerfile: packages/comet-mobile/Dockerfile
    <<: *restart-policy
    ports:
      - "3500:80"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [ genesis-net ]

  #  SOVEREIGN HOME MESH  Physical Intelligence Layer 
  #  Always-on service. Talks to Home Assistant at 127.0.0.1:8123.
  #  REST API: :5055  |  MCP tools: :5051 (stdio sidecar)

  sovereign-home-mesh:
    image: cle/sovereign-home-mesh:genesis
    build:
      context: .
      dockerfile: packages/sovereign-home-mesh/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 5055
      HASS_URL: ${HASS_URL:-http://127.0.0.1:8123}
      HASS_TOKEN: ${HASS_TOKEN}
      LG_TV_ENTITY: ${LG_TV_ENTITY:-media_player.lg_webos_tv_oled77g1pua}
      HOME_MESH_URL: http://localhost:5055
    ports:
      - "5055:5055"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5055/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [ genesis-net ]

  #  COMET  Sovereign Spatial Intelligence Layer 

  comet:
    image: cle/comet:genesis
    build:
      context: .
      dockerfile: packages/comet/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 7100
      GHOST_URL: http://ghost:6000
      GENKIT_URL: http://genkit:4000
      CLE_URL: http://cle-engine:8000
      COMET_HEADLESS: "true"
      COMET_MEMORY_DIR: /data/comet-memory
      COMET_AUDIT_DIR: /data/comet-memory/audit
      COMET_SMG_THRESHOLD: "0.4"
    ports:
      - "${COMET_PORT:-7100}:7100"
    volumes:
      - comet_memory:/data/comet-memory
    depends_on:
      ghost:
        condition: service_started
      genkit:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7100/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [ genesis-net ]

  #  STORYBOOK  Live Component Specs for CODEX 

  storybook:
    image: cle/storybook:genesis
    build:
      context: .
      dockerfile: apps/storybook/Dockerfile
    <<: *restart-policy
    ports:
      - "${STORYBOOK_PORT:-6006}:80"
    networks: [ genesis-net ]
  #  CODEX WEB  Sovereign Wiki Serve 

  codex-web:
    build:
      context: /app/codex
      dockerfile: Dockerfile
    restart: always
    ports:
      - "6007:80"
    networks: [ genesis-net ]

  #  CORTEX THEATER  Spatial Representation 

  cortex-theater:
    image: cle/cortex-theater:genesis
    build:
      context: .
      dockerfile: apps/cortex-theater/Dockerfile
    <<: *restart-policy
    ports:
      - "${CORTEX_THEATER_PORT:-3040}:80"
    depends_on:
      averi-memory-service:
        condition: service_started
    networks: [ genesis-net ]

  #  Creative Liberation Engine API Gateway 

  gateway:
    image: cle/gateway:genesis
    build:
      context: .
      dockerfile: Dockerfile.gateway
    <<: *restart-policy
    environment:
      <<: *common-env
      GENKIT_URL: http://genkit:4000
      RELAY_URL: http://relay-mcp:5000
      GHOST_URL: http://ghost:6000
      ATLAS_URL: http://atlas-live:8000
      ZERO_DAY_URL: http://zero-day:9000
      COMET_URL: http://comet:7100
      DISPATCH_URL: http://dispatch:5150
      BLUEPRINTS_URL: http://blueprints:4200
      GENMEDIA_URL: http://genmedia:4300
      SYNOLOGY_MCP_URL: http://synology-media-mcp:4400
      SCRIBE_URL: http://scribe-daemon:9100
      SOVEREIGN_HOME_MESH_URL: http://sovereign-home-mesh:5055
      WIRE_INGESTION_URL: http://wire-ingestion-mcp:4200
      FORGE_URL: http://forge:4350
      MCP_HUB_URL: http://mcp-hub:5056
    ports:
      - "3080:3000"
    depends_on:
      genkit:
        condition: service_started
      comet:
        condition: service_started
      blueprints:
        condition: service_started
      genmedia:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 15s
    networks: [ genesis-net ]

  #  SOVEREIGN MCP HUB  Atlassian-Killer (Sentinel Track + Scholar Hive)

  mcp-hub:
    image: cle/mcp-hub:genesis
    build:
      context: .
      dockerfile: services/mcp-hub/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      MCP_HUB_PORT: 5056
      MCP_HUB_DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: all-minilm
      QDRANT_COLLECTION: scholar_hive
    ports:
      - "5056:5056"
    volumes:
      - /volume2/cle-engine/mcp-hub/data:/data
      - /app/vault:/vault:ro
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5056/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [ genesis-net ]

  #  Ollama (Offline Sovereignty) 
  # NAS: CPU-only (J3455, no GPU). Models: Qwen3.5-0.8B (agent brain) + Qwen2.5:3b (reasoning)
  # Workstation: GPU-accelerated via local Ollama (not this container)

  ollama:
    image: ollama/ollama:latest
    <<: *restart-policy
    # Auto-pull NAS sovereign models on startup then serve
    entrypoint: >
      /bin/sh -c "
        /bin/ollama serve &
        sleep 5 &&
        ollama pull qwen3.5:0.8b 2>&1 | tail -1 &&
        ollama pull qwen2.5:3b 2>&1 | tail -1 &&
        echo 'NAS models ready' &&
        wait
      "
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"
    networks: [ genesis-net ]
    # Sovereign sovereignty layer  always on, no profile gate
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  #  VLLM (NVIDIA Optimized Max Throughput) 

  vllm:
    image: vllm/vllm-openai:latest
    <<: *restart-policy
    profiles: [ gpu ]
    # Serves Meta-Llama-3 (or Nemotron) locally with an OpenAI-compatible API
    command: --model meta-llama/Meta-Llama-3-8B-Instruct --gpu-memory-utilization 0.4
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    ports:
      - "8001:8000"
    networks: [ genesis-net ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  #  VISION FORGE (Meta SAM 2 & Local Vision) 

  vision-forge:
    image: roboflow/roboflow-inference-server-gpu:latest
    <<: *restart-policy
    profiles: [ gpu ]
    ports:
      - "9001:9001"
    environment:
      - API_KEY=${ROBOFLOW_API_KEY:-}
      # This allows zero-shot SAM 2 segmentation and Depth Anything workflows locally
    networks: [ genesis-net ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  #  TRITON INFERENCE SERVER (VFX & TensorRT) 

  triton-server:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    <<: *restart-policy
    profiles: [ gpu ]
    # The gold standard for VFX real-time AI serving (handles TensorRT, ONNX for AnimateAnyone etc)
    command: tritonserver --model-repository=/models --strict-model-config=false
    volumes:
      - ./models/triton:/models
    ports:
      - "8000:8000" # HTTP
      - "8001:8001" # GRPC
      - "8002:8002" # Metrics
    networks: [ genesis-net ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  #  TRIPOSR API (Sub-Second 3D Generation) 

  triposr-api:
    image: cle/triposr-api:genesis
    build:
      context: .
      dockerfile: services/triposr-api/Dockerfile
    <<: *restart-policy
    profiles: [ gpu ]
    # Headless API for feeding GenImage results directly into 3D Mesh creation in < 0.5s
    ports:
      - "9002:9002"
    networks: [ genesis-net ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  #  FOLEY ENGINE (AudioLDM 2 / Stable Audio) 

  foley-engine:
    image: cle/foley-engine:genesis
    build:
      context: .
      dockerfile: services/foley-engine/Dockerfile
    <<: *restart-policy
    profiles: [ gpu ]
    # Dedicated text-to-audio latent diffusion server for SFX, Foley, and Music loops
    ports:
      - "9003:9003"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    networks: [ genesis-net ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]



  #  Shadow QA Service 
  shadow-qa:
    build:
      context: ./services/shadow-qa
      dockerfile: Dockerfile
    container_name: cle-shadow-qa
    restart: unless-stopped
    networks: [ genesis-net ]
    ports:
      - "${SHADOW_QA_PORT:-4450}:4450"
    volumes:
      - .:/monorepo:ro # Read-only mount of monorepo so it can run pnpm commands
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      SHADOW_QA_PORT: 4450
      MONOREPO_ROOT: /monorepo
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4450/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ambient-worker: disabled  services/ambient-worker/Dockerfile not yet created

  #  NTFY  Self-hosted Push Notification Server 
  # Mobile app: install ntfy (iOS/Android), subscribe to cle-averi topic
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: cle-ntfy
    <<: *restart-policy
    ports:
      - "8880:80"
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://127.0.0.1:8880}
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_LOG_LEVEL=info
    volumes:
      - ntfy_data:/var/lib/ntfy
    command: serve
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [ genesis-net ]

  #  MOBILE BRIDGE  AVERI  ntfy Push Adapter 
  # Translates Redis agent events to ntfy push notifications for iOS/Android

  #  AVERI GATEWAY  Wave 37 Helix E 
  # FastAPI chat bridge: mobile  AVERI Trinity via Genkit /averi/invoke
  averi-gateway:
    image: cle/averi-gateway:genesis
    build:
      context: services/averi-gateway
      dockerfile: Dockerfile
    container_name: cle-averi-gateway
    <<: *restart-policy
    ports:
      - "${AVERI_GATEWAY_PORT:-8420}:8420"
    environment:
      PORT: 8420
      GENKIT_URL: http://genkit:4000
      DISPATCH_URL: http://dispatch:5150
    depends_on:
      - genkit
      - dispatch
    networks:
      - genesis-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mobile-bridge:
    image: cle/mobile-bridge:genesis
    build:
      context: .
      dockerfile: packages/mobile-bridge/Dockerfile
    container_name: cle-mobile-bridge
    <<: *restart-policy
    ports:
      - "4800:4800"
    environment:
      PORT: 4800
      NTFY_URL: http://ntfy:80
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-cle-averi}
      GENKIT_URL: http://genkit:4000
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
      DISPATCH_URL: http://dispatch:5150
    depends_on:
      ntfy:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:4800/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [ genesis-net ]

  #  OMNIMEDIA  MetaHuman Pipeline 
  # Profile: omnimedia  start with: docker compose --profile omnimedia up -d

  audio2face-nim:
    # NVIDIA Audio2Face NIM microservice  ARKit 52-blendshape inference
    # Requires valid NGC API key and NVIDIA GPU with >=8GB VRAM
    # NGC image: nvcr.io/nim/nvidia/audio2face-3d:1.0
    image: ${A2F_NIM_IMAGE:-nvcr.io/nim/nvidia/audio2face-3d:1.0}
    container_name: cle-audio2face-nim
    <<: *restart-policy
    profiles: [ omnimedia ]
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
      # Audio2Face NIM configuration
      A2F_INFERENCE_MODE: ${A2F_INFERENCE_MODE:-default}
      A2F_MAX_BATCH_SIZE: ${A2F_MAX_BATCH_SIZE:-1}
    ports:
      - "${A2F_PORT:-8011}:8011" # REST API
    volumes:
      - a2f_nim_cache:/root/.cache/nim # Model cache  survives restarts
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8011/health" ]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s # NIM takes ~60s to load model on first run
    networks: [ genesis-net ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  somatic-bridge:
    # TypeScript HTTPOSC bridge  receives blendshapes from A2F NIM, broadcasts to UE5
    image: cle/somatic:genesis
    build:
      context: .
      dockerfile: packages/somatic/Dockerfile
    container_name: cle-somatic-bridge
    <<: *restart-policy
    profiles: [ omnimedia ]
    environment:
      <<: *common-env
      SOMATIC_HTTP_PORT: "6060"
      SOMATIC_OSC_HOST: ${UE5_OSC_HOST:-host.docker.internal} # UE5 host
      SOMATIC_OSC_PORT: "5005"
      A2F_URL: http://audio2face-nim:8011
      SOMATIC_TARGET_FPS: "60"
    ports:
      - "${SOMATIC_PORT:-6060}:6060" # HTTP ingest
    depends_on:
      audio2face-nim:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6060/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [ genesis-net ]

  sensor-mesh:
    image: cle/sensor-mesh:genesis
    command: ["node", "dist/mcp-server.js"]
    build:
      context: packages/sensor-mesh
      dockerfile: Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 4200
      REDIS_URL: redis://:${REDIS_PASSWORD:-cle_redis}@redis:6379
    ports:
      - "4201:4200"
    depends_on:
      - redis
    networks: [ genesis-net ]

  a2f-osc-bridge:
    # Python sidecar  polls A2F NIM REST, broadcasts blendshapes via OSC/UDP
    # Alternative to somatic-bridge for direct UE5 OSC without HTTP intermediary
    image: python:3.11-slim
    container_name: cle-a2f-osc-bridge
    <<: *restart-policy
    profiles: [ omnimedia ]
    command: >
      bash -c "pip install -q python-osc requests &&
               python /app/a2f_osc_bridge.py
               --a2f-url http://audio2face-nim:8011
               --osc-host ${UE5_OSC_HOST:-host.docker.internal}
               --osc-port ${UE5_OSC_PORT:-5005}
               --fps ${A2F_BRIDGE_FPS:-60}"
    volumes:
      - ./packages/somatic/scripts/a2f_osc_bridge.py:/app/a2f_osc_bridge.py:ro
    depends_on:
      audio2face-nim:
        condition: service_healthy
    networks: [ genesis-net ]

  #  CLOUDFLARE TUNNEL  Sovereign NAS Ingress 
  # T-STEALTH-001: Zero exposed ports. Zero IP leakage. Your home IP stays hidden.
  # Setup:
  #   1. cloudflared tunnel create cle-genesis
  #   2. Copy output UUID to CLOUDFLARE_TUNNEL_ID in .env
  #   3. Copy credentials JSON to infra/stealth/cloudflared/creds.json
  #   4. Add all hostnames in infra/stealth/cloudflared/config.yml to Cloudflare DNS
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cle-cloudflared
    <<: *restart-policy
    # Token-auth mode: no creds.json needed  authenticates via CLOUDFLARE_TUNNEL_TOKEN JWT
    # Token retrieved from CF API: GET /accounts/{id}/cfd_tunnel/{tunnelId}/token
    command: tunnel --config /etc/cloudflared/config.yml run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - CLOUDFLARE_TUNNEL_ID=${CLOUDFLARE_TUNNEL_ID}
      - TUNNEL_DOMAIN=${TUNNEL_DOMAIN:-cleengine.systems}
    volumes:
      - ./infra/stealth/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    networks: [ genesis-net ]
    healthcheck:
      test: [ "CMD", "cloudflared", "tunnel", "info" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # No profile gate  cloudflared is always-on sovereign infrastructure

  #  COMET C1  NAS Always-On Browser Agent 
  # T-STEALTH-003: Persistent Playwright/Chromium agent on NAS
  # MCP SSE endpoint: http://NAS_IP:7200/sse (or comet-c1.yourdomain.com via tunnel)
  # Agent ID: comet-C1 | Tags: nas-persistent, web-research, stealth
  comet-c1:
    image: cle/comet-c1:genesis
    build:
      context: .
      dockerfile: packages/cle-browser/Dockerfile.c1-nas
    container_name: cle-comet-c1
    <<: *restart-policy
    ports:
      - "${COMET_C1_PORT:-7200}:7200"
    environment:
      <<: *common-env
      COMET_AGENT_ID: comet-C1
      COMET_WINDOW: C1
      COMET_WORKSTREAM: comet-browser
      COMET_CAPABILITIES: nas-persistent,web-research,stealth,dispatch-worker
      COMET_HEADLESS: "true"
      COMET_PORT: 7200
      COMET_MEMORY_DIR: /app/data/sessions
      DISPATCH_URL: http://dispatch:5150
      GENKIT_URL: http://genkit:4000
      # Chromium flags for stability in container
      CHROMIUM_FLAGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu --single-process"
      # Privacy: route all browser traffic through NAS network (or proxy if set)
      HTTP_PROXY: ${COMET_C1_PROXY:-}
      HTTPS_PROXY: ${COMET_C1_PROXY:-}
      NO_PROXY: "localhost,127.0.0.1,dispatch,genkit,gateway"
    volumes:
      - comet_c1_data:/app/data
    depends_on:
      dispatch:
        condition: service_healthy
    networks: [ genesis-net ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7200/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s # Playwright takes a moment to warm up
    # Security: read-only root filesystem with explicit writable mounts
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m # Chromium temp files
      - /dev/shm:size=1g # Shared memory for Chromium (avoids /dev/shm too small crashes)

  #  Operational MCP Offerings 


  mcp-fetch-proxy:
    image: cle/mcp-fetch-proxy:genesis
    build:
      context: packages/mcp-fetch-proxy
    <<: *restart-policy
    ports:
      - "7070:7070"
    networks:
      - genesis-net

  ollama-mcp:
    image: cle/ollama-mcp:genesis
    build:
      context: packages/ollama-mcp
    <<: *restart-policy
    environment:
      <<: *common-env
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    networks:
      - genesis-net

  #  Home Assistant 

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    environment:
      - TZ=America/New_York
    volumes:
      - homeassistant_data:/config
    network_mode: host
    restart: unless-stopped

  #  HOLYCLAUDE  Sovereign Remote AI Workplace 
  holyclaude:
    image: coderluii/holyclaude:latest
    container_name: holyclaude
    shm_size: 2g
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      - "${HOLYCLAUDE_PORT:-3059}:3001"
    volumes:
      - /app/holyclaude-data:/home/claude/.claude:rw
      - /app/creative-liberation-engine:/workspace:rw
    environment:
      TZ: America/New_York
      PUID: 1026
      PGID: 100
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: on-failure:5
    networks: [ genesis-net ]

  #  CORTEX SIGNUP  Autonomous Registration Agent 
  cortex-signup:
    image: cle/cortex-signup:genesis
    build:
      context: services/harvesters
      dockerfile: Dockerfile
    container_name: cle-cortex-signup
    <<: *restart-policy
    environment:
      <<: *common-env
      DISPATCH_URL: http://dispatch:5150
      GENKIT_URL: http://genkit:4000
      CORTEX_PASSWORD: ${CORTEX_PASSWORD:-WholeTroutMedia!2026}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_D1_DB_ID: ${CF_D1_DB_ID:-}
      AGENT_MAIL_API_KEY: ${AGENT_MAIL_API_KEY:-}
      PYTHONUNBUFFERED: 1
    depends_on:
      dispatch:
        condition: service_healthy
    networks: [ genesis-net ]
    volumes:
      - cortex_signup_data:/app/data
      - /app/creative-liberation-engine/runtime/logs:/app/creative-liberation-engine/runtime/logs
      - /app/creative-liberation-engine/runtime/registry:/app/creative-liberation-engine/runtime/registry

  cortex-omni-watcher:
    image: 127.0.0.1:5000/cortex-omni-watcher:latest
    container_name: cortex-omni-watcher
    build:
      context: ./services/cortex-omni-watcher
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /app/creative-liberation-engine/surfaces/spatial-os/public:/app/creative-liberation-engine/surfaces/spatial-os/public
      - /app/creative-liberation-engine/playwright-profile:/app/creative-liberation-engine/playwright-profile
    environment:
      - NODE_ENV=production
      - DISPATCH_URL=http://dispatch:5150
    networks:
      - genesis-net
    labels:
      - cle.service=cortex-omni-watcher
      - cle.role=ecosystem-watcher
      - cle.tier=infra
    deploy:
      resources:
        limits:
          memory: 1g


  flipboard-sentinel:
    build: ./services/packages/flipboard-sentinel
    container_name: flipboard-sentinel
    restart: unless-stopped
    volumes:
      - /app/creative-liberation-engine/runtime:/app/creative-liberation-engine/runtime
      - /app/creative-liberation-engine/services/packages/flipboard-sentinel/src:/app/src
    env_file:
      - ./services/packages/flipboard-sentinel/.env
    environment:
      - NODE_ENV=production
      - TZ=America/New_York
      - NAS_RUNTIME_PATH=/app/creative-liberation-engine/runtime
      - DISPATCH_URL=http://dispatch:5150
      - GENKIT_BASE_URL=http://genkit:4000
    networks:
      - genesis-net
    labels:
      - cle.service=flipboard-sentinel

  ollama-proxy:
    image: python:3-alpine
    container_name: creative-liberation-engine-ollama-proxy
    volumes:
      - ./scratch/nas_tcp_proxy.py:/app/proxy.py:ro
    command: python3 /app/proxy.py
    network_mode: host
    restart: unless-stopped

#  Networks 

networks:
  genesis-net:
    driver: bridge

#  Volumes 
volumes:
  postgres_data: # redis_data is external so CI teardown (--volumes) never wipes persistent cache

  redis_data:
    external: true
    name: genesis-redis-data
  chromadb_data:
  forgejo_data:
  ghost_screenshots:
  ghost_reports:
  caspar_media:
  caspar_templates:
  ollama_data:
  comet_memory:
 
  # dispatch_data: removed  dispatch now uses a sovereign bind-mount:
  #   /volume2/cle-engine/dispatch/data  container:/data
  # This guarantees dispatch.db survives any container restart or stack teardown.
  nas_assets:
    external: true
    name: genesis-nas-assets
  genmedia_output:
  ambient_worker_data:
  ntfy_data:
  comet_c1_data: # COMET C1 NAS agent  persistent browser sessions + SQLite memory
  a2f_nim_cache: # NVIDIA Audio2Face NIM model weights cache
  homeassistant_data:
  workspace_mcp_creds:
  cortex_signup_data:

